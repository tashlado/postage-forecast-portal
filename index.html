<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --brand:#0000FF; --brand-lo:#0000C2; --brand-tint:#F0F0FF;
  --ink:#0B0B0F; --ink-2:#3F4451; --ink-3:#6B7280;
  --line:#E4E6EC; --line-2:#C8CBD4;
  --bg:#F7F8FA; --surface:#FFFFFF;
  --ok:#0F8A5F; --warn:#B8730A; --err:#C6273E;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
a{color:var(--brand)}

/* ---- header ---- */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:20px;padding:10px 20px;max-width:1400px;margin:0 auto}
.logo{height:22px;width:auto;display:block}
/* Beside the logo, on its baseline — not stacked. Reuses the active nav tab's
   13px/500 and --ink rather than introducing a title style, and sits inside
   .hlogo so the flex gap between logo and name is tighter than the header's. */
.hlogo{display:flex;align-items:center;gap:9px}
.hlogo .pname{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
/* overflow:hidden, not auto: the row must never grow a scrollbar, and scrollWidth
   against clientWidth is how fitNav decides what to collapse. The More menu lives
   outside nav for that reason — inside, overflow:hidden would clip it. */
nav{display:flex;gap:2px;flex:1;min-width:0;overflow:hidden}
nav button,.navmore>button{padding:7px 11px;font-size:13px;color:var(--ink-3);
       border-radius:6px 6px 0 0;white-space:nowrap}
nav button:hover,.navmore>button:hover{color:var(--ink);background:var(--bg)}
nav button.on,.navmore>button.on{color:var(--ink);font-weight:500;
       box-shadow:inset 0 -2px 0 var(--brand)}
nav [hidden]{display:none}
nav.scrolls{overflow-x:auto}
.navmore{position:relative;flex:0 0 auto}
.navmore[hidden]{display:none}
.navmenu{position:absolute;top:calc(100% + 4px);left:0;min-width:170px;z-index:30;
       background:var(--surface);border:1px solid var(--line);border-radius:10px;
       box-shadow:0 12px 32px rgba(11,11,15,.16);padding:4px;display:flex;
       flex-direction:column;gap:2px}
.navmenu[hidden]{display:none}
.navmenu button{text-align:left;padding:7px 10px;font-size:13px;border-radius:7px;
       color:var(--ink-2);white-space:nowrap}
.navmenu button:hover{background:var(--bg);color:var(--ink)}
.navmenu button.on{color:var(--ink);font-weight:500;background:var(--brand-tint)}
.hactions{display:flex;align-items:center;gap:6px}
.hright{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);white-space:nowrap}
/* One chip, never two. Amber and green follow .badge.amber's pairing of a tint
   with an existing ink token. */
.chip{border-radius:10px;padding:2px 9px;font-size:11px;white-space:nowrap;
      background:var(--bg);color:var(--ink-3);border:1px solid transparent}
.chip.green{background:#E7F5EF;color:var(--ok)}
.chip.amber{background:#FFF4E0;color:var(--warn)}
.chip.err{background:#FDEBED;color:var(--err)}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
      border-radius:50%;background:var(--brand-tint);color:var(--brand-lo);
      font-size:11px;font-weight:500;letter-spacing:.02em;cursor:default}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:6px}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--warn);animation:pulse 1s infinite}
.dot.err{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.badge{background:var(--brand-tint);color:var(--brand-lo);border-radius:10px;padding:1px 8px;font-size:11px}
.badge.amber{background:#FFF4E0;color:var(--warn)}

/* ---- layout ---- */
main{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
.screen{display:none} .screen.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.card>h2{font-size:14px;font-weight:500;margin:0;padding:13px 16px;border-bottom:1px solid var(--line)}
.card>.body{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--ink-3)} .small{font-size:12px}
.right{text-align:right} .mono{font-variant-numeric:tabular-nums}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--ink-3);
   padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr.sel{background:var(--brand-tint)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg)}

/* ---- controls ---- */
.btn{padding:7px 13px;border-radius:var(--radius);border:1px solid var(--line-2);
     background:var(--surface);font-size:13px;color:var(--ink-2)}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-lo)}
.btn.danger{color:var(--err);border-color:#F0C9CF}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
input[type=text],input[type=date],input[type=number],select{
  padding:6px 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);width:100%}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
input.bad{border-color:var(--err);background:#FFF6F7}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.pill{display:inline-block;background:var(--brand-tint);color:var(--brand-lo);
      border-radius:4px;padding:1px 7px;font-size:11px}
.sev{border-radius:4px;padding:1px 7px;font-size:11px;font-weight:500}
.sev.ERROR{background:#FDEBED;color:var(--err)}
.sev.WARN{background:#FFF4E0;color:var(--warn)}
.sev.INFO{background:#EEF1F5;color:var(--ink-3)}
.total{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:2px solid var(--line);
       font-size:13px;font-weight:500}
.total.bad{color:var(--err)} .total.good{color:var(--ok)}
.empty{padding:32px;text-align:center;color:var(--ink-3);font-size:13px}
.err-box{background:#FDEBED;border:1px solid #F0C9CF;color:var(--err);
         padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px}
.ok-box{background:#EAF7F1;border:1px solid #BFE5D5;color:var(--ok);
        padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--line-2);
         border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;
         vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.load{padding:60px;text-align:center;color:var(--ink-3)}
.up{color:var(--err)} .down{color:var(--ok)}

/* ---- modal form ---- */
.back{position:absolute;inset:0;background:rgba(11,11,15,.42);display:flex;
      align-items:flex-start;justify-content:center;padding:60px 20px 40px;z-index:100}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:480px;
       box-shadow:0 18px 48px rgba(11,11,15,.22);overflow:hidden}
.modal h3{margin:0;padding:16px 20px 14px;font-size:16px;font-weight:500;
          border-bottom:1px solid var(--line)}
.modal .intro{margin:0;padding:12px 20px 0;font-size:13px;color:var(--ink-3)}
.modal .tiles{padding:14px 20px 4px;display:flex;flex-direction:column;gap:8px;
       max-height:56vh;overflow:auto}
.modal .tiles button{display:block;width:100%;text-align:left;cursor:pointer;
       padding:10px 12px;border:1px solid var(--line);border-radius:10px;
       background:var(--surface);font:inherit;color:inherit}
.modal .tiles button:hover,.modal .tiles button:focus{border-color:var(--brand);
       background:var(--brand-tint);outline:none}
.modal .tiles button .t{display:block;font-size:14px}
.modal .tiles button .s{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.modal .tiles button.all{border-style:dashed}
.modal .fbody{padding:12px 20px 0;font-size:13px;max-height:46vh;overflow:auto}
.modal .fbody table{width:100%;border-collapse:collapse;margin:8px 0 2px}
.modal .fbody th,.modal .fbody td{padding:4px 6px;border-bottom:1px solid var(--line);
       font-size:12px;text-align:left}
.modal .fbody th{color:var(--ink-3);font-weight:500}
.modal .fbody td.right,.modal .fbody th.right{text-align:right}
.modal .fbody .warn{margin-top:8px;padding:8px 10px;border-radius:8px;
       background:#FFF6E5;border:1px solid #F2DDB0;color:#7A5A12;font-size:12px}
.modal .fields{padding:16px 20px 4px;display:flex;flex-direction:column;gap:14px;
       max-height:56vh;overflow:auto}
.modal .fields .field label{font-size:12px;color:var(--ink-2)}
.modal .hint{font-size:11px;color:var(--ink-3);margin-top:2px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;
             border-top:1px solid var(--line);background:var(--bg)}
.modal .merr{margin:0 20px;padding:9px 11px;background:#FDEBED;border:1px solid #F0C9CF;
             color:var(--err);border-radius:8px;font-size:13px}
.inline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.inline input[type=checkbox]{width:auto}
/* ---- one dimension per dropdown: a closed control opening a tick-box panel ----
   Reads as a dropdown and keeps multi-select, which a <select> cannot express —
   the answer is often "these three methods", and values inside one dimension are
   ORed.

   The panel is position:FIXED, and that is not a style preference. .modal .fields
   is max-height:56vh;overflow:auto and .modal itself is overflow:hidden, so an
   absolutely-positioned panel gets clipped by both: it would appear cut off, or
   force the form to scroll to reveal it, which is the pushing-the-form-around
   behaviour this replaces. Fixed escapes both clips, at the cost of placing it
   from script (ckPlace) and re-placing it when the form scrolls or the window
   resizes. */
.checks{position:relative}
.checks .cksum{display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;
       font:inherit;font-size:13px;color:var(--ink-2);text-align:left;cursor:pointer;
       background:var(--surface);border:1px solid var(--line);border-radius:8px}
.checks .cksum:hover{border-color:var(--ink-3)}
.checks .cksum:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.checks.open .cksum{border-color:var(--brand)}
.checks .cnt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.checks .chev{font-size:10px;color:var(--ink-3);transition:transform .12s}
.checks.open .chev{transform:rotate(180deg)}
.checks .ckpanel{display:none;position:fixed;z-index:110;background:var(--surface);
       border:1px solid var(--line);border-radius:8px;
       box-shadow:0 10px 28px rgba(11,11,15,.18)}
.checks.open .ckpanel{display:block}
.checks .cacts{display:flex;gap:6px;padding:8px 11px 0}
.checks .cacts button{font:inherit;font-size:11px;color:var(--brand);padding:2px 8px;
       border-radius:5px;cursor:pointer;background:none;border:1px solid var(--line)}
.checks .cacts button:hover{background:var(--brand-tint)}
.checks .clist{display:flex;flex-wrap:wrap;gap:3px 10px;padding:8px 11px 10px;
       max-height:164px;overflow:auto}
.checks .clist label{display:flex;align-items:center;gap:6px;font-size:12px;
       color:var(--ink-2);cursor:pointer;min-width:calc(50% - 10px)}
.checks .clist input[type=checkbox]{width:auto;margin:0;flex:none}
.checks.none .cksum{border-color:var(--err)}
.checks.none .cnt{color:var(--err)}
.suffixed{display:flex;align-items:center;gap:6px}
.suffixed span{font-size:12px;color:var(--ink-3);white-space:nowrap}
</style>
</head>

<script>
/* ===================================================================
   State
   =================================================================== */
var S = {
  user:null, ref:{}, carriers:[], methods:[], surchargeTypes:[],
  calendar:[], hlIds:[], mdIds:[], scenarios:[], config:{}, status:{},
  rateBase:[], rateSurcharge:[], mixMethod:[], mixLP:[], mixCC:[],
  output:[], validation:[], recentAudit:[], actuals:[], snapshots:[],
  screen:'dashboard', loaded:false,
  sel:{ hlId:null, modellingId:null, regime:'CC', lp:'PARCEL', asAt:null,
        dashYear:null, mixSection:'method', adminSection:'carriers',
        histSection:'snapshots',
        chartHl:null,
        chartSeries:{f1:true,f2:true,f3:true,f4:true,a1:true,a2:true,a3:true,a4:true} }
};
/* Labels only. The keys are wired to S.screen, viewAdmin/wireAdmin and
   viewValidation, so 'admin' stays 'admin' however the tab is captioned. */
var TABS = [
  ['dashboard','Dashboard',null],
  ['rates','Rates','editRates'],
  ['mixes','Mixes','editMixes'],
  ['output','Output',null],
  ['actuals','Actuals',null],
  ['admin','Lookups','editStructure'],
  ['history','History','viewAudit'],
  ['validation','Checks',null],
  /* Last because it is reference material, not a step in the work. The order of
     everything above it was chosen deliberately and is left alone. */
  ['guide','Guide',null]
];

/* ===================================================================
   Server calls, with the save indicator wired in automatically
   =================================================================== */
var inflight = 0;

/**
 * The header's one status chip.
 *
 * It carries two unrelated facts that used to have an element each: whether your
 * last write reached the spreadsheet, and whether the forecast has been published
 * since the last change. They cannot share one element as raw markup, because
 * their writers are independent and interleave — setSave fires on every non-quiet
 * server call, renderStatus only when status data refreshes, so whichever wrote
 * last would erase the other. So both are state setters now, and this is the only
 * thing that touches the element.
 *
 * A write in flight or a failed write wins, because that is the more urgent and
 * the more perishable of the two; the publish state is what shows at rest. Never
 * both at once.
 *
 * A failed save shows "Not saved" with the server's message on hover rather than
 * printing the whole message into the header, which is part of what made the row
 * overflow. showError still puts it in the page (finding U6 — a failed save must
 * leave a visible trace).
 */
var saveState = 'ok', saveMsg = '';

function setSave(state, msg){
  saveState = state; saveMsg = msg || '';
  renderStatusChip();
}

function renderStatusChip(){
  var el = document.getElementById('status');
  if(!el) return;
  var cls = 'chip', text, tip;

  if(saveState === 'busy'){
    cls += ''; text = 'Saving…'; tip = 'Writing to the spreadsheet';
  } else if(saveState === 'err'){
    cls += ' err'; text = 'Not saved';
    tip = saveMsg || 'The last change did not save.';
  } else {
    var n = (S.status && S.status.pendingChanges) || 0;
    var published = !!(S.status && S.status.lastRun);
    if(n){
      cls += ' amber';
      text = n + ' unpublished';
      tip = n + ' change' + (n===1?'':'s') + ' made since the forecast was last published.';
    } else if(published){
      cls += ' green'; text = 'Published';
      tip = 'The published forecast matches the current inputs.';
    } else {
      cls += ' amber'; text = 'Not published';
      tip = 'The forecast has never been published.';
    }
  }

  el.className = cls;
  el.textContent = text;
  el.title = tip;
  /* The chip's width changes with its text, which changes how much room the tab
     row has. Re-fit rather than let a longer chip push the tabs into overflow. */
  fitNav();
}
function call(fn, args, onOk, onErr, quiet){
  if(!quiet){ inflight++; setSave('busy'); }
  google.script.run
    .withSuccessHandler(function(r){
      if(!quiet){ inflight--; if(inflight<=0){ inflight=0; setSave('ok'); } }
      if(onOk) onOk(r);
    })
    .withFailureHandler(function(e){
      if(!quiet){ inflight--; if(inflight<=0){ inflight=0; setSave('err'); } }
      var m = (e && e.message) ? e.message : String(e);
      if(onErr) onErr(m); else showError(m);
    })
    [fn].apply(null, args||[]);
}
window.addEventListener('beforeunload', function(e){
  if(inflight>0){ e.preventDefault(); e.returnValue=''; }
});

/* ===================================================================
   Helpers
   =================================================================== */
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function money(n,dp){ return (Number(n)||0).toFixed(dp===undefined?4:dp); }
function pct(n,dp){ return ((Number(n)||0)*100).toFixed(dp===undefined?2:dp)+'%'; }
function hlName(id){
  var h=S.hlIds.filter(function(x){return x.id===id;})[0];
  return h ? (h.brand+' '+h.geo+' '+h.treatmentType+(h.wlSplit&&h.wlSplit!=='*'?' '+h.wlSplit:'')) : ('High Level ID '+id);
}
function mdName(id){
  var m=S.mdIds.filter(function(x){return x.id===id;})[0];
  return m ? (m.carrier+' / '+m.method+' / '+m.letterParcel) : ('Modelling ID '+id);
}
function can(cap){ return S.user && (S.user.allAccess || S.user.capabilities[cap]); }
function showError(msg){
  var b=document.createElement('div'); b.className='err-box'; b.textContent=msg;
  var host=document.querySelector('.screen.on'); if(!host) return alert(msg);
  host.insertBefore(b, host.firstChild);
  setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 8000);
}
function showOk(msg){
  var b=document.createElement('div'); b.className='ok-box'; b.textContent=msg;
  var host=document.querySelector('.screen.on'); if(!host) return;
  host.insertBefore(b, host.firstChild);
  setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 5000);
}

/* ===================================================================
   Modal form
   -------------------------------------------------------------------
   Replaces window.prompt. A browser prompt cannot label its fields, so
   everything had to be crammed into one comma-separated string — which meant
   users had to remember the field order, and a raw date serial leaking into the
   prefill was invisible until someone looked closely at it.
   =================================================================== */
var openModal=null;

function closeForm(){
  /* The resize listener is on window, not on the modal, so removing the modal
     from the document does not take it with it — it would keep firing against a
     detached form for the life of the page. */
  if(openModal && openModal._ckReplace){
    window.removeEventListener('resize', openModal._ckReplace);
  }
  if(openModal && openModal.parentNode) openModal.parentNode.removeChild(openModal);
  openModal=null;
  document.onkeydown=null;
}

/**
 * One dimension as a dropdown: its name, what is selected, a chevron.
 *
 * Six dimensions open at once is a wall of tick boxes for a form whose answer is
 * usually All, so each is a closed control stating its own count — "All 5" reads
 * as an answer, where five ticked boxes read as work still to do. Opening one is
 * how you narrow it.
 *
 * A dropdown rather than a <select> because a select is single-choice and this is
 * not: values inside one dimension are ORed, so "these three methods" is a normal
 * answer and a select could not say it. So it is a button that looks like a select
 * and a floating panel of tick boxes — the multi-select control this form needs,
 * wearing the shape people expect.
 *
 * Everything is ticked unless the caller passes a list, because All is the useful
 * default for a bulk change and a form that opens on nothing selected invites a
 * change that matches nothing. A list ticks exactly its members, matched
 * case-insensitively so a value round-tripped through the server ticks the box it
 * came from, and opens the dropdown, since a narrowed dimension is the one thing
 * on this form worth seeing without a click.
 *
 * The data-ck* hooks and the value contract are deliberately unchanged from the
 * <details> version this replaces: all-ticked still leaves as '', anything else as
 * a list. Only the presentation moved.
 */
function checksField(f){
  var sel=f.value, want=null;
  if(Array.isArray(sel) && sel.length){
    want={};
    sel.forEach(function(v){ want[String(v).toUpperCase()]=1; });
  }
  /* The count is written here as well as by the wiring, so a collapsed row is
     never briefly blank on the way to saying the same thing. */
  var opts=f.options||[], on0=0;
  opts.forEach(function(o){
    var v=(o.value!==undefined?o.value:o);
    if(!want || want[String(v).toUpperCase()]) on0++;
  });
  var h='<div class="checks'+(want?' open':'')+'" data-ckgroup="'+esc(f.key)+'">';
  h+='<button type="button" class="cksum" data-cktoggle="'+esc(f.key)+'"'+
     ' aria-expanded="'+(want?'true':'false')+'">'+
     '<span>'+esc(f.label)+'</span>'+
     '<span class="cnt" data-ckcount="'+esc(f.key)+'">'+
     (on0===opts.length?'All '+opts.length:on0+' of '+opts.length)+'</span>'+
     '<span class="chev">▾</span></button>';
  h+='<div class="ckpanel" data-ckpanel="'+esc(f.key)+'">';
  h+='<div class="cacts">'+
     '<button type="button" data-ckall="'+esc(f.key)+'">All</button>'+
     '<button type="button" data-cknone="'+esc(f.key)+'">None</button></div>';
  h+='<div class="clist">';
  opts.forEach(function(o){
    var v=(o.value!==undefined?o.value:o), l=(o.label!==undefined?o.label:o);
    var on = want ? !!want[String(v).toUpperCase()] : true;
    h+='<label><input type="checkbox" data-ck="'+esc(f.key)+'" value="'+esc(v)+'"'+
       (on?' checked':'')+'>'+esc(l)+'</label>';
  });
  return h+'</div></div></div>';
}

/**
 * Put an open panel where its control is, in viewport coordinates.
 *
 * Needed because the panel is position:fixed to escape the form's overflow — see
 * the .ckpanel comment in the stylesheet. Flips above the control when there is
 * more room there, so the last dimension in a scrolled form does not open into
 * nothing.
 */
function ckPlace(group){
  var btn=group.querySelector('.cksum'), panel=group.querySelector('.ckpanel');
  if(!btn||!panel) return;
  var r=btn.getBoundingClientRect();
  panel.style.width=r.width+'px';
  panel.style.left=r.left+'px';
  /* Measured after .open is set, so offsetHeight is the real height. */
  var ph=panel.offsetHeight, room=window.innerHeight-r.bottom-8;
  panel.style.top=(ph>room && r.top-8>room ? r.top-ph-4 : r.bottom+4)+'px';
}

/** Shut every open dimension dropdown. Returns whether it shut anything. */
function ckCloseAll(root, except){
  var shut=false;
  Array.prototype.forEach.call(root.querySelectorAll('.checks.open'),function(g){
    if(g===except) return;
    g.classList.remove('open');
    var b=g.querySelector('.cksum');
    if(b) b.setAttribute('aria-expanded','false');
    shut=true;
  });
  return shut;
}

/**
 * cfg = { title, intro, body, saveLabel, fields:[...], onSave(values, done, fail) }
 * field = { key, label, type, value, options, hint, required, min, max, step,
 *           suffix, placeholder, openEnded }
 *   type: text | number | date | select | month | checks
 *
 * A 'checks' field is a set of tick boxes standing in for one dimension, not one
 * value. Its value in and out is the list of codes ticked, with the single
 * exception that every box ticked is '' — All — so a caller reading the result
 * cannot tell "all of them" from the old single-select All, and does not need to.
 *
 * cfg.body is a block of markup shown above the fields, for a step that has
 * something to show rather than something to fill in — a table of what a bulk
 * change would do, or a set of choices to click. Like cfg.intro and field.hint it
 * is injected as raw HTML, so every value interpolated into it must go through
 * esc().
 *
 * cfg.afterRender(root, close) runs once the modal is in the document, so a
 * caller can wire up whatever it put in cfg.body. cfg.saveLabel:null leaves out
 * the primary button entirely, for a step where the choice IS the action and
 * there is nothing to confirm — the only way past it is to make a choice or
 * cancel.
 */
function openForm(cfg){
  closeForm();
  var back=document.createElement('div');
  back.className='back';

  var h='<div class="modal" role="dialog" aria-modal="true">';
  h+='<h3>'+esc(cfg.title)+'</h3>';
  if(cfg.intro) h+='<p class="intro">'+cfg.intro+'</p>';
  if(cfg.body) h+='<div class="fbody">'+cfg.body+'</div>';
  h+='<div class="merr" id="mErr" style="display:none"></div>';
  h+='<div class="fields">';

  cfg.fields.forEach(function(f){
    h+='<div class="field">';
    /* A checks row carries its own name in the summary, so a label above it would
       say everything twice. */
    if(f.type!=='checks'){
      h+='<label for="mf_'+f.key+'">'+esc(f.label)+
         (f.required?' <span style="color:var(--err)">*</span>':'')+'</label>';
    }
    if(f.type==='select'){
      h+='<select id="mf_'+f.key+'">';
      if(!f.required) h+='<option value=""></option>';
      (f.options||[]).forEach(function(o){
        var v=(o.value!==undefined?o.value:o), l=(o.label!==undefined?o.label:o);
        h+='<option value="'+esc(v)+'"'+(String(v)===String(f.value)?' selected':'')+'>'+
           esc(l)+'</option>';
      });
      h+='</select>';
    } else if(f.type==='checks'){
      h+=checksField(f);
    } else if(f.suffix){
      h+='<div class="suffixed"><input id="mf_'+f.key+'" type="'+(f.type||'text')+'"'+
         (f.step?' step="'+f.step+'"':'')+(f.min!==undefined?' min="'+f.min+'"':'')+
         (f.max!==undefined?' max="'+f.max+'"':'')+
         ' value="'+esc(f.value===null||f.value===undefined?'':f.value)+'"'+
         (f.placeholder?' placeholder="'+esc(f.placeholder)+'"':'')+'>'+
         '<span>'+esc(f.suffix)+'</span></div>';
    } else {
      h+='<input id="mf_'+f.key+'" type="'+(f.type==='month'?'date':(f.type||'text'))+'"'+
         (f.step?' step="'+f.step+'"':'')+(f.min!==undefined?' min="'+f.min+'"':'')+
         (f.max!==undefined?' max="'+f.max+'"':'')+
         (f.readonly?' readonly style="background:var(--bg);color:var(--ink-3)"':'')+
         ' value="'+esc(f.value===null||f.value===undefined?'':f.value)+'"'+
         (f.placeholder?' placeholder="'+esc(f.placeholder)+'"':'')+'>';
    }
    if(f.openEnded){
      h+='<label class="inline" style="margin-top:6px"><input type="checkbox" id="mo_'+f.key+'"'+
         (String(f.value).indexOf('9999')===0?' checked':'')+'> No end date</label>';
    }
    if(f.hint) h+='<div class="hint">'+f.hint+'</div>';
    h+='</div>';
  });

  h+='</div><div class="acts">'+
     '<button class="btn" id="mCancel">Cancel</button>'+
     (cfg.saveLabel===null?'':
       '<button class="btn primary" id="mSaveBtn">'+esc(cfg.saveLabel||'Save')+'</button>')+
     '</div></div>';
  back.innerHTML=h;
  document.body.appendChild(back);
  openModal=back;

  function fail(msg){
    var e=back.querySelector('#mErr');
    e.style.display='block'; e.textContent=msg;
    var b=back.querySelector('#mSaveBtn'); b.disabled=false; b.textContent=cfg.saveLabel||'Save';
  }

  cfg.fields.forEach(function(f){
    if(!f.openEnded) return;
    var cb=back.querySelector('#mo_'+f.key), inp=back.querySelector('#mf_'+f.key);
    if(!cb || !inp) return;      // one missing element should not kill the form
    function sync(){
      if(cb.checked){ inp.value='9999-12-31'; inp.disabled=true; }
      else { if(inp.value==='9999-12-31') inp.value=''; inp.disabled=false; }
    }
    cb.onchange=sync; sync();
  });

  /* Tick boxes: All, None, and a count saying which of the two you are on —
     "every box ticked" and "most boxes ticked" look alike at a glance and mean
     very different things to a bulk write. */
  cfg.fields.forEach(function(f){
    if(f.type!=='checks') return;
    var boxes=back.querySelectorAll('[data-ck="'+f.key+'"]');
    var cnt=back.querySelector('[data-ckcount="'+f.key+'"]');
    var group=back.querySelector('[data-ckgroup="'+f.key+'"]');
    if(!boxes.length || !cnt || !group) return;   // one missing element must not kill the form
    function sync(){
      var n=0;
      Array.prototype.forEach.call(boxes,function(b){ if(b.checked) n++; });
      cnt.textContent = n===boxes.length ? 'All '+boxes.length
                      : (n===0 ? 'None' : n+' of '+boxes.length);
      /* toggle, not className=, so it cannot wipe the 'open' class out from under
         the dropdown every time a box is ticked. */
      group.classList.toggle('none', n===0);
    }
    Array.prototype.forEach.call(boxes,function(b){ b.onchange=sync; });
    var all=back.querySelector('[data-ckall="'+f.key+'"]');
    var none=back.querySelector('[data-cknone="'+f.key+'"]');
    if(all) all.onclick=function(){
      Array.prototype.forEach.call(boxes,function(b){ b.checked=true; }); sync(); };
    if(none) none.onclick=function(){
      Array.prototype.forEach.call(boxes,function(b){ b.checked=false; }); sync(); };

    /* Open one at a time: two panels floating over each other is a stack of
       tick boxes with no way to tell which dimension you are narrowing. */
    var toggle=back.querySelector('[data-cktoggle="'+f.key+'"]');
    if(toggle) toggle.onclick=function(){
      var wasOpen=group.classList.contains('open');
      ckCloseAll(back, group);
      group.classList.toggle('open', !wasOpen);
      toggle.setAttribute('aria-expanded', wasOpen?'false':'true');
      if(!wasOpen) ckPlace(group);
    };
    if(group.classList.contains('open')) ckPlace(group);
    sync();
  });

  /* A fixed panel does not travel with the form, so re-place it when the form
     scrolls or the window changes size. Cheap, and the alternative — closing on
     scroll — loses a half-made selection to a stray trackpad nudge. */
  var ckReplace=function(){
    Array.prototype.forEach.call(back.querySelectorAll('.checks.open'), ckPlace);
  };
  var fieldsBox=back.querySelector('.fields');
  if(fieldsBox) fieldsBox.addEventListener('scroll', ckReplace);
  window.addEventListener('resize', ckReplace);
  back._ckReplace=ckReplace;    // so closeForm can take the window listener off again

  back.querySelector('#mCancel').onclick=closeForm;
  back.onclick=function(e){
    if(e.target===back) return closeForm();
    /* A click anywhere in the form that is not inside a dropdown shuts the open
       one, which is the behaviour a dropdown is expected to have and the reason
       the panel needs no scrim of its own. Clicking a tick box is inside .checks
       — the panel is still a DOM child of it, fixed positioning notwithstanding —
       so ticking does not close what you are ticking. */
    if(!(e.target.closest && e.target.closest('.checks'))) ckCloseAll(back);
  };
  document.onkeydown=function(e){
    if(e.key!=='Escape') return;
    /* Escape shuts an open dropdown first, and the form only when none is open,
       so it cannot throw away a part-filled bulk change because a panel happened
       to be showing. */
    if(ckCloseAll(back)) return;
    closeForm();
  };

  if(cfg.afterRender) cfg.afterRender(back, closeForm);

  var saveBtn=back.querySelector('#mSaveBtn');
  if(saveBtn) saveBtn.onclick=function(){
    var vals={}, missing=[], unticked=[];
    cfg.fields.forEach(function(f){
      if(f.type==='checks'){
        var boxes=back.querySelectorAll('[data-ck="'+f.key+'"]');
        var picked=[];
        Array.prototype.forEach.call(boxes,function(b){ if(b.checked) picked.push(b.value); });
        if(!picked.length) unticked.push(f.label);
        /* Every box ticked is sent as All — the empty value the server has always
           understood — not as a list of everything that happens to exist today. So
           a method added next month falls inside a change made by ticking All, and
           the audit trail records All rather than reciting a list that was complete
           only on the day it was written. */
        vals[f.key] = picked.length===boxes.length ? '' : picked;
        return;
      }
      var el=back.querySelector('#mf_'+f.key);
      var v=el?el.value:(f.value===undefined?'':f.value);
      if(f.required && String(v).trim()==='') missing.push(f.label);
      vals[f.key]=v;
    });
    if(missing.length) return fail('Please fill in: '+missing.join(', '));
    if(unticked.length) return fail('Nothing is ticked under: '+unticked.join(', ')+
      '. Tick the ones you mean, or press All.');
    var b=back.querySelector('#mSaveBtn');
    b.disabled=true; b.textContent='Saving…';
    cfg.onSave(vals, closeForm, fail);
  };

  var first=back.querySelector('.fields input:not([disabled]):not([type=checkbox]), '+
                              '.fields select, .tiles button');
  if(first) first.focus();
}

/** Options helpers for the selects. */
function optsRef(list){
  return (S.ref[list]||[]).map(function(v){
    return { value:v.code, label:v.label+' ('+v.code+')' }; });
}
function optsHl(){
  return S.hlIds.map(function(h){
    return { value:h.id, label:h.id+' — '+hlName(h.id) }; });
}
function todayOrHorizon(){
  return S.config.horizonStart || '';
}

/* ===================================================================
   Boot
   =================================================================== */
function boot(){
  call('initApp', [], function(init){
    S.user=init.user; S.ref=init.reference; S.carriers=init.carriers;
    S.methods=init.methods; S.surchargeTypes=init.surchargeTypes;
    S.calendar=init.calendar; S.hlIds=init.highLevelIds; S.mdIds=init.modellingIds;
    S.scenarios=init.scenarios; S.config=init.config; S.status=init.status;
    S.sel.hlId = S.hlIds.length ? S.hlIds[0].id : null;
    S.sel.asAt = S.config.horizonStart;

    var who=document.getElementById('who');
    who.innerHTML='<span class="avatar" id="whoAvatar"></span>';
    var av=document.getElementById('whoAvatar');
    av.textContent=initialsOf(S.user.name);
    av.title=S.user.name+' · '+S.user.role;
    document.getElementById('boot').style.display='none';
    document.getElementById('app').style.display='block';
    /* Actions and the chip first: renderNav measures the room left over, and a nav
       measured before they exist concludes everything fits and then overflows. */
    renderHeaderActions(); renderStatus(); renderNav(); renderAll();

    call('loadAllAppData', [], function(d){
      S.rateBase=d.rateBase; S.rateSurcharge=d.rateSurcharge;
      S.mixMethod=d.mixMethod; S.mixLP=d.mixLetterParcel; S.mixCC=d.mixColdChain;
      S.output=d.output; S.validation=d.validation; S.recentAudit=d.recentAudit;
      S.actuals=d.actuals||[]; S.snapshots=d.snapshots||[];
      S.status=d.status; S.loaded=true;
      renderStatus(); renderAll();
    }, function(m){ showError('Could not load data: '+m); }, true);
  }, function(m){
    document.getElementById('boot').innerHTML =
      '<div class="err-box" style="max-width:520px;margin:0 auto;text-align:left">'+esc(m)+'</div>';
  }, true);
}

/**
 * The tab row, which collapses rather than scrolls.
 *
 * These four are always on the bar; everything else moves into More, from the
 * right, only as far as it has to. At a width that fits all eight, More disappears
 * and nothing is collapsed.
 */
var NAV_ALWAYS = ['dashboard', 'rates', 'mixes', 'output'];

function navTabs(){
  return TABS.filter(function(t){ return !t[2] || can(t[2]); });
}

/* One place decides what a tab click means, so a tab in the bar and the same tab
   in the More menu cannot drift apart. */
function selectTab(key){
  S.screen = key;
  closeNavMenu();
  renderNav();
  renderAll();
}

function renderNav(){
  var n = document.getElementById('nav');
  if(!n) return;
  n.innerHTML = navTabs().map(function(t){
    return '<button data-s="' + t[0] + '" class="' + (S.screen===t[0] ? 'on' : '') + '">' +
           esc(t[1]) + '</button>';
  }).join('');
  Array.prototype.forEach.call(n.querySelectorAll('button[data-s]'), function(b){
    b.onclick = function(){ selectTab(b.getAttribute('data-s')); };
  });

  var mb = document.getElementById('navMoreBtn');
  if(mb) mb.onclick = function(e){ e.stopPropagation(); toggleNavMenu(); };
  fitNav();
}

/**
 * Hide tabs into More until the row stops overflowing.
 *
 * Measured rather than guessed at a breakpoint, because the room available depends
 * on the header's other contents — the two action buttons and a status chip whose
 * width changes with its text. Everything is shown first, so a window that grows
 * gets its tabs back.
 */
function fitNav(){
  var n = document.getElementById('nav');
  var more = document.getElementById('navMore');
  var menu = document.getElementById('navMenu');
  if(!n || !more || !menu) return;

  var tabs = Array.prototype.slice.call(n.querySelectorAll('button[data-s]'));
  tabs.forEach(function(b){ b.hidden = false; });
  more.hidden = true;
  n.classList.remove('scrolls');
  if(n.scrollWidth <= n.clientWidth) { closeNavMenu(); menu.innerHTML = ''; return; }

  /* More itself takes room, so reveal it before measuring what still has to go. */
  more.hidden = false;
  var moved = [];
  for(var i = tabs.length - 1; i >= 0 && n.scrollWidth > n.clientWidth; i--){
    if(NAV_ALWAYS.indexOf(tabs[i].getAttribute('data-s')) >= 0) continue;
    tabs[i].hidden = true;
    moved.unshift(tabs[i].getAttribute('data-s'));
  }

  if(!moved.length){
    /* Only the always-visible four are left and they still do not fit. Collapsing
       further is not allowed, so let them be tight rather than hide More over an
       empty menu. */
    more.hidden = true;
    closeNavMenu();
    menu.innerHTML = '';
    if(n.scrollWidth > n.clientWidth) n.classList.add('scrolls');
    return;
  }

  var labels = {};
  navTabs().forEach(function(t){ labels[t[0]] = t[1]; });
  menu.innerHTML = moved.map(function(k){
    return '<button data-ms="' + k + '" class="' + (S.screen===k ? 'on' : '') + '">' +
           esc(labels[k] || k) + '</button>';
  }).join('');
  Array.prototype.forEach.call(menu.querySelectorAll('button[data-ms]'), function(b){
    b.onclick = function(e){ e.stopPropagation(); selectTab(b.getAttribute('data-ms')); };
  });

  /* The active tab may be one of the collapsed ones, in which case More carries the
     highlight so the bar still shows where you are. */
  var mb = document.getElementById('navMoreBtn');
  if(mb) mb.className = (moved.indexOf(S.screen) >= 0) ? 'on' : '';

  /* Everything collapsible has gone and it still does not fit — a viewport narrower
     than the four pinned tabs. Rather than clip one out of reach, let this one case
     scroll. It is a safety net, not the normal path. */
  if(n.scrollWidth > n.clientWidth) n.classList.add('scrolls');
}

function toggleNavMenu(){
  var menu = document.getElementById('navMenu');
  var mb = document.getElementById('navMoreBtn');
  if(!menu) return;
  var open = menu.hidden;
  menu.hidden = !open;
  if(mb) mb.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function closeNavMenu(){
  var menu = document.getElementById('navMenu');
  var mb = document.getElementById('navMoreBtn');
  if(menu) menu.hidden = true;
  if(mb) mb.setAttribute('aria-expanded', 'false');
}

/* A click anywhere else, or Escape, closes the menu — the modal builder already
   sets document.onkeydown while open, so this listens rather than assigns. */
document.addEventListener('click', closeNavMenu);
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeNavMenu(); });
window.addEventListener('resize', function(){
  clearTimeout(window._navFit);
  window._navFit = setTimeout(fitNav, 80);
});

/** "Tash Lado" -> "TL", with the full name and role on hover. */
function initialsOf(name){
  var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  if(parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
}

/**
 * Preview changes and Publish, in the header so they are reachable from any tab.
 *
 * Neither needs to know which tab you are on — both have always called
 * previewOutput(1) / publishOutput(1) with a hardcoded scenario. What they do need
 * is somewhere to put the answer, and that is #oResult, which only exists inside
 * viewOutput(). So the header buttons switch to the Output tab first and then run
 * the same action, rendering the same result in the same place. Clicked while
 * already on Output, they behave exactly as they did before.
 *
 * Rendered from boot() once initApp has returned, because the two capability
 * checks below need S.user.
 */
function renderHeaderActions(){
  var el=document.getElementById('hactions');
  if(!el) return;
  var h='';
  /* The "Preview writes nothing" note that used to sit beside these on the Output
     tab moves to a tooltip rather than being lost — the header has no room for it. */
  if(can('runCalc'))       h+='<button class="btn sm" id="hPrev" '+
    'title="Runs the model and shows what would change. Writes nothing.">Preview</button>';
  if(can('publishOutput')) h+='<button class="btn sm primary" id="hPub" '+
    'title="Overwrites OUTPUT and OUTPUT_Detail with a fresh run.">Publish</button>';
  el.innerHTML=h;
  fitNav();      /* these buttons take room the tab row was measuring against */

  var p=el.querySelector('#hPrev');
  if(p) p.onclick=function(){ gotoOutputThen(runPreviewOutput); };
  /* Ask before jumping, not after: declining should leave you where you were. */
  var pb=el.querySelector('#hPub');
  if(pb) pb.onclick=function(){
    if(!confirm('Publish the forecast? This overwrites OUTPUT and OUTPUT_Detail.')) return;
    gotoOutputThen(runPublishOutput);
  };
}

/* Switch to Output if we are not there, then act. renderAll is synchronous, so
   #oResult exists by the time fn runs. */
function gotoOutputThen(fn){
  if(S.screen!=='output') selectTab('output');
  fn();
}

/* Both actions render into #oResult, which is absent while the first data load is
   still running. Returning null rather than throwing keeps an early click from
   breaking the page. */
function outputResultEl(){
  var el=document.getElementById('oResult');
  if(!el) showError('Still loading — try again in a moment.');
  return el;
}

/* Kept as a name because three places call it when status data lands; the chip is

/**
 * The guide link, or nothing at all.
 *
 * target="_blank" is not a preference, it is the only thing that makes this work.
 * An Apps Script web app is served inside a sandbox iframe, so a same-frame link
 * navigates the iframe rather than the tab — and Google Docs refuses to be framed,
 * so the panel would go blank with no error a user could act on. rel="noopener"
 * goes with it: without it the opened tab gets a window.opener handle back into
 * this one.
 *
 * The URL comes from Config GUIDE_URL, so the doc can move without a deploy, and
 * an empty value renders nothing — a missing guide should leave no trace rather
 * than a dead link. It is escaped like any other value: Config is editable by
 * anyone with sheet access, which makes it untrusted input for this purpose.
 */
function guideLink(){
  var url=(S.config&&S.config.guideUrl)||'';
  if(!url) return '';
  /* Only http(s). A javascript: or data: URL in a Config cell would otherwise
     become a script that runs for every user who opens the dashboard. */
  if(!/^https?:\/\//i.test(url)) return '';
  return '<div class="card"><div class="body" style="padding:12px 14px">'+
         '<span style="font-size:13px">Postage Forecast Guide: </span>'+
         '<a href="'+esc(url)+'" target="_blank" rel="noopener" '+
         'style="font-size:13px;color:var(--brand);text-decoration:underline">'+
         'open the guide</a>'+
         '<span class="small muted" style="margin-left:8px">(opens in a new tab)</span>'+
         '</div></div>';
}

/* ===================================================================
   Guide — the portal's own text, from the Guide tab of the spreadsheet
   -------------------------------------------------------------------
   Rendered as portal content rather than embedded as a document, and sourced from
   the spreadsheet rather than from Google Docs. That combination avoids every
   problem the two document-based approaches had.

   An iframe of the doc's /preview URL worked without a new OAuth scope, but it is
   a document sitting in a box: it cannot be styled to match anything, its width
   and typography are its own, and whether Google will serve it inside a nested
   iframe at all depends on headers that cannot be checked from outside a browser.

   Reading the doc server-side — DocumentApp, or a Drive HTML export — would give
   text that can be styled, at the price of an OAuth scope this project does not
   have. Adding one forces EVERY user to re-authorise before the portal will load
   for them again, and it would need a cache, which is the thing that stops "live"
   being true.

   The spreadsheet needs neither. The spreadsheets scope is already granted, so
   nobody re-authorises; the sheet is already readable by everyone who can open the
   portal, so nothing has to be shared or published; and it is genuinely live,
   because initApp reads it on every page load with no cache in front of it.

   One row is one block: an optional Heading and a Body. Sort_Order decides the
   order, Active hides a row without deleting it. Editing the guide is editing a
   spreadsheet, which is what everyone maintaining this forecast already does.

   The document link is kept, when GUIDE_URL is set, as a pointer to the fuller
   version — the tab is a summary that lives where the work does, not a replacement
   for a long document.
   =================================================================== */

/* Held here rather than re-fetched on every render, because renderAll() runs on
   many unrelated state changes and each one would otherwise mean another HTTP call
   out to Google Docs. Fetched once per visit to the tab, with a Refresh button for
   when the document has just been edited. */
var guideDoc=null;

        '<div class="row" style="margin:0;align-items:center">'+

        '<span class="small muted" style="align-self:center">Read from the published '+
        'document. Edits in Google Docs appear here when you refresh.</span>';
  if(hasLink) h+='<span style="margin-left:auto"><a href="'+esc(url)+'" target="_blank" '+
     'rel="noopener" class="small" style="color:var(--brand);text-decoration:underline">'+
     'Open in Google Docs</a></span>';
  h+='</div></div></div><div id="gHost">'+loading()+'</div></div>';

}

function wireGuide(){

  if(guideDoc) renderGuide(); else loadGuide();

function loadGuide(){
  var host=document.getElementById('gHost'); if(!host) return;
  host.innerHTML='<div class="card"><div class="body">'+loading()+'</div></div>';
  call('getGuideDoc',[],function(r){ guideDoc=r; renderGuide(); },
    function(m){ host.innerHTML='<div class="card"><div class="empty">'+esc(m)+
      '</div></div>'; },true);
}

/**
 * Render the document's blocks as portal text.
 *
 * Everything arrives from the server as PLAIN TEXT — the server strips every tag
 * and decodes every entity — and every piece of it goes back through esc() here.
 * A published document is world-readable and therefore world-editable by whoever
 * owns it, so its content is treated as untrusted: the only HTML on this screen is
 * what this function writes.
 */
function renderGuide(){
  var host=document.getElementById('gHost'); if(!host||!guideDoc) return;
  var g=guideDoc;

  if(!g.ok){
    var fix='';
    if(g.reason==='no-pub-url'){
      fix='<br><br><span class="small">The published address is <strong>not</strong> the '+
          'same as the document\'s normal address and cannot be worked out from it — '+
          'publishing creates a separate one that looks like '+
          '<code>docs.google.com/document/d/e/2PACX-.../pub</code>. Copy it out of the '+
          '<strong>Publish to web</strong> dialog into <code>GUIDE_PUB_URL</code> on the '+
          'Config tab.</span>';
    }
    host.innerHTML='<div class="card"><div class="empty">'+esc(g.message||'The guide '+
      'could not be read.')+fix+'</div></div>';
    return;
  }

  if(!g.blocks.length){
    host.innerHTML='<div class="card"><div class="empty">The document is published but '+
      'appears to be empty.</div></div>';
    return;
  }

  /* One card, so the document reads as a document rather than as a stack of
     unrelated panels. Headings inside it carry the structure. */
  var h='<div class="card"><div class="body" style="font-size:13px;color:var(--ink-2);'+
        'line-height:1.6;padding:18px 20px">';
  var list=null;
  function closeList(){ if(list){ h+='<ul style="margin:6px 0 12px 20px">'+list+'</ul>';
    list=null; } }

  g.blocks.forEach(function(b){
    if(b.type==='bullet'){
      list=(list||'')+'<li style="margin:3px 0">'+esc(b.text)+'</li>';
      return;
    }
    closeList();
    if(b.type==='heading'){
      /* Google's heading levels mapped to two sizes. Six distinct sizes in a
         reference page is noise, and the document's own hierarchy rarely goes
         deeper than two in practice. */
      var big=(b.level||1)<=2;
      h+='<div style="font-size:'+(big?'15px':'13px')+';font-weight:500;'+
         'color:var(--ink);margin:'+(big?'20px 0 8px':'16px 0 6px')+'">'+
         esc(b.text)+'</div>';
      return;
    }
    h+='<p style="margin:0 0 10px">'+esc(b.text)+'</p>';
  });
  closeList();
  h+='</div></div>';

  /* Said once, at the bottom, because it is a limitation of reading a document as
     text and not something a reader should have to guess at from a gap. */
  var sk=g.skipped||{};
  if(sk.tables||sk.images){
    h+='<div class="card"><div class="body small muted">Not shown here: '+
       (sk.tables?sk.tables+' table'+(sk.tables===1?'':'s'):'')+
       (sk.tables&&sk.images?' and ':'')+
       (sk.images?sk.images+' image'+(sk.images===1?'':'s'):'')+
       '. This screen renders the document\'s text only — open it in Google Docs to '+
       'see those.</div></div>';
  }
  host.innerHTML=h;
}

/* ---- bulk update ----
   The two selects at the top of this screen pick one route. This picks a set of
   them, and does it in two questions.

   First WHICH CHARGE: the base rate, one named surcharge, or all of them. That is
   a popup with no default and no way past it but to choose, because it decides
   what the value on the next page even means — a base rate is currency per
   parcel, fuel is a fraction, the rest are amounts.

   Then WHICH ROUTES: every dimension opens with all of its values ticked, and
   unticking narrows that dimension only — the others are left alone. So ticking
   three methods changes those methods across every treatment type, brand and
   country that carries them. Values inside one dimension are ORed; the dimensions
   are ANDed with each other. The change lands on every existing rate that matches,
   as a new period, exactly as "Add rate change" does for one route.

   Courier group is deliberately absent from the dimensions: a bulk change always
   spans every courier. Carrier_Code is a real, separate column on Modelling_IDs —
   it can disagree with the carrier Dim_Method files a method under, and validation
   only warns — but it was taken out of the selector by request, and the server
   ignores it rather than defaulting it.

   Nothing is written until the preview is confirmed, and confirming sends back the
   planKey the preview issued, so it can only ever apply the set that was shown. */

var BULK_DIMENSIONS = [
  { key:'brand',         label:'Brand',          ref:'BRAND' },
  { key:'geo',           label:'Country',        ref:'GEO' },
  { key:'treatmentType', label:'Treatment type', ref:'TREATMENT_TYPE' },
  { key:'wlSplit',       label:'WL split',       ref:'WL_SPLIT' },
  { key:'method',        label:'Method',         src:'methods' },
  { key:'letterParcel',  label:'Class',          ref:'LETTER_PARCEL' }
];

/* Every real value, and only real values. All is now "every box ticked", and it
   still reaches the server as the empty selection — never a magic string, because
   a brand or method code called ALL is one data operation away, and a wildcard a
   data entry can impersonate is a wildcard waiting to widen somebody's rate
   change. */
function bulkDimOptions(d){
  var opts=[];
  if(d.src==='methods') S.methods.forEach(function(m){
    opts.push({ value:m.code, label:m.name+' ('+m.code+')' }); });
  else optsRef(d.ref).forEach(function(o){ opts.push(o); });
  return opts;
}

/* Step 1 — which charge. Base rate plus every active surcharge type, read from
   Dim_Surcharge on the server so a type added later needs no change here, plus
   All. No primary button: the choice is the action, so the only ways out are to
   pick one or to cancel. */
function bulkChargeTypePicker(){
  call('listChargeTypes',[],function(types){
    var b='<div class="tiles">';
    types.forEach(function(t){
      b+='<button data-ct="'+esc(t.chargeType)+'">'+
         '<span class="t">'+esc(t.name)+'</span>'+
         '<span class="s">'+esc(t.expressed)+'</span></button>';
    });
    b+='<button class="all" data-ct="ALL">'+
       '<span class="t">All charge types</span>'+
       '<span class="s">base rate and every surcharge — as a percentage uplift</span>'+
       '</button></div>';

    openForm({
      title:'Which charge are you changing?',
      intro:'A bulk change starts here, because what you type on the next page means '+
            'different things to different charges.',
      body:b,
      saveLabel:null,
      fields:[],
      afterRender:function(root, close){
        Array.prototype.forEach.call(root.querySelectorAll('[data-ct]'),function(btn){
          btn.onclick=function(){
            var ct=btn.getAttribute('data-ct');
            close();
            bulkRateForm(ct, types);
          };
        });
      }
    });
  });
}

/* Step 2 — which routes, and the new value. */
function bulkRateForm(chargeType, types, keep){
  var isAll = chargeType==='ALL';
  var def = (types||[]).filter(function(t){ return t.chargeType===chargeType; })[0] ||
            { name:chargeType, valueType:'RATE', expressed:'' };
  var prior = keep||{};
  var fields=[];

  BULK_DIMENSIONS.forEach(function(d,i){
    /* No ||'' on the value: undefined means "first time through, tick everything",
       and an empty string coming back from a preview means the same. An array
       ticks exactly what it names. */
    fields.push({ key:d.key, label:d.label, type:'checks', value:prior[d.key],
      options:bulkDimOptions(d),
      /* One short line, on the last row rather than the first, where it reads as
         a footnote to the six instead of a preamble to them. Everything else the
         rows say themselves. */
      hint:i===BULK_DIMENSIONS.length-1?'All couriers are always included.':'' });
  });

  fields.push({ key:'validFrom', label:'Effective from', type:'date', required:true,
    value:prior.validFrom||todayOrHorizon(),
    hint:'Whatever period is running on each matching route is shortened to the day before.' });
  fields.push({ key:'validTo', label:'Until', type:'date', required:true, openEnded:true,
    value:prior.validTo||'9999-12-31' });

  if(isAll){
    fields.push({ key:'value', label:'Change every charge by', type:'number', step:'0.01',
      required:true, value:prior.value===undefined?'':prior.value, suffix:'%',
      placeholder:'6',
      hint:'A percentage, because one figure cannot be a base rate and a fuel '+
           'percentage at once. Negative to reduce.' });
  } else {
    fields.push({ key:'value', label:'New '+(def.valueType==='RATE'?'rate per parcel':'value'),
      type:'number', step:'0.0001', required:true,
      value:prior.value===undefined?'':prior.value,
      placeholder:def.valueType==='PCT'?'0.1650':(def.valueType==='RATE'?'3.7800':'0.0550'),
      hint:def.valueType==='PCT'?'A fraction: 0.14 for 14%.':'' });
  }

  fields.push({ key:'sourceRef', label:'Where it came from', type:'text',
    value:prior.sourceRef||'', placeholder:'RM 2026 tariff, p.4',
    hint:'Written to every row this changes, alongside the batch reference.' });

  openForm({
    title:'Bulk update — '+(isAll?'all charge types':def.name),
    intro:isAll
      ? 'Every existing charge matching the dimensions below moves by the percentage '+
        'you give. Nothing is written until you confirm the preview.'
      : 'Every existing '+esc(def.name).toLowerCase()+' matching the dimensions below '+
        'is superseded by a new period. Nothing is written until you confirm the preview.',
    saveLabel:'Preview',
    fields:fields,
    onSave:function(v, done, fail){
      var dims={};
      BULK_DIMENSIONS.forEach(function(d){ dims[d.key]=v[d.key]||''; });
      var req={ chargeType:chargeType, dimensions:dims,
                validFrom:v.validFrom, validTo:v.validTo, value:Number(v.value),
                sourceRef:v.sourceRef, scenarioId:1, preview:true };
      call('bulkUpdateRates',[req],function(pv){
        done();
        bulkRateConfirm(chargeType, types, req, pv, v);
      }, fail);
    }
  });
}

/* Step 3 — the preview, and the only place a write can be authorised. */
function bulkRateConfirm(chargeType, types, req, pv, raw){
  var isAll = pv.mode==='PCT';
  var name = function(ct){
    var t=(types||[]).filter(function(x){ return x.chargeType===ct; })[0];
    return t?t.name:ct;
  };
  var show = function(n){ return money(n); };

  if(!pv.count){
    openForm({
      title:'Nothing matches',
      intro:'That selection matches no existing charge to supersede.',
      body:'<table><tbody>'+
           '<tr><td>Routes matching the dimensions</td><td class="right num">'+pv.routesMatched+'</td></tr>'+
           '<tr><td>…with no rate to supersede</td><td class="right num">'+pv.skippedNoRate+'</td></tr>'+
           '<tr><td>…outside what you can edit</td><td class="right num">'+pv.skippedNoScope+'</td></tr>'+
           '</tbody></table>'+
           '<div class="warn">A bulk update only ever changes charges that already '+
           'exist. It will not create one for a route that has none — that gap is '+
           'worth seeing on this screen rather than filling in silently.</div>',
      saveLabel:'Change the selection',
      fields:[],
      onSave:function(v, done){ done(); bulkRateForm(chargeType, types, raw); }
    });
    return;
  }

  var rowsWord = pv.count===1 ? '1 charge' : pv.count+' charges';
  var b='<table><tbody>'+
        '<tr><td>Charges to be superseded</td><td class="right num"><strong>'+pv.count+'</strong></td></tr>'+
        '<tr><td>'+(isAll?'Moving by':'New value on every one')+'</td>'+
        '<td class="right num"><strong>'+
        (isAll?(pv.value>=0?'+':'')+esc(String(pv.value))+'%':esc(show(pv.value)))+
        '</strong></td></tr>'+
        '<tr><td>Effective</td><td class="right num">'+esc(pv.validFrom)+
        (pv.validTo>='9999-01-01'?' onwards':' to '+esc(pv.validTo))+'</td></tr>'+
        '</tbody></table>';

  b+='<table><thead><tr><th>Charge</th><th class="right">Now</th>'+
     '<th class="right">Becomes</th><th class="right">Rates</th></tr></thead><tbody>';
  var mixed=0;
  pv.groups.forEach(function(g){
    mixed+=g.distinct.length;
    g.distinct.forEach(function(d,i){
      b+='<tr><td>'+(i===0?esc(name(g.chargeType)):'')+'</td>'+
         '<td class="right num">'+esc(show(d.from))+'</td>'+
         '<td class="right num">'+esc(show(d.to))+'</td>'+
         '<td class="right num">'+d.rows+'</td></tr>';
    });
  });
  b+='</tbody></table>';

  if(!isAll && mixed>1){
    b+='<div class="warn">These charges are not all the same today. Applying this '+
       'flattens '+esc(String(mixed))+' different values to one. If that is not what '+
       'you meant, narrow the selection.</div>';
  }
  if(isAll){
    b+='<div class="warn">This spans '+esc(String(pv.groups.length))+' charge type(s) '+
       'across both rate tables. Each moves by '+esc(String(pv.value))+'% of its own '+
       'current value.</div>';
  }
  if(pv.skippedNoRate||pv.skippedNoScope){
    b+='<div class="warn">Also matching the dimensions but left alone: '+
       pv.skippedNoRate+' charge(s) with no rate to supersede'+
       (pv.skippedNoScope?', '+pv.skippedNoScope+' route(s) outside what you can edit':'')+'.</div>';
  }
  b+='<div class="hint" style="margin-top:8px">Selection — '+esc(pv.selection)+'</div>';

  openForm({
    title:'Apply to '+rowsWord+'?',
    intro:'This is real pricing data. Read the numbers below before confirming.',
    body:b,
    saveLabel:'Apply to '+rowsWord,
    fields:[],
    onSave:function(v, done, fail){
      var apply={};
      for(var k in req) if(req.hasOwnProperty(k)) apply[k]=req[k];
      apply.preview=false; apply.planKey=pv.planKey;
      call('bulkUpdateRates',[apply],function(res){
        done();
        showOk(res.written+' charge(s) updated as batch '+res.batchRef+
               ' — '+res.rowsClosed+' period(s) closed, '+res.rowsCreated+' created.');
        reloadData();
      }, fail);
    }
  });
}
function reloadData(){
  call('loadAllAppData',[],function(d){
    S.rateBase=d.rateBase; S.rateSurcharge=d.rateSurcharge;
    S.mixMethod=d.mixMethod; S.mixLP=d.mixLetterParcel; S.mixCC=d.mixColdChain;
    S.output=d.output; S.validation=d.validation; S.recentAudit=d.recentAudit;
    S.actuals=d.actuals||[]; S.snapshots=d.snapshots||[]; S.status=d.status;
    renderStatus(); renderAll();
  },null,true);
}

/* ===================================================================
   Mixes
   =================================================================== */
var mixGrid=null;

function viewMixes(){
  if(!S.loaded) return '<div class="card"><div class="body">'+loading()+'</div></div>';
  var sec=S.sel.mixSection||'method';
  var tabs=[['method','Delivery method mix'],['lp','Letter / parcel split'],
            ['cc','Cold chain share']];
  var h='<div class="card"><div class="body" style="padding:10px 12px">';
  h+='<div style="display:flex;gap:2px">'+tabs.map(function(t){
     return '<button class="btn sm'+(sec===t[0]?' primary':'')+'" data-ms="'+t[0]+'">'+
            t[1]+'</button>'; }).join('')+'</div>';
  h+='</div></div>';
  if(sec==='method') h+=viewMixMethod();
  if(sec==='lp')     h+=viewMixLP();
  if(sec==='cc')     h+=viewMixCC();

}

function wireMixes(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-ms]'),function(b){
    b.onclick=function(){ S.sel.mixSection=b.getAttribute('data-ms'); renderAll(); };
  });
  var sec=S.sel.mixSection||'method';
  if(sec==='method') wireMixMethod();
  if(sec==='lp')     wireMixLP();
}

/* ---- delivery method mix ---- */
function viewMixMethod(){
  var h='<div class="card"><div class="body"><div class="row" style="margin:0">';
  h+='<div class="field" style="min-width:280px"><label>High Level ID</label>'+
     '<select id="mHl">'+S.hlIds.map(function(x){
        return '<option value="'+x.id+'"'+(x.id===S.sel.hlId?' selected':'')+'>'+
               x.id+' — '+esc(hlName(x.id))+'</option>';}).join('')+'</select></div>';
  h+='<div class="field"><label>Regime</label><select id="mReg">'+
     ['CC','AMBIENT'].map(function(v){return '<option'+(v===S.sel.regime?' selected':'')+'>'+v+'</option>';}).join('')+
     '</select></div>';
  h+='<div class="field"><label>Class</label><select id="mLp">'+
     ['PARCEL','LETTER'].map(function(v){return '<option'+(v===S.sel.lp?' selected':'')+'>'+v+'</option>';}).join('')+
     '</select></div>';

  h+='</div></div></div><div id="mixHost"></div>';

}
function wireMixMethod(){
  /* Wired before loadMixGrid below: a bulk change is scoped by its own
     dimensions, not by whichever grid happens to be showing. */
  var bm=document.getElementById('bulkMix');
  if(bm) bm.onclick=function(){ bulkMixForm(); };
  var hl=document.getElementById('mHl');
  if(hl) hl.onchange=function(){ S.sel.hlId=Number(hl.value); loadMixGrid(); };
  ['mReg','mLp','mAsAt'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.onchange=function(){
      S.sel.regime=document.getElementById('mReg').value;
      S.sel.lp=document.getElementById('mLp').value;
      S.sel.asAt=document.getElementById('mAsAt').value;
      loadMixGrid();
    };
  });
  loadMixGrid();
}

/* ---- the grid itself ---- */
function loadMixGrid(){
  var host=document.getElementById('mixHost'); if(!host) return;
  host.innerHTML='<div class="card"><div class="body">'+loading()+'</div></div>';
  call('getMethodMixGrid',[{hlId:S.sel.hlId,regime:S.sel.regime,
       letterParcel:S.sel.lp,asAt:S.sel.asAt}],function(g){
    mixGrid=g; renderMixGrid();
  },function(m){ host.innerHTML='<div class="card"><div class="empty">'+esc(m)+'</div></div>'; },true);
}
function renderMixGrid(){
  var host=document.getElementById('mixHost'); if(!host||!mixGrid) return;
  var g=mixGrid, canEdit=g.canEdit&&can('editMixes');
  var h='<div class="card"><h2>'+esc(hlName(g.hlId))+' · '+esc(g.regime)+' · '+esc(g.letterParcel)+'</h2>';
  h+='<div class="body" style="padding:0"><table><thead><tr>'+
     '<th>Carrier</th><th>Method</th><th class="right" style="width:120px">Mix</th>'+
     '<th class="right">Rate/parcel</th><th class="right">Contribution</th></tr></thead><tbody>';
  g.rows.forEach(function(r,i){
    h+='<tr><td>'+esc(r.carrier)+'</td><td>'+esc(r.method)+'</td>'+
       '<td class="right"><input type="number" step="0.01" min="0" max="100" data-i="'+i+'" '+
       'class="mixin right num" style="width:100px;text-align:right" '+
       (canEdit?'':'disabled ')+'value="'+(r.value*100).toFixed(2)+'"></td>'+
       '<td class="right num muted">'+money(r.ratePerParcel)+'</td>'+
       '<td class="right num" data-c="'+i+'">'+money(r.contribution)+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="total" id="mixTotal"></div>';
  if(canEdit){
    h+='<div class="body" style="border-top:1px solid var(--line)"><div class="row" style="margin:0">'+
       '<div class="field"><label>Effective from</label><input type="date" id="mFrom" value="'+esc(g.asAt)+'"></div>'+
       '<div class="field"><label>To</label><input type="date" id="mTo" value="2028-12-31"></div>'+
       '<button class="btn" id="mNorm">Normalise to 100%</button>'+
       '<button class="btn primary" id="mSave">Save grid</button></div></div>';
  }
  h+='</div></div>';
  host.innerHTML=h;

  Array.prototype.forEach.call(document.querySelectorAll('.mixin'),function(inp){
    inp.oninput=function(){ recalcMixTotal(); };
  });
  var n=document.getElementById('mNorm');
  if(n) n.onclick=function(){
    call('normaliseMixRows',[readMixInputs()],function(scaled){
      scaled.forEach(function(s,i){
        var inp=document.querySelector('.mixin[data-i="'+i+'"]');
        if(inp) inp.value=(s.value*100).toFixed(4);
      });
      recalcMixTotal();
    });
  };
  var sv=document.getElementById('mSave');
  if(sv) sv.onclick=saveMixGrid;
  recalcMixTotal();
}
function readMixInputs(){
  return mixGrid.rows.map(function(r,i){
    var inp=document.querySelector('.mixin[data-i="'+i+'"]');
    return { modellingId:r.modellingId, value: inp ? (Number(inp.value)||0)/100 : r.value };
  });
}
function recalcMixTotal(){
  if(!mixGrid) return;
  var rows=readMixInputs(), tot=0, blended=0;
  rows.forEach(function(r,i){
    tot+=r.value;
    blended+=r.value*mixGrid.rows[i].ratePerParcel;
    var c=document.querySelector('[data-c="'+i+'"]');
    if(c) c.textContent=money(r.value*mixGrid.rows[i].ratePerParcel);
  });
  var ok=Math.abs(tot-1)<=0.0005;
  var el=document.getElementById('mixTotal');
  if(el){
    el.className='total '+(ok?'good':'bad');
    el.innerHTML='<span style="flex:1">Total</span><span class="num">'+pct(tot)+'</span>'+
      (ok?'<span class="small">ok</span>':'<span class="small">must be 100%</span>')+
      '<span style="margin-left:24px" class="muted small">Blended</span>'+
      '<span class="num">'+money(blended)+'</span>';
  }
  var sv=document.getElementById('mSave'); if(sv) sv.disabled=!ok;
}
function saveMixGrid(){
  var from=document.getElementById('mFrom').value, to=document.getElementById('mTo').value;
  if(!from||!to) return showError('Enter both dates.');
  call('saveMethodMixGrid',[{hlId:mixGrid.hlId,regime:mixGrid.regime,
    letterParcel:mixGrid.letterParcel,validFrom:from,validTo:to,rows:readMixInputs()}],
    function(res){ showOk('Saved '+res.written+' routes.'); loadMixGrid(); reloadData(); });
}

/* ---- bulk mix update ----
   saveMethodMixGrid writes the grid on screen. This writes the same mix into
   many grids at once, chosen by dimension the way a bulk rate change is.

   Three steps, because a mix cannot be asked for in one. WHICH GRIDS first --
   brand, country, treatment type, WL split, regime and class, every box ticked
   to begin with. Only then can the form know which carrier-and-method routes
   those segments actually carry, which is the useful question: not "which of
   the 35 methods in Dim_Method" but "which of these six do you want to shift".
   Then THE MIX, which must total 100%. Then the preview, which is the only
   place a write can be authorised.

   A grid whose routes do not include every method given a non-zero share is
   refused by the server and named on the preview, never renormalised to fit.
   Renormalising is the exact failure the 100% guard exists to prevent. */

var BULK_MIX_DIMENSIONS = [
  { key:'brand',         label:'Brand',          ref:'BRAND' },
  { key:'geo',           label:'Country',        ref:'GEO' },
  { key:'treatmentType', label:'Treatment type', ref:'TREATMENT_TYPE' },
  { key:'wlSplit',       label:'WL split',       ref:'WL_SPLIT' },
  { key:'regime',        label:'Regime',         ref:'TEMP_REGIME' },
  { key:'letterParcel',  label:'Class',          ref:'LETTER_PARCEL' }
];

/* Step 1 — which grids. */
function bulkMixForm(keep){
  var prior=keep||{};
  var fields=BULK_MIX_DIMENSIONS.map(function(d,i){
    return { key:d.key, label:d.label, type:'checks', value:prior[d.key],
             options:optsRef(d.ref),
             hint:i===BULK_MIX_DIMENSIONS.length-1
                  ? 'Carriers and methods are not narrowed here — you set their '+
                    'shares on the next page.' : '' };
  });
  openForm({
    title:'Bulk update — delivery method mix',
    intro:'Choose the grids. The next page asks for the mix to put on them.',
    saveLabel:'Next',
    fields:fields,
    onSave:function(v, done, fail){
      var dims={};
      BULK_MIX_DIMENSIONS.forEach(function(d){ dims[d.key]=v[d.key]||''; });
      call('bulkMixScope',[{dimensions:dims}],function(sc){
        done();
        if(!sc.grids) return bulkMixNothing(sc, v);
        bulkMixValueForm(dims, sc, v, null);
      }, fail);
    }
  });
}

function bulkMixNothing(sc, raw){
  openForm({
    title:'Nothing matches',
    intro:'That selection matches no grid you can edit.',
    body:'<table><tbody>'+
         '<tr><td>Segments matching the dimensions</td><td class="right num">'+
         sc.segments+'</td></tr>'+
         '<tr><td>…outside what you can edit</td><td class="right num">'+
         sc.skippedNoScope+'</td></tr></tbody></table>',
    saveLabel:'Change the selection',
    fields:[],
    onSave:function(v, done){ done(); bulkMixForm(raw); }
  });
}

/* Step 2 — the mix. The routes are whatever the chosen grids carry between
   them, so the list is a handful rather than the whole of Dim_Method. */
function bulkMixValueForm(dims, sc, raw, keep){
  var prior=keep||{}, priorMix=prior.mix||{};
  var b='<table><thead><tr><th>Carrier</th><th>Method</th>'+
        '<th class="right" style="width:104px">Mix</th>'+
        '<th class="right">Grids</th></tr></thead><tbody>';
  sc.routes.forEach(function(r){
    b+='<tr><td>'+esc(r.carrier)+'</td><td>'+esc(r.method)+'</td>'+
       '<td class="right"><input type="number" step="0.01" min="0" max="100" '+
       'class="bmix right num" data-k="'+esc(r.key)+'" '+
       'style="width:88px;text-align:right" placeholder="0.00" value="'+
       esc(priorMix[r.key]===undefined?'':priorMix[r.key])+'"></td>'+
       '<td class="right num muted">'+r.grids+'</td></tr>';
  });
  b+='</tbody></table><div class="total" id="bmixTotal"></div>'+
     '<div class="hint" style="margin-top:6px">A route left blank is set to 0% — '+
     'a grid that carries it keeps totalling 100% without it.</div>';

  openForm({
    title:'Bulk update — the mix to apply',
    intro:sc.grids+' grid'+(sc.grids===1?'':'s')+' across '+sc.segments+
          ' segment'+(sc.segments===1?'':'s')+'. These percentages replace the '+
          'mix on every one of them. Nothing is written until you confirm the preview.',
    body:b,
    saveLabel:'Preview',
    fields:[
      { key:'validFrom', label:'Effective from', type:'date', required:true,
        value:prior.validFrom||todayOrHorizon(),
        hint:'Whatever mix is running on each grid is closed off the day before.' },
      { key:'validTo', label:'Until', type:'date', required:true, openEnded:true,
        value:prior.validTo||'9999-12-31' },
      { key:'notes', label:'Note', type:'text', value:prior.notes||'',
        placeholder:'RM 2026 service change',
        hint:'Written to every row this creates, alongside the batch reference.' }
    ],
    afterRender:function(root){
      var ins=root.querySelectorAll('.bmix');
      var tot=root.querySelector('#bmixTotal');
      if(!ins.length || !tot) return;
      function sync(){
        var n=0;
        Array.prototype.forEach.call(ins,function(i){ n+=Number(i.value)||0; });
        var good=Math.abs(n-100)<=0.05;
        tot.className='total '+(good?'good':'bad');
        tot.innerHTML='Total <strong>'+n.toFixed(2)+'%</strong>'+
                      (good?'':' — must be 100%');
      }
      Array.prototype.forEach.call(ins,function(i){ i.oninput=sync; });
      sync();
    },
    onSave:function(v, done, fail){
      var mix=[], typed={}, tot=0;
      Array.prototype.forEach.call(document.querySelectorAll('.bmix'),function(i){
        var key=i.getAttribute('data-k'), parts=key.split('|');
        var pctv=Number(i.value)||0;
        typed[key]=i.value;
        tot+=pctv;
        mix.push({ carrier:parts[0], method:parts[1], value:pctv/100 });
      });
      /* Checked here as well as on the server: the server is the authority, but
         a round trip to be told about a typo you can see is a poor way to learn. */
      if(Math.abs(tot-100)>0.05){
        return fail('The percentages total '+tot.toFixed(2)+'%. They must total 100%.');
      }
      var keepNow={ validFrom:v.validFrom, validTo:v.validTo, notes:v.notes, mix:typed };
      var req={ dimensions:dims, mix:mix, validFrom:v.validFrom, validTo:v.validTo,
                notes:v.notes, scenarioId:1, preview:true };
      call('bulkUpdateMethodMix',[req],function(pv){
        done();
        bulkMixConfirm(dims, sc, raw, keepNow, req, pv);
      }, fail);
    }
  });
}

/* Step 3 — the preview, and the only place a write can be authorised. */
function bulkMixConfirm(dims, sc, raw, keepNow, req, pv){
  var word = pv.changing===1 ? '1 grid' : pv.changing+' grids';
  var b='<table><tbody>'+
        '<tr><td>Grids to be rewritten</td><td class="right num"><strong>'+
        pv.changing+'</strong></td></tr>'+
        '<tr><td>…already on this mix</td><td class="right num">'+pv.unchanged+'</td></tr>'+
        '<tr><td>Mix rows written</td><td class="right num">'+pv.rowsToWrite+'</td></tr>'+
        '<tr><td>Effective</td><td class="right num">'+esc(pv.validFrom)+
        (pv.validTo>='9999-01-01'?' onwards':' to '+esc(pv.validTo))+'</td></tr>'+
        '</tbody></table>';

  if(pv.sample.length){
    b+='<table><thead><tr><th>Grid</th><th>Route</th><th class="right">Now</th>'+
       '<th class="right">Becomes</th></tr></thead><tbody>';
    pv.sample.forEach(function(g){
      g.rows.forEach(function(r,i){
        b+='<tr><td>'+(i===0?esc(g.label):'')+'</td><td>'+esc(r.route)+'</td>'+
           '<td class="right num muted">'+(r.was===null?'—':pct(r.was))+'</td>'+
           '<td class="right num">'+pct(r.now)+'</td></tr>';
      });
    });
    b+='</tbody></table>';
    if(pv.grids>pv.sample.length){
      b+='<div class="hint">Showing '+pv.sample.length+' of '+pv.grids+
         ' grids. The rest take the same mix.</div>';
    }
  }

  if(pv.refused.length){
    b+='<div class="warn"><strong>'+pv.refused.length+' grid'+
       (pv.refused.length===1?'':'s')+' cannot take this mix and will be left '+
       'alone.</strong> Each is missing a route you gave a share to, so the '+
       'percentages would land under 100%. Add the route, or give it 0%, or '+
       'narrow the selection.<br>'+
       pv.refused.slice(0,6).map(function(r){
         return esc(r.label)+' — no '+esc(r.missing);
       }).join('<br>')+
       (pv.refused.length>6?'<br>…and '+(pv.refused.length-6)+' more':'')+'</div>';
  }
  if(pv.skippedNoScope){
    b+='<div class="warn">'+pv.skippedNoScope+' segment(s) match the dimensions '+
       'but are outside what you can edit, and were left alone.</div>';
  }
  b+='<div class="hint" style="margin-top:8px">Selection — '+esc(pv.selection)+'</div>';

  if(!pv.changing){
    openForm({
      title:'Nothing would change',
      intro:pv.grids?'Every matching grid is already on this mix.'
                    :'No grid can take this mix.',
      body:b,
      saveLabel:'Change the mix',
      fields:[],
      onSave:function(v, done){ done(); bulkMixValueForm(dims, sc, raw, keepNow); }
    });
    return;
  }

  openForm({
    title:'Apply to '+word+'?',
    intro:'This replaces the delivery method mix on every grid listed. Read the '+
          'numbers below before confirming.',
    body:b,
    saveLabel:'Apply to '+word,
    fields:[],
    onSave:function(v, done, fail){
      var apply={};
      for(var k in req) if(req.hasOwnProperty(k)) apply[k]=req[k];
      apply.preview=false; apply.planKey=pv.planKey;
      call('bulkUpdateMethodMix',[apply],function(res){
        done();
        showOk(res.grids+' grid(s) updated as batch '+res.batchRef+' — '+
               res.written+' mix row(s) created, '+res.cleared+' period(s) closed'+
               (res.refused?', '+res.refused+' grid(s) left alone':'')+'.');
        reloadData();
        if(typeof loadMixGrid==='function') loadMixGrid();
      }, fail);
    }
  });
}

function readLpInputs(){
  return [0,1].map(function(i){

function recalcLpTotal(){
  if(!lpGrid) return;
  var v=readLpInputs(), tot=v[0]+v[1], blended=0;
  v.forEach(function(share,i){
    var contrib=share*lpGrid.rows[i].blendedRate;
    blended+=contrib;
    var c=document.querySelector('[data-lpc="'+i+'"]');
    if(c) c.textContent=money(contrib);
  });
  var ok=Math.abs(tot-1)<=0.0005;
  var el=document.getElementById('lpTotal');
  if(el){
    el.className='total '+(ok?'good':'bad');
    el.innerHTML='<span style="flex:1">Total</span><span class="num">'+pct(tot)+'</span>'+
      (ok?'<span class="small">ok</span>':'<span class="small">must be 100%</span>')+
      '<span style="margin-left:24px" class="muted small">Blended per order</span>'+
      '<span class="num">'+money(blended)+'</span>';

  var sv=document.getElementById('lSave'); if(sv) sv.disabled=!ok;
}
