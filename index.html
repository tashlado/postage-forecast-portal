/* Which years does the horizon cover, and which one are we in? */
function horizonYears(){
  var y={};
  S.calendar.filter(function(c){return c.inHorizon;}).forEach(function(c){
    y[Number(String(c.monthStart).slice(0,4))]=true; });
  return Object.keys(y).map(Number).sort(function(a,b){return a-b;});
}
function defaultDashYear(){
  var ys=horizonYears(), now=new Date().getFullYear();
  return ys.indexOf(now)>=0 ? now : (ys[0]||now);
}

/* ===================================================================
   Forecast vs actual by quarter — GB weight loss
   =================================================================== */

/* Segments that differ only by split — five of your pairs do. Worth surfacing,
   because they are usually identical and it matters when they stop being. */
function siblingSegments(hlId){
  var me=S.hlIds.filter(function(h){return h.id===hlId;})[0];
  if(!me) return [];
  return S.hlIds.filter(function(h){
    return h.id!==hlId && h.brand===me.brand && h.geo===me.geo &&
           h.treatmentType===me.treatmentType;
  }).sort(function(a,b){ return a.id-b.id; });
}

/* Opens on GB weight loss where it exists, since that is the one usually wanted. */
function defaultChartHl(){
  var gb=S.hlIds.filter(function(h){ return h.geo==='GB' && h.treatmentType==='WL'; })
                .sort(function(a,b){ return a.id-b.id; });
  if(gb.length) return gb[0].id;
  return S.hlIds.length ? S.hlIds[0].id : null;
}

/* Per-quarter mean forecast and mean actual for one segment and year. */
function quarterSeries(year, hlId){
  var months=S.calendar.filter(function(c){return c.inHorizon;});
  var q={1:[],2:[],3:[],4:[]};
  months.forEach(function(m){
    if(Number(String(m.monthStart).slice(0,4))!==year) return;
    var mm=Number(String(m.monthStart).slice(5,7));
    q[Math.ceil(mm/3)].push(m);
  });
  var fByDate={};
  S.output.forEach(function(r){ if(r.hlId===hlId) fByDate[r.dateId]=r.rate; });
  var aByMonth={};
  (S.actuals||[]).forEach(function(a){ if(a.hlId===hlId) aByMonth[a.monthStart]=a.blendedRate; });
  function mean(v){ return v.length ? v.reduce(function(x,y){return x+y;},0)/v.length : null; }
  return [1,2,3,4].map(function(n){
    var ms=q[n];
    return { q:n, label:'Q'+n+' '+String(year).slice(2), exists:ms.length>0,
      forecast: mean(ms.map(function(m){return fByDate[m.dateId];})
                       .filter(function(v){return v!==undefined;})),
      actual:   mean(ms.map(function(m){return aByMonth[m.monthStart];})
                       .filter(function(v){return v!==undefined;})) };
  });
}

/* Grouped bars as inline SVG. No chart library — one less dependency, and it
   keeps the whole interface in a single file. */
function groupedBars(data, show){
  var W=760, H=300, padL=58, padR=16, padT=16, padB=46;
  var plotW=W-padL-padR, plotH=H-padT-padB;

  var vals=[];
  data.forEach(function(d){
    if(show['f'+d.q] && d.forecast!==null) vals.push(d.forecast);
    if(show['a'+d.q] && d.actual!==null)   vals.push(d.actual);
  });
  if(!vals.length) return '<div class="empty">Nothing selected, or no data for those quarters.</div>';

  var max=Math.max.apply(null,vals);
  var step=Math.pow(10,Math.floor(Math.log(max)/Math.LN10))/2;
  var top=Math.ceil(max/step)*step;
  if(!(top>0)) top=1;

  var groupW=plotW/data.length;
  var y=function(v){ return padT+plotH-(v/top)*plotH; };

  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+
        '" style="display:block;max-width:'+W+'px" role="img" '+
        'aria-label="Forecast against actual blended rate per order, by quarter">';

  for(var g=0; g<=4; g++){
    var v=top*g/4, yy=y(v);
    s+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(padL+plotW)+'" y2="'+yy.toFixed(1)+
       '" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(padL-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" '+
       'font-size="11" fill="var(--ink-3)">'+v.toFixed(2)+'</text>';
  }

  data.forEach(function(d,i){
    var gx=padL+i*groupW;
    var bars=[];
    if(show['f'+d.q]) bars.push({v:d.forecast, c:'#0000FF', n:'Forecast'});
    if(show['a'+d.q]) bars.push({v:d.actual,   c:'#0B0B0F', n:'Actual'});
    var gap=(bars.length>1?6:0);
    var bw=Math.min(46,(groupW*0.62-gap)/Math.max(bars.length,1));
    var totalW=bw*bars.length+gap*(bars.length-1);
    var startX=gx+(groupW-totalW)/2;

    bars.forEach(function(b,j){
      var bx=startX+j*(bw+gap);
      if(b.v===null){
        // an absent actual is drawn as an outline, not omitted, so the gap is visible
        s+='<rect x="'+bx.toFixed(1)+'" y="'+(y(0)-14).toFixed(1)+'" width="'+bw.toFixed(1)+
           '" height="14" fill="none" stroke="'+b.c+'" stroke-width="1" '+
           'stroke-dasharray="3 2" opacity="0.4" rx="2"/>';
        s+='<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(y(0)-20).toFixed(1)+
           '" text-anchor="middle" font-size="10" fill="var(--ink-3)">none</text>';
        return;
      }
      var bh=Math.max(plotH-(y(b.v)-padT),1);
      s+='<rect x="'+bx.toFixed(1)+'" y="'+y(b.v).toFixed(1)+'" width="'+bw.toFixed(1)+
         '" height="'+bh.toFixed(1)+'" fill="'+b.c+'" rx="2"><title>'+
         d.label+' '+b.n+': '+b.v.toFixed(4)+'</title></rect>';
      s+='<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(y(b.v)-5).toFixed(1)+
         '" text-anchor="middle" font-size="10" fill="var(--ink-2)" '+
         'font-variant-numeric="tabular-nums">'+b.v.toFixed(2)+'</text>';
    });

    s+='<text x="'+(gx+groupW/2).toFixed(1)+'" y="'+(padT+plotH+20)+
       '" text-anchor="middle" font-size="12" fill="var(--ink-2)">'+d.label+'</text>';
  });

  s+='<line x1="'+padL+'" y1="'+y(0).toFixed(1)+'" x2="'+(padL+plotW)+'" y2="'+y(0).toFixed(1)+
     '" stroke="var(--line-2)" stroke-width="1"/></svg>';
  return s;
}

function viewRateChart(){
  if(!S.hlIds.length) return '<div class="card"><h2>Forecast against actual</h2>'+
         '<div class="empty">No segments defined.</div></div>';

  if(!S.sel.chartHl || !S.hlIds.some(function(h){return h.id===S.sel.chartHl;})){
    S.sel.chartHl=defaultChartHl();
  }
  var hlId=S.sel.chartHl;
  var seg=S.hlIds.filter(function(h){return h.id===hlId;})[0];
  var year=S.sel.dashYear||defaultDashYear();
  var data=quarterSeries(year, hlId);
  var show=S.sel.chartSeries||{};

  // does the segment that differs only by split still agree?
  var sibs=siblingSegments(hlId), divergence=null, sibName='';
  if(sibs.length){
    sibName=sibs[0].wlSplit;
    var other=quarterSeries(year, sibs[0].id), worst=0;
    data.forEach(function(d,i){
      if(d.forecast!==null && other[i].forecast!==null)
        worst=Math.max(worst, Math.abs(d.forecast-other[i].forecast));
    });
    if(worst>0.0001) divergence=worst;
  }

  var h='<div class="card"><h2>Forecast against actual'+
        '<span class="small muted" style="font-weight:400"> · blended rate per order</span></h2>';

  h+='<div class="body" style="padding:12px 16px;border-bottom:1px solid var(--line)">';
  h+='<div class="row" style="margin:0 0 12px 0">';
  h+='<div class="field" style="min-width:330px"><label>Segment</label>'+
     '<select id="chHl">'+S.hlIds.map(function(x){

/* Treatment plus split in one column, so three columns still identify a segment.
   Brand + location + treatment alone is ambiguous for 10 of the 17 — MedExpress
   GB WL appears twice, differing only by Mounjaro vs WeGovy. */
function treatmentLabel(h){
  if(!h) return '';
  var t=h.treatmentType==='CORE_RX'?'Core Rx':h.treatmentType;
  if(!h.wlSplit || h.wlSplit==='*') return t;
  var s=h.wlSplit.charAt(0)+h.wlSplit.slice(1).toLowerCase();
  if(h.wlSplit==='WEGOVY') s='WeGovy';
  return t+' · '+s;
}

/* Dashboard: quarters of the chosen year. */
function outputSummary(){
  if(!S.output.length) return '<div class="empty">Nothing published yet.</div>';
  var ys=horizonYears();
  var year=S.sel.dashYear||defaultDashYear();
  var months=S.calendar.filter(function(c){return c.inHorizon;})
             .sort(function(a,b){return a.dateId-b.dateId;});
  var byHl={};
  S.output.forEach(function(r){ (byHl[r.hlId]=byHl[r.hlId]||{})[r.dateId]=r.rate; });

  var q={1:[],2:[],3:[],4:[]};
  months.forEach(function(m){
    if(Number(String(m.monthStart).slice(0,4))!==year) return;
    var mm=Number(String(m.monthStart).slice(5,7));
    q[Math.ceil(mm/3)].push(m.dateId);
  });

  var h='<div class="body" style="padding:12px 16px;border-bottom:1px solid var(--line)">';
  h+='<div class="row" style="margin:0"><div class="field"><label>Year</label>'+
     '<select id="dYear">'+ys.map(function(y){
        return '<option value="'+y+'"'+(y===year?' selected':'')+'>'+y+'</option>';}).join('')+
     '</select></div>';
  h+='<div class="small muted" style="align-self:flex-end;padding-bottom:6px">'+
     'Quarterly averages of the forecast rate per order.</div></div></div>';

  h+='<table><thead><tr><th>Brand</th><th>Location</th><th>Treatment</th>';
  [1,2,3,4].forEach(function(n){
    h+='<th class="right">Q'+n+' '+String(year).slice(2)+'</th>';
  });
  h+='<th class="right">Year avg</th><th class="right">Change</th></tr></thead><tbody>';

  function avg(ids,map){
    var v=ids.map(function(i){return map[i];}).filter(function(x){return x!==undefined;});
    if(!v.length) return null;
    return v.reduce(function(a,b){return a+b;},0)/v.length;
  }

  Object.keys(byHl).sort(function(a,b){return a-b;}).forEach(function(id){
    var map=byHl[id];
    var hl=S.hlIds.filter(function(x){return x.id===Number(id);})[0]||{};
    var any=months.some(function(m){return map[m.dateId]!==undefined;});
    if(!any) return;
    var qv=[1,2,3,4].map(function(n){ return avg(q[n],map); });
    var ya=avg([].concat(q[1],q[2],q[3],q[4]),map);
    var q1=qv[0], q4=qv[3];
    var ch=(q1&&q4)?((q4-q1)/q1*100):null;

    h+='<tr class="click" data-hl="'+id+'">'+
       '<td>'+esc(hl.brand||'')+'</td>'+
       '<td>'+esc(hl.geo||'')+'</td>'+
       '<td>'+esc(treatmentLabel(hl))+'</td>';
    qv.forEach(function(v){
      h+='<td class="right num">'+(v===null?'<span class="muted">—</span>':money(v))+'</td>';
    });
    h+='<td class="right num"><strong>'+(ya===null?'—':money(ya))+'</strong></td>';
    h+='<td class="right num '+(ch===null?'muted':(ch>0.005?'up':(ch<-0.005?'down':'muted')))+'">'+
       (ch===null?'—':((ch>0?'+':'')+ch.toFixed(1)+'%'))+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="small muted" style="padding:8px 12px">Change is Q4 against Q1 of '+year+
     '. Click a row to open that segment on the Rates tab.</div>';
  return h;
}

/* Full table: every month, nothing hidden. */
function outputTable(){
  if(!S.output.length) return '<div class="empty">Nothing published yet.</div>';
  var months=S.calendar.filter(function(c){return c.inHorizon;})
             .sort(function(a,b){return a.dateId-b.dateId;});
  var byHl={};
  S.output.forEach(function(r){ (byHl[r.hlId]=byHl[r.hlId]||{})[r.dateId]=r.rate; });

  var h='<div class="body" style="padding:10px 16px;border-bottom:1px solid var(--line)">'+
        '<div class="small muted" style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">'+
        '<span><span style="color:var(--brand-lo);font-weight:500">Blue heading</span>'+
        ' = peak-surcharge month (Nov to Jan)</span>'+
        '<span><span style="background:var(--brand-tint);padding:1px 8px;border-radius:3px">'+
        'Shaded cell</span> = rate changed from the month before</span>'+
        '</div></div>';
  h+='<div style="overflow-x:auto"><table><thead><tr>'+
        '<th style="position:sticky;left:0;background:var(--surface);z-index:1">High Level ID</th>';
  months.forEach(function(m){
    var peak = (m.label.indexOf('Dec-')===0 || m.label.indexOf('Jan-')===0 ||
                m.label.indexOf('Nov-')===0);
    h+='<th class="right"'+(peak?' style="color:var(--brand-lo)"':'')+'>'+esc(m.label)+'</th>';
  });
  h+='</tr></thead><tbody>';
  Object.keys(byHl).sort(function(a,b){return a-b;}).forEach(function(id){
    h+='<tr><td class="small" style="position:sticky;left:0;background:var(--surface)">'+
       id+' — '+esc(hlName(Number(id)))+'</td>';
    var prev=null;
    months.forEach(function(m){
      var v=byHl[id][m.dateId];
      var moved = prev!==null && v!==undefined && Math.abs(v-prev)>0.000001;
      h+='<td class="right num"'+(moved?' style="background:var(--brand-tint)"':'')+'>'+
         (v===undefined?'—':money(v,4))+'</td>';
      if(v!==undefined) prev=v;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

/* ===================================================================
   Output — the published forecast

   Two views of the same rows. "All rows" is the OUTPUT sheet as it stands, one
   row per segment-month, sortable and filterable; "By month" is the pivot that
   was here before, which shows movement month to month in a way the flat form
   cannot. Neither is a subset of the other, so both stay.

   Preview changes and Publish live in the header (renderHeaderActions) and render
   into #oResult, which is why that div is on this tab whichever view is showing.
   =================================================================== */

/**
 * The eight columns, in the order the legacy workbook's Output tab used them.
 *
 * Total Postage is the legacy workbook's own name for this figure, and it is the
 * figure runParityTest compares against: engine.gs sums
 * rate x methodMix x lpMix over every route in a segment, where
 * rate = base x (1 + sum of percentage surcharges) + sum of amount surcharges.
 * "Total" there means totalled across cost components and mix — it is a blended
 * cost per order, NOT multiplied by any volume, because the model carries no
 * order volumes at all. The tooltip on the header says so, because the name alone
 * invites the other reading.
 */
var OUTPUT_COLS = [
  { key:'hlId',          label:'High Level ID',  type:'num', filter:'pick' },
  { key:'dateId',        label:'Date ID',        type:'num', filter:'pick' },
  { key:'brand',         label:'Brand',          type:'str', filter:'pick' },
  { key:'geo',           label:'Geo',            type:'str', filter:'pick' },
  { key:'treatmentType', label:'Treatment Type', type:'str', filter:'pick' },
  { key:'wlSplit',       label:'WL Split',       type:'str', filter:'pick' },
  { key:'monthStart',    label:'Date',           type:'str', filter:'pick' },
  { key:'rate',          label:'Total Postage',  type:'num', filter:'range',
    hint:'Blended postage cost per order for the segment that month: base rate '+
         'plus surcharges, weighted by method and letter/parcel mix, summed across '+
         'every route. Not multiplied by order volume — the model holds none.' }
];

/* Rendering every row is fine at the current 649 and stays fine into the low
   thousands; past this it renders the first N and says so rather than quietly
   showing a subset. CSV always exports everything that matched. */
var OUTPUT_RENDER_CAP = 2000;

/** OUTPUT as flat rows, with the dimensions the published rows carry. */
function outputAllRows(){
  return (S.output||[]).map(function(r){
    /* Fall back to the current segment record only where a published row predates
       the loader sending its own copies. */
    var h=S.hlIds.filter(function(x){return x.id===r.hlId;})[0]||{};
    return { hlId:r.hlId, dateId:r.dateId,
             brand:r.brand||h.brand||'', geo:r.geo||h.geo||'',
             treatmentType:r.treatmentType||h.treatmentType||'',
             wlSplit:r.wlSplit||h.wlSplit||'',
             monthStart:r.monthStart||'', rate:r.rate };
  });
}

function outputFilters(){ return (S.sel.outFilters = S.sel.outFilters || {}); }

/** Filter, then sort. Both run over the in-memory array — no server call. */
function outputVisibleRows(){
  var f=outputFilters();
  var rows=outputAllRows().filter(function(r){
    for(var i=0;i<OUTPUT_COLS.length;i++){
      var c=OUTPUT_COLS[i], want=f[c.key];
      if(c.filter==='range'){
        if(want && want.min!=='' && want.min!==undefined && Number(r[c.key])<Number(want.min)) return false;
        if(want && want.max!=='' && want.max!==undefined && Number(r[c.key])>Number(want.max)) return false;
      } else if(want!==undefined && want!==''){
        if(String(r[c.key])!==String(want)) return false;
      }
    }
    return true;
  });

  var s=S.sel.outSort;
  if(s && s.key){
    var col=OUTPUT_COLS.filter(function(c){return c.key===s.key;})[0];
    var dir=s.dir==='desc'?-1:1;
    rows.sort(function(a,b){
      var x=a[s.key], y=b[s.key];
      if(col && col.type==='num'){ x=Number(x)||0; y=Number(y)||0; return (x-y)*dir; }
      x=String(x); y=String(y);
      return (x<y?-1:x>y?1:0)*dir;
    });
  }
  return rows;
}

/** Distinct values for a pick filter, narrowed by the other columns' filters. */
function outputPickValues(key){
  var f=outputFilters(), seen={};
  outputAllRows().forEach(function(r){
    for(var i=0;i<OUTPUT_COLS.length;i++){
      var c=OUTPUT_COLS[i];
      if(c.key===key || c.filter==='range') continue;
      var want=f[c.key];
      if(want!==undefined && want!=='' && String(r[c.key])!==String(want)) return;
    }
    seen[r[key]]=1;
  });
  var col=OUTPUT_COLS.filter(function(c){return c.key===key;})[0];
  return Object.keys(seen).sort(function(a,b){
    return (col&&col.type==='num') ? (Number(a)-Number(b)) : (a<b?-1:a>b?1:0);
  });
}

function viewOutput(){
  if(!S.loaded) return '<div class="card"><div class="body">'+loading()+'</div></div>';
  var sec=S.sel.outputSection||'rows';
  var tabs=[['rows','All rows'],['pivot','By month']];
  var h='<div class="card"><div class="body" style="padding:10px 12px">';
  h+='<div style="display:flex;gap:2px">'+tabs.map(function(t){
     return '<button class="btn sm'+(sec===t[0]?' primary':'')+'" data-os="'+t[0]+'">'+
            t[1]+'</button>'; }).join('')+'</div></div></div>';

  /* Preview changes and Publish render here, from the header. */
  h+='<div id="oResult"></div>';

  if(sec==='pivot'){
    h+='<div class="card"><h2>OUTPUT — forecast rate per order</h2>'+
       '<div class="body" style="padding:0">'+outputTable()+'</div></div>';
    return h;
  }
  h+=outputRowsView();
  return h;
}

function outputRowsView(){
  var all=outputAllRows();
  if(!all.length){
    return '<div class="card"><h2>OUTPUT</h2><div class="body">'+
           '<div class="empty">Nothing published yet.</div></div></div>';
  }
  var f=outputFilters();
  var rows=outputVisibleRows();
  var s=S.sel.outSort||{};
  var active=OUTPUT_COLS.filter(function(c){
    var w=f[c.key];
    return c.filter==='range' ? (w && ((w.min!==''&&w.min!==undefined)||(w.max!==''&&w.max!==undefined)))
                              : (w!==undefined && w!=='');
  }).length;

  var h='<div class="card"><h2>OUTPUT — all rows'+
        '<span class="small muted" style="font-weight:400"> — the published forecast, one row per segment per month</span>'+
        '</h2>';
  h+='<div class="body" style="padding:10px 16px;border-bottom:1px solid var(--line);'+
     'display:flex;gap:12px;align-items:center;flex-wrap:wrap">';
  h+='<span class="small"><strong>'+rows.length+'</strong> of '+all.length+' row'+
     (all.length===1?'':'s')+(active?' · '+active+' filter'+(active===1?'':'s')+' on':'')+'</span>';
  h+='<button class="btn sm primary" id="oCsv">Download CSV</button>';
  h+='<button class="btn sm" id="oCopy" title="If the download is blocked, this puts the '+
     'same CSV on your clipboard">Copy</button>';
  if(active) h+='<button class="btn sm" id="oClear">Clear filters</button>';
  h+='<span class="small muted">Click a heading to sort. The CSV is whatever is showing.</span>';
  h+='</div>';

  h+='<div class="body" style="padding:0"><div style="overflow-x:auto">';
  h+='<table class="otab"><thead><tr>';
  OUTPUT_COLS.forEach(function(c){
    var arrow = s.key===c.key ? (s.dir==='desc'?' ▾':' ▴') : '';
    h+='<th class="sortable'+(c.type==='num'?' right':'')+(s.key===c.key?' sorted':'')+
       '" data-sort="'+c.key+'"'+(c.hint?' title="'+esc(c.hint)+'"':'')+'>'+
       esc(c.label)+arrow+'</th>';
  });
  h+='</tr><tr class="frow">';
  OUTPUT_COLS.forEach(function(c){
    if(c.filter==='range'){
      var w=f[c.key]||{};
      h+='<td><div style="display:flex;gap:3px">'+
         '<input class="fmin" data-fmin="'+c.key+'" type="number" step="0.0001" placeholder="min" '+
         'value="'+esc(w.min===undefined?'':w.min)+'">'+
         '<input class="fmin" data-fmax="'+c.key+'" type="number" step="0.0001" placeholder="max" '+
         'value="'+esc(w.max===undefined?'':w.max)+'"></div></td>';
    } else {
      var vals=outputPickValues(c.key), cur=f[c.key]===undefined?'':f[c.key];
      h+='<td><select data-fpick="'+c.key+'"><option value="">All</option>'+
         vals.map(function(v){
           return '<option value="'+esc(v)+'"'+(String(v)===String(cur)?' selected':'')+'>'+
                  esc(v)+'</option>'; }).join('')+'</select></td>';
    }
  });
  h+='</tr></thead><tbody id="oBody">'+outputTbody(rows)+'</tbody></table>';
  h+='</div></div></div>';
  return h;
}

/** Only this is re-rendered on a sort or filter change, never the whole screen. */
function outputTbody(rows){
  if(!rows.length){
    return '<tr><td colspan="'+OUTPUT_COLS.length+'" class="empty">'+
           'No rows match those filters.</td></tr>';
  }
  var shown=rows.slice(0, OUTPUT_RENDER_CAP), h='';
  shown.forEach(function(r){
    h+='<tr>';
    OUTPUT_COLS.forEach(function(c){
      var v = c.key==='rate' ? money(r.rate) : r[c.key];
      h+='<td class="small'+(c.type==='num'?' right num':'')+'">'+esc(v)+'</td>';
    });
    h+='</tr>';
  });
  if(rows.length>shown.length){
    h+='<tr><td colspan="'+OUTPUT_COLS.length+'" class="small muted" style="padding:8px 12px">'+
       'Showing the first '+shown.length+' of '+rows.length+' matching rows. '+
       'Download CSV gives you all '+rows.length+'.</td></tr>';
  }
  return h;
}

/**
 * Re-render the rows and the sort arrows, and nothing else.
 *
 * Sorting cannot change which rows match or what the filter dropdowns offer, so it
 * takes this path instead of renderAll — which would replace the whole screen
 * (finding P13), rebuild every filter control and throw away your scroll position
 * on every heading click. Filtering does change those, so it does go through
 * renderAll.
 */
function refreshOutputBody(){
  var b=document.getElementById('oBody');
  if(!b) return;
  b.innerHTML=outputTbody(outputVisibleRows());
  var s=S.sel.outSort||{};
  Array.prototype.forEach.call(document.querySelectorAll('[data-sort]'),function(th){
    var key=th.getAttribute('data-sort');
    var col=OUTPUT_COLS.filter(function(c){return c.key===key;})[0]||{};
    th.className='sortable'+(col.type==='num'?' right':'')+(s.key===key?' sorted':'');
    th.textContent=col.label+(s.key===key?(s.dir==='desc'?' ▾':' ▴'):'');
  });
}

function wireOutput(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-os]'),function(b){
    b.onclick=function(){ S.sel.outputSection=b.getAttribute('data-os'); renderAll(); };
  });
  if((S.sel.outputSection||'rows')!=='rows') return;

  Array.prototype.forEach.call(document.querySelectorAll('[data-sort]'),function(th){
    th.onclick=function(){
      var key=th.getAttribute('data-sort'), s=S.sel.outSort||{};
      S.sel.outSort = (s.key===key && s.dir==='asc') ? {key:key,dir:'desc'} : {key:key,dir:'asc'};
      refreshOutputBody();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-fpick]'),function(sel){
    sel.onchange=function(){
      outputFilters()[sel.getAttribute('data-fpick')]=sel.value;
      renderAll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-fmin]'),function(inp){
    inp.onchange=function(){
      var k=inp.getAttribute('data-fmin'), f=outputFilters();
      f[k]=f[k]||{}; f[k].min=inp.value; renderAll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-fmax]'),function(inp){
    inp.onchange=function(){
      var k=inp.getAttribute('data-fmax'), f=outputFilters();
      f[k]=f[k]||{}; f[k].max=inp.value; renderAll();
    };
  });
  var clr=document.getElementById('oClear');
  if(clr) clr.onclick=function(){ S.sel.outFilters={}; renderAll(); };

  var csv=document.getElementById('oCsv');
  if(csv) csv.onclick=function(){
    var rows=outputVisibleRows();
    if(!rows.length){ showError('Nothing to export — no rows match those filters.'); return; }
    downloadCsv(outputCsvName(rows.length), outputCsv(rows));
  };
  var cp=document.getElementById('oCopy');
  if(cp) cp.onclick=function(){
    var rows=outputVisibleRows();
    if(!rows.length){ showError('Nothing to copy — no rows match those filters.'); return; }
    copyCsv(outputCsv(rows), rows.length);
  };
}

function outputCsvName(n){
  var f=outputFilters(), bits=['output'];
  ['brand','geo','treatmentType','wlSplit'].forEach(function(k){
    if(f[k]) bits.push(String(f[k]).toLowerCase());
  });
  bits.push(n+'rows');
  return bits.join('-').replace(/[^a-z0-9-]/gi,'')+'.csv';
}

/** Built from the filtered, sorted array — so it always matches what is on screen,
    including the rows a render cap left off. */
function outputCsv(rows){
  var lines=[OUTPUT_COLS.map(function(c){return csvCell(c.label);}).join(',')];
  rows.forEach(function(r){
    lines.push(OUTPUT_COLS.map(function(c){
      return csvCell(c.key==='rate' ? money(r.rate) : r[c.key]);
    }).join(','));
  });
  return lines.join('\r\n');
}

function csvCell(v){
  var s=(v===null||v===undefined)?'':String(v);
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

/**
 * Hand the browser a file.
 *
 * The portal runs inside an Apps Script iframe, and whether that sandbox permits a
 * download the page starts itself is not something this code can find out — a
 * blocked click fails silently rather than throwing. Hence the Copy button beside
 * it: if nothing lands in your downloads, the same CSV is one click from the
 * clipboard.
 */
function downloadCsv(name, text){
  try{
    /* A BOM, so Excel opens a UTF-8 CSV without mangling accented names. */
    var blob=new Blob([String.fromCharCode(0xFEFF)+text],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); },0);
    showOk('Exported '+name+'. If nothing appeared in your downloads, the iframe '+
           'blocked it — use Copy instead.');
  }catch(e){
    showCsvFallback(text);
  }
}

function copyCsv(text, n){
  function ok(){ showOk(n+' row(s) copied as CSV. Paste into a spreadsheet.'); }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, function(){ showCsvFallback(text); });
      return;
    }
  }catch(e){}
  showCsvFallback(text);
}

/** Last resort: put it on screen so it can always be got out by hand. */
function showCsvFallback(text){
  openForm({
    title:'CSV',
    intro:'Copying was blocked, so here it is. Select all and copy.',
    body:'<textarea readonly rows="12" style="width:100%;font-family:ui-monospace,monospace;'+
         'font-size:11px">'+esc(text)+'</textarea>',
    saveLabel:null,
    fields:[],
    afterRender:function(root){
      var ta=root.querySelector('textarea');
      if(ta){ ta.focus(); ta.select(); }
    }
  });
}

function editRef(id, list){
  var existing=null, usage=null;
  if(id){
    Object.keys(refUsage||{}).forEach(function(k){
      if(refUsage[k].id===id){
        usage=refUsage[k];
        var parts=k.split('|');
        list=parts[0];
        existing=(S.ref[list]||[]).filter(function(v){return v.code===parts[1];})[0];
      }
    });
  }
  var inUse = usage && usage.total>0;
  openForm({
    title:(id?'Edit '+LIST_LABELS[list]:'Add to '+LIST_LABELS[list]),
    intro: inUse
      ? 'This code is used by '+usage.where.map(function(w){return w.count+' '+w.label;}).join(', ')+
        ', so it cannot be renamed — every one of those rows points at it. The label is free to change.'
      : 'The code becomes permanent once something refers to it. Nothing does yet, so it can '+
        'still be corrected.',
    saveLabel:(id?'Save':'Add'),
    fields:[
      {key:'code', label:'Code'+(inUse?' (locked — in use)':''), type:'text', required:true,
       value: existing?existing.code:'', placeholder:'NL',
       readonly: inUse,
       hint: inUse ? 'Add a new code and move the rows across if this really needs to change.'
                   : 'Letters, digits and underscores. Uppercase.'},
      {key:'label', label:'Label', type:'text', required:true,
       value: existing?existing.label:'', placeholder:'Netherlands',
       hint:'What people see in the dropdowns.'},
      {key:'sortOrder', label:'Position in the list', type:'number', step:'10', min:0,
       value: existing?existing.sort:'',
       hint:'Lower appears first. Leave blank to add at the end.'}
    ],
    onSave:function(v, done, fail){
      call('saveReferenceValue',[{ id:id||0, listName:list,
        code: inUse ? existing.code : v.code,
        label:v.label, sortOrder:Number(v.sortOrder||0) }],
        function(res){ done();
          showOk((res.isNew?'Added ':'Updated ')+res.code+'.');
          refUsage=null; reloadInit(); }, fail);
    }
  });
}

/* Copy rates and mixes between segments. Previews first, always. */

function showCopyPreview(r, opts){
  var rows=[['Base rates', r.counts.rateBase, r.skipped.rateBase],
            ['Surcharges', r.counts.rateSurcharge, r.skipped.rateSurcharge],
            ['Method mixes', r.counts.mixMethod, r.skipped.mixMethod],
            ['Letter/parcel split', r.counts.mixLetterParcel, r.skipped.mixLP]];
  var intro='<strong>'+r.matchedRoutes+' route(s) paired up.</strong><br>';
  var tbl='<table style="margin-top:10px;font-size:13px"><tr>'+
          '<th style="text-align:left">What</th><th class="right">To copy</th>'+
          '<th class="right">Skipped</th></tr>';
  rows.forEach(function(x){
    tbl+='<tr><td>'+x[0]+'</td><td class="right num">'+x[1]+'</td>'+
         '<td class="right num muted">'+(x[2]||'—')+'</td></tr>';
  });
  tbl+='</table>';

  var warn='';
  if(r.missingInTarget.length){
    warn+='<div style="margin-top:10px;color:var(--warn)"><strong>'+r.missingInTarget.length+
          ' route(s) have no partner here:</strong><br>'+
          esc(r.missingInTarget.slice(0,6).join(', '))+
          (r.missingInTarget.length>6?' and '+(r.missingInTarget.length-6)+' more':'')+'</div>';
  }
  if(r.extraInTarget.length){
    warn+='<div style="margin-top:8px;color:var(--ink-3)">'+r.extraInTarget.length+
          ' route(s) here have no equivalent in the source, so they get nothing: '+
          esc(r.extraInTarget.slice(0,4).join(', '))+'</div>';
  }
  if(r.mixWarning){
    warn+='<div style="margin-top:10px;color:var(--err)"><strong>'+esc(r.mixWarning)+'</strong></div>';
  }
  if(!r.total){
    warn+='<div style="margin-top:10px">Nothing would be copied. Everything is either already '+
          'there, or no routes pair up.</div>';
  }

  openForm({
    title:'Copy '+r.total+' row(s)?',
    intro: intro+tbl+warn+
      '<div style="margin-top:10px;color:var(--ink-3)">Every row created is marked '+
      '"Copied from High Level ID '+opts.fromHlId+'" in its notes, so a rate that was never '+
      'actually negotiated can be found later.</div>',
    saveLabel: r.total ? ('Copy '+r.total+' rows') : 'Nothing to copy',
    fields:[],
    onSave:function(v, done, fail){
      if(!r.total){ done(); return; }
      opts.preview=false;
      call('copySegmentData',[opts],function(res){
        done();
        showOk('Copied '+res.written+' row(s). Check the mix totals 100%, then publish.');
        reloadData();
      }, fail);
    }
  });
}

/* Reload the structural payload as well as the data — new dimensions and IDs
   arrive through initApp, not loadAllAppData. */
function reloadInit(){
  call('initApp',[],function(init){
    S.ref=init.reference; S.carriers=init.carriers; S.methods=init.methods;
    S.surchargeTypes=init.surchargeTypes; S.hlIds=init.highLevelIds;
    S.mdIds=init.modellingIds; S.scenarios=init.scenarios; S.status=init.status;
    reloadData();

/* ===================================================================
   Actuals — what postage really cost, against what the model said
   =================================================================== */
var cmp=null;

/* Mirrors requireImportActuals_ in auth.gs. Kept as its own function rather than
   an inline can('manageUsers') so that when the server gate changes, the grep for
   "importActuals" finds the client too — a button that renders and then throws on
   click is worse than no button. */
function canImportActuals(){ return can('manageUsers'); }

/* The last upload's report, held here rather than only in the DOM.
   A successful import calls reloadData(), which calls renderAll(), which rebuilds
   the whole screen — so a report written straight into the page would disappear
   about a second after appearing. Since the report is the only review step this
   feature has, losing it is the exact failure the feature exists to prevent. It
   is kept until dismissed or the page is reloaded, the same way cmp and snapDiff
   are held. */
var acReport=null, acReportFile='';

function viewActuals(){
  if(!S.loaded) return '<div class="card"><div class="body">'+loading()+'</div></div>';
  var h='<div class="card"><div class="body"><div class="row" style="margin:0">';
  if(can('write')) h+='<button class="btn primary" id="aAdd">Add or update a month</button>';
  h+='<span class="small muted" style="align-self:center">Blended rate is derived as '+
     'spend divided by orders where both are given.</span>';
  h+='</div></div></div>';
  if(canImportActuals()) h+=viewActualsUpload();
  h+='<div id="aHost">'+loading()+'</div>';
  return h;
}

function viewActualsUpload(){
  var h='<div class="card"><h2>Upload the monthly extract</h2><div class="body">';
  h+='<div class="small muted" style="margin-top:0">Upload the monthly postage extract '+
     'as a CSV. It needs the columns the extract already has — Country Code, Brand, '+
     'Delivery Carrier, Delivery Method, Treatment Type, Dispatched Date: Month, Count '+
     'and Sum of Cost Of Shipping. Order does not matter and extra columns are '+
     'ignored.</div>';
  h+='<div class="row" style="margin:12px 0 0;align-items:center">';
  h+='<input type="file" id="acFile" accept=".csv,text/csv" '+
     'style="font-size:12px;max-width:340px">';
  h+='<button class="btn primary" id="acAppend">Add this month</button>';
  h+='<button class="btn danger" id="acReplace">Replace all actuals data</button>';
  h+='</div>';
  h+='<div class="small muted" style="margin-top:10px">'+
     '<strong style="color:var(--ink)">Add this month</strong> stages the file alongside '+
     'what is already there. Any month the file covers is cleared from the staging tab '+
     'first, so uploading the same month twice corrects it rather than doubling it.<br>'+
     '<strong style="color:var(--ink)">Replace all actuals data</strong> empties the '+
     'staging tab and loads only this file. The staging tab has no history, so that '+
     'cannot be undone.<br>'+
     'There is no preview step — the import runs on upload and reports back below. '+
     'Read the report: it is the only thing that will tell you a treatment type went '+
     'to Core Rx by default, or that a segment has no High Level ID.</div>';
  h+='<div id="acReport"></div>';
  h+='</div></div>';
  return h;
}

function wireActuals(){
  var a=document.getElementById('aAdd');
  if(a) a.onclick=function(){ editActual(null); };
  wireActualsUpload();
  loadComparison();
}

function wireActualsUpload(){
  var ap=document.getElementById('acAppend'), rp=document.getElementById('acReplace');
  if(ap) ap.onclick=function(){ startActualsUpload('APPEND'); };
  if(rp) rp.onclick=function(){ startActualsUpload('REPLACE'); };
  if(acReport) paintActualsUploadReport();      // survive the renderAll after an import
}

/* Read the file in the browser and send the text, rather than parsing to rows
   here. The parse has to happen server-side regardless — the client cannot be
   trusted with it, and the same CSV arriving from a future automated feed would
   need the same code — so parsing here as well would mean two parsers to keep in
   agreement about quoted commas. One string over google.script.run, one parser. */
function startActualsUpload(mode){
  var inp=document.getElementById('acFile');
  var f=inp && inp.files && inp.files[0];
  if(!f){ return showError('Choose a CSV file first.'); }
  if(!/\.csv$/i.test(f.name) && f.type && f.type.indexOf('csv')<0){
    return showError('"'+f.name+'" does not look like a CSV. Export the extract as CSV '+
                     'rather than as a workbook — an .xlsx cannot be read here.');
  }
  if(!f.size){ return showError('"'+f.name+'" is empty.'); }

  /* Drop the previous report before starting. Otherwise a failed upload clears
     the report from the page but leaves it in acReport, and the next renderAll
     paints last week's summary back in as though it described this attempt. */
  acReport=null; acReportFile='';

  if(mode==='REPLACE'){
    if(!confirm('Replace all staged actuals data?\n\nThis empties the Actuals_Import tab '+
                'completely and loads only "'+f.name+'". The staging tab has no history, '+
                'so this cannot be undone.\n\nThe months this file does not cover will no '+
                'longer be staged.')) return;
  }

  var host=document.getElementById('acReport');
  if(host) host.innerHTML='<div class="small muted" style="margin-top:14px">Reading '+
    esc(f.name)+'…</div>';

  var fr=new FileReader();
  fr.onerror=function(){
    if(host) host.innerHTML='';
    showError('That file could not be read from disk.');
  };
  fr.onload=function(){
    var text=String(fr.result||'');
    if(!text.trim()){
      if(host) host.innerHTML='';
      return showError('"'+f.name+'" has no content in it.');
    }
    if(host) host.innerHTML='<div class="small muted" style="margin-top:14px">Importing '+
      esc(f.name)+'… this can take a minute for a full month.</div>';
    call('uploadActualsCsv',[text,mode],function(rep){
      renderActualsUploadReport(rep,f.name);
      showOk('Imported '+f.name+' — '+(rep.written||0)+' actual row(s) written. '+
             'Read the report below.');
      if(inp) inp.value='';
      loadComparison(); reloadData();
    },function(msg){
      if(host) host.innerHTML='';
      showError(msg);
    });
  };
  fr.readAsText(f);
}

function renderActualsUploadReport(rep,fileName){
  acReport=rep; acReportFile=fileName;
  paintActualsUploadReport();
}

/* The whole point of the feature. Everything below is informational and nothing
   blocks, but each block exists because it names a failure that has actually
   happened and that no other screen would show. */
function paintActualsUploadReport(){
  var host=document.getElementById('acReport');
  if(!host) return;
  var rep=acReport, fileName=acReportFile;
  if(!rep){ host.innerHTML=''; return; }
  if(rep.ok===false){
    host.innerHTML='<div class="err-box" style="margin-top:14px">Nothing was imported'+
      (rep.reason?' ('+esc(rep.reason)+')':'')+'.</div>';
    return;
  }
  var n=function(v){ return Math.round(Number(v)||0).toLocaleString(); };
  var h='<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">';
  h+='<div class="row" style="margin:0 0 10px;align-items:baseline">'+
     '<strong>'+esc(fileName)+'</strong>'+
     '<span class="pill">'+esc(rep.mode||'')+'</span>'+
     '<button class="btn sm" id="acDismiss" style="margin-left:auto">Dismiss</button></div>';

  /* ---- what happened, in numbers ---- */
  h+='<div style="display:flex;gap:26px;flex-wrap:wrap;margin-bottom:6px">';
  h+='<div><div class="small muted">Rows in file</div><div class="num" '+
     'style="font-size:20px">'+n(rep.fileRows)+'</div></div>';
  h+='<div><div class="small muted">Staged</div><div class="num" '+
     'style="font-size:20px">'+n(rep.stagedRows)+'</div></div>';
  h+='<div><div class="small muted">Actual rows written</div><div class="num" '+
     'style="font-size:20px">'+n(rep.written)+'</div></div>';
  h+='<div><div class="small muted">Segment-months</div><div class="num" '+
     'style="font-size:20px">'+n(rep.segmentMonths)+'</div></div>';
  h+='</div>';
  h+='<div class="small muted">Months in the file: '+
     esc((rep.monthsInFile||[]).join(', ')||'—')+'</div>';

  /* ---- old rows that were cleared, so it is visible they were not stacked ---- */
  if(rep.mode==='REPLACE'){
    h+='<div class="small" style="margin-top:10px">'+
       '<span class="sev WARN">replaced</span> The staging tab was emptied first — '+
       n(rep.stagingRowsRemoved)+' row(s) removed. Only this file is staged now.</div>';
  } else if((rep.replacedMonths||[]).length){
    h+='<div class="small" style="margin-top:10px">'+
       '<span class="sev WARN">replaced</span> These months were already staged, so the '+
       'old rows were removed before this file was added rather than summed with it: '+
       esc(rep.replacedMonths.map(function(m){
         return m.month+' ('+n(m.rowsRemoved)+' rows)'; }).join(', '))+'.</div>';
  } else {
    h+='<div class="small muted" style="margin-top:10px">No month in this file was '+
       'already staged, so nothing was removed.</div>';
  }

  /* ---- treatment types that defaulted, with the money ---- */
  if((rep.defaultedTreatments||[]).length){
    h+='<div class="card" style="margin-top:14px"><h2>'+
       '<span class="sev WARN">check</span> '+rep.defaultedValues+
       ' treatment value(s) went to Core Rx by default</h2><div class="body" style="padding:0">';
    h+='<div class="small muted" style="padding:10px 12px">'+n(rep.defaultedRows)+
       ' row(s), £'+(Number(rep.defaultedCost)||0).toFixed(2)+'. These matched nothing '+
       'in the ACTUALS_WL_TREATMENTS config, which is correct for a genuine Core Rx '+
       'condition and wrong for a weight-loss one — and nothing in the sheet says '+
       'which is which. A weight-loss value landing here moves both the volume and the '+
       'blended rate of the Core Rx segment for that brand and country.</div>';
    h+='<table><thead><tr><th>Treatment type</th><th class="right">Rows</th>'+
       '<th class="right">Shipments</th><th class="right">Cost</th>'+
       '<th class="right">Per shipment</th></tr></thead><tbody>';
    rep.defaultedTreatments.forEach(function(d){
      h+='<tr><td class="small">'+esc(d.treatment)+'</td>'+
         '<td class="right num">'+n(d.rows)+'</td>'+
         '<td class="right num">'+n(d.ship)+'</td>'+
         '<td class="right num">£'+(Number(d.cost)||0).toFixed(2)+'</td>'+
         '<td class="right num">£'+(d.ship?(d.cost/d.ship).toFixed(3):'0.000')+'</td></tr>';
    });
    h+='</tbody></table>';
    h+='<div class="small muted" style="padding:8px 12px">Add any weight-loss value to '+
       'Config ACTUALS_WL_TREATMENTS and upload again — re-uploading the same month '+
       'corrects it rather than doubling it.</div>';
    h+='</div></div>';
  }

  /* ---- segments with no High Level ID ---- */
  if((rep.unmatchedSegments||[]).length){
    h+='<div class="card" style="margin-top:14px"><h2>'+
       '<span class="sev WARN">not loaded</span> '+rep.unmatched+
       ' segment(s) have no matching High Level ID</h2><div class="body" style="padding:0">';
    h+='<div class="small muted" style="padding:10px 12px">These rows were read and then '+
       'left out, because there is no active High Level ID for that brand, country and '+
       'treatment. They are missing from the comparison entirely — not counted as '+
       'zero.</div>';
    h+='<table><thead><tr><th>Brand</th><th>Location</th><th>Treatment</th>'+
       '<th class="right">Shipments</th><th class="right">Cost</th></tr></thead><tbody>';
    rep.unmatchedSegments.forEach(function(u){
      h+='<tr><td class="small">'+esc(u.brand)+'</td><td class="small">'+esc(u.geo)+'</td>'+
         '<td class="small">'+esc(u.treat)+'</td>'+
         '<td class="right num">'+n(u.ship)+'</td>'+
         '<td class="right num">£'+(Number(u.cost)||0).toFixed(2)+'</td></tr>';
    });
    h+='</tbody></table>';
    h+='<div class="small muted" style="padding:8px 12px">Add a High Level ID on the '+
       'Structure tab if these should be forecast.</div></div></div>';
  }

  /* ---- shipments that arrived with no money ---- */
  if((rep.zeroCost||[]).length){
    h+='<div class="card" style="margin-top:14px"><h2>'+
       '<span class="sev WARN">no cost</span> '+n(rep.zeroCostRows)+
       ' row(s) had shipments but a cost of 0</h2><div class="body" style="padding:0">';
    h+='<div class="small muted" style="padding:10px 12px">'+n(rep.zeroCostShipments)+
       ' shipments. These still count towards the blended rate as a divisor with nothing '+
       'on top, so they pull the measured rate below the truth. A genuine zero and a cost '+
       'column that did not parse look identical here — check the file if a segment '+
       'below is one you would expect to be paying for.</div>';
    h+='<table><thead><tr><th>Brand</th><th>Location</th><th>Treatment</th><th>Month</th>'+
       '<th class="right">Rows</th><th class="right">Shipments</th></tr></thead><tbody>';
    rep.zeroCost.forEach(function(z){
      h+='<tr><td class="small">'+esc(z.brand)+'</td><td class="small">'+esc(z.geo)+'</td>'+
         '<td class="small">'+esc(z.treat)+'</td><td class="num">'+esc(z.month)+'</td>'+
         '<td class="right num">'+n(z.rows)+'</td>'+
         '<td class="right num">'+n(z.ship)+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }

  /* ---- rows that never made it as far as a segment ---- */
  if((rep.skipReasons||[]).length){
    h+='<div class="small" style="margin-top:14px"><strong>'+n(rep.rowsSkipped)+
       ' row(s) skipped.</strong> <span class="muted">';
    h+=rep.skipReasons.map(function(s){
      return n(s.rows)+' — '+esc(s.reason)+' (e.g. sheet row '+
             s.examples.join(', ')+')'; }).join('; ');
    h+='. Trailing blank rows are normal; a month that could not be read is not.</span></div>';
  }

  /* ---- rows the write path itself refused ---- */
  if((rep.writeErrors||[]).length){
    h+='<div class="err-box" style="margin-top:14px"><strong>'+n(rep.writeSkipped)+
       ' row(s) could not be written.</strong> Usually a scope refusal — the import '+
       'covers every segment, and each row is still checked against your scope, so those '+
       'segments are missing from the comparison.<br>'+
       esc(rep.writeErrors.join(' • '))+'</div>';
  }

  /* ---- months outside the horizon ---- */
  if((rep.outsideHorizon||[]).length){
    var os=0; rep.outsideHorizon.forEach(function(o){ os+=Number(o.ship)||0; });
    h+='<div class="small muted" style="margin-top:12px">'+rep.outsideHorizon.length+
       ' month(s) in the file are outside the forecast horizon and were ignored ('+
       esc(rep.outsideHorizon.map(function(o){return o.month;}).join(', '))+', '+
       n(os)+' shipments).</div>';
  }

  /* ---- headers that were guessed rather than matched ---- */
  var fuzzy=(rep.columnsMatched||[]).filter(function(c){ return c.mode==='fuzzy'; });
  if(fuzzy.length){
    h+='<div class="small" style="margin-top:12px"><span class="sev WARN">headers</span> '+
       esc(fuzzy.map(function(c){ return c.label+' → "'+c.header+'"'; }).join(', '))+
       ' <span class="muted">matched on a partial name rather than exactly. If the numbers '+
       'above look wrong, this is the first thing to check.</span></div>';
  }
  if((rep.columnsMissing||[]).length){
    h+='<div class="small muted" style="margin-top:8px">Not in this file, left blank: '+
       esc(rep.columnsMissing.join(', '))+'. The import aggregates these away, so it does '+
       'not affect the result.</div>';
  }
  if((rep.unreadableMonths||[]).length){
    h+='<div class="small muted" style="margin-top:8px">Month values that could not be '+
       'read: '+esc(rep.unreadableMonths.join(', '))+'.</div>';
  }

  /* ---- and say so plainly when there is nothing to say ---- */
  if(!(rep.defaultedTreatments||[]).length && !(rep.unmatchedSegments||[]).length &&
     !(rep.zeroCost||[]).length && !(rep.writeErrors||[]).length){
    h+='<div class="ok-box" style="margin-top:14px">Nothing to flag. Every treatment type '+
       'was recognised, every segment matched a High Level ID, and every row with '+
       'shipments carried a cost.</div>';
  }

  h+='</div>';
  host.innerHTML=h;

  var d=document.getElementById('acDismiss');
  if(d) d.onclick=function(){ acReport=null; acReportFile=''; host.innerHTML=''; };
}

function loadComparison(){
  var host=document.getElementById('aHost'); if(!host) return;
  call('getActualsComparison',[1],function(r){ cmp=r; renderComparison(); },
    function(m){ host.innerHTML='<div class="card"><div class="empty">'+esc(m)+'</div></div>'; },true);
}

function renderComparison(){
  var host=document.getElementById('aHost'); if(!host||!cmp) return;
  var s=cmp.summary, h='';

  if(!cmp.rows.length){
    h+='<div class="card"><div class="empty">No actuals recorded yet.<br><br>'+
       '<span class="small">Add a month above, or import from Metabase once the '+
       'connection is proven — see the note at the bottom of this screen.</span></div></div>';
  } else {
    h+='<div class="grid2">';
    h+='<div class="card"><h2>Against forecast</h2><div class="body">';
    h+='<div style="display:flex;gap:26px;flex-wrap:wrap">';
    h+='<div><div class="small muted">Months compared</div>'+
       '<div style="font-size:22px" class="num">'+s.matched+'</div></div>';
    h+='<div><div class="small muted">Mean forecast</div>'+
       '<div style="font-size:22px" class="num">'+(s.meanForecast===null?'—':money(s.meanForecast))+'</div></div>';
    h+='<div><div class="small muted">Mean actual</div>'+
       '<div style="font-size:22px" class="num">'+(s.meanActual===null?'—':money(s.meanActual))+'</div></div>';
    h+='<div><div class="small muted">Variance</div>'+
       '<div style="font-size:22px" class="num '+
       (s.meanVariancePct===null?'muted':(s.meanVariancePct>0?'up':'down'))+'">'+
       (s.meanVariancePct===null?'—':((s.meanVariancePct>0?'+':'')+(s.meanVariancePct*100).toFixed(1)+'%'))+
       '</div></div>';
    h+='</div>';
    h+='<div class="small muted" style="margin-top:12px">A positive variance means postage '+
       'cost more than the model predicted. '+s.withinTolerance+' of '+s.matched+
       ' months are within the '+(s.tolerancePct*100).toFixed(0)+'% tolerance set in Config.</div>';
    h+='</div></div>';

    h+='<div class="card"><h2>Volume-weighted</h2><div class="body">';
    if(s.weightedActual===null){
      h+='<div class="muted small">No order counts recorded, so only the simple mean is '+
         'available. Enter orders and total spend rather than a rate and the weighted '+
         'figure becomes possible — which is the one that matters for a budget, since a '+
         'heavy month should count for more than a light one.</div>';
    } else {
      h+='<div style="display:flex;gap:26px;flex-wrap:wrap">';
      h+='<div><div class="small muted">Weighted actual rate</div>'+
         '<div style="font-size:22px" class="num">'+money(s.weightedActual)+'</div></div>';
      h+='<div><div class="small muted">Orders</div>'+
         '<div style="font-size:22px" class="num">'+Math.round(s.totalOrders).toLocaleString()+'</div></div>';
      h+='</div>';
      h+='<div class="small muted" style="margin-top:12px">Total spend divided by total '+
         'orders across every month recorded.</div>';
    }
    h+='</div></div></div>';

    h+='<div class="card"><h2>Month by month</h2><div class="body" style="padding:0">';
    h+='<table><thead><tr><th>Brand</th><th>Location</th><th>Treatment</th><th>Month</th>'+
       '<th class="right">Forecast</th><th class="right">Actual</th>'+
       '<th class="right">Variance</th><th class="right">Orders</th>'+
       '<th>Source</th><th></th></tr></thead><tbody>';
    cmp.rows.forEach(function(r){
      var hl=S.hlIds.filter(function(x){return x.id===r.hlId;})[0]||{};
      var over=r.flag==='OVER_TOLERANCE', none=r.flag==='NO_FORECAST';
      h+='<tr'+(over?' style="background:#FFF9EC"':'')+'>'+
         '<td class="small">'+esc(hl.brand||'')+'</td>'+
         '<td class="small">'+esc(hl.geo||'')+'</td>'+
         '<td class="small">'+esc(treatmentLabel(hl))+'</td>'+
         '<td class="num">'+esc(r.month)+'</td>'+
         '<td class="right num">'+(r.forecast===null?
            '<span class="sev WARN">no forecast</span>':money(r.forecast))+'</td>'+
         '<td class="right num"><strong>'+money(r.actual)+'</strong></td>'+
         '<td class="right num '+(r.variance===null?'muted':(r.variance>0?'up':'down'))+'">'+
            (r.variance===null?'—':((r.variance>0?'+':'')+money(r.variance)+
            ' ('+(r.variancePct>0?'+':'')+(r.variancePct*100).toFixed(1)+'%)'))+'</td>'+
         '<td class="right num muted">'+(r.orders?Math.round(r.orders).toLocaleString():'—')+'</td>'+
         '<td class="small muted">'+esc(r.source)+'</td>'+
         '<td class="right">'+(cmp.canEdit?
            '<button class="btn sm" data-ea="'+r.id+'">Edit</button> '+
            '<button class="btn sm danger" data-da="'+r.id+'">Delete</button>':'')+'</td></tr>';
    });
    h+='</tbody></table>';
    h+='<div class="small muted" style="padding:8px 12px">Shaded rows are outside the '+
       'tolerance. "No forecast" means an actual exists for a month the model has not '+
       'published — check the month is inside the horizon and the forecast has been run.</div>';
    h+='</div></div>';
  }

  h+='<div class="card"><h2>Automatic feed from Metabase</h2><div class="body small muted">'+
     '<p style="margin-top:0">Not connected yet, on purpose. Two things have to be true first, '+
     'and neither can be assumed:</p>'+
     '<p><strong style="color:var(--ink)">1. Google has to be able to reach Metabase.</strong> '+
     'Apps Script runs on Google servers, not inside your network. If Metabase is VPN-only or '+
     'IP-allowlisted it cannot be reached, and no code fixes that. Run '+
     '<code>testMetabaseConnection</code> from the editor to find out in about three seconds.</p>'+
     '<p><strong style="color:var(--ink)">2. The grain has to line up.</strong> The forecast is '+
     'a rate per order at brand, location, treatment and split. Metabase will return whatever '+
     'shape the warehouse uses. Run <code>previewMetabaseCard</code> to see the columns, send '+
     'them over, and the mapping can be written.</p>'+
     '<p style="margin-bottom:0">Until then, entering months by hand works and gives you the '+
     'same comparison.</p>'+
     '</div></div>';

  host.innerHTML=h;

  Array.prototype.forEach.call(document.querySelectorAll('[data-ea]'),function(b){
    b.onclick=function(){ editActual(Number(b.getAttribute('data-ea'))); };});
  Array.prototype.forEach.call(document.querySelectorAll('[data-da]'),function(b){
    b.onclick=function(){
      if(!confirm('Delete this actual?')) return;
      call('deleteActual',[Number(b.getAttribute('data-da'))],function(){
        showOk('Deleted.'); loadComparison(); reloadData(); });
    };});
}

function editActual(id){
  var r = id ? (cmp && cmp.rows.filter(function(x){return x.id===id;})[0]) : null;
  openForm({
    title:(id?'Edit actuals':'Add or update a month of actuals'),
    intro:'Enter orders and total spend and the blended rate is worked out as spend divided '+
          'by orders, so the three cannot drift apart. A rate on its own is accepted, but '+
          'then the volume-weighted comparison is not available.',
    fields:[
      {key:'hlId', label:'Segment', type:'select', required:true,
       value:r?r.hlId:(S.sel.hlId||''), options:optsHl()},
      {key:'monthStart', label:'Month', type:'date', required:true,
       value:r?r.monthStart:'', hint:'Use the 1st of the month.'},
      {key:'orders', label:'Orders', type:'number', min:0, step:'1',
       value:r&&r.orders?r.orders:'', placeholder:'12500'},
      {key:'totalSpend', label:'Total postage spend', type:'number', min:0, step:'0.01',
       value:r&&r.totalSpend?r.totalSpend:'', placeholder:'38500.00'},
      {key:'blendedRate', label:'Or the blended rate directly', type:'number', min:0, step:'0.0001',
       value:'', placeholder:'3.0800',
       hint:'Only needed if you do not have orders and spend.'}
    ],
    onSave:function(v, done, fail){
      if(!Number(v.orders) && !Number(v.blendedRate)){
        return fail('Enter either orders and total spend, or a blended rate.');
      }
      call('saveActual',[{ id:id||0, hlId:Number(v.hlId), monthStart:v.monthStart,
        orders:Number(v.orders||0), totalSpend:Number(v.totalSpend||0),
        blendedRate:Number(v.blendedRate||0) }],
        function(res){ done();
          showOk('Saved — blended rate '+money(res.blendedRate)+
                 (res.derived?' (spend divided by orders)':' (as entered)')+'.');
          loadComparison(); reloadData(); }, fail);
    }
  });
}

/* ===================================================================
   History — forecast snapshots, and the change log
   =================================================================== */
var snapDiff=null;

function viewHistory(){
  if(!S.loaded) return '<div class="card"><div class="body">'+loading()+'</div></div>';
  var sec=S.sel.histSection||'snapshots';
  var tabs=[['snapshots','Forecast Snapshot'],['audit','Change log']];
  var h='<div class="card"><div class="body" style="padding:10px 12px">';
  h+='<div style="display:flex;gap:2px">'+tabs.map(function(t){
     return '<button class="btn sm'+(sec===t[0]?' primary':'')+'" data-hs="'+t[0]+'">'+
            t[1]+'</button>'; }).join('')+'</div></div></div>';
  if(sec==='snapshots') h+=viewSnapshots();
  if(sec==='audit')     h+=viewAuditLog();
  return h;
}
function wireHistory(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-hs]'),function(b){
    b.onclick=function(){ S.sel.histSection=b.getAttribute('data-hs'); renderAll(); };
  });
  if((S.sel.histSection||'snapshots')==='snapshots') wireSnapshots();
}

/* ---- forecast snapshots ---- */
function viewSnapshots(){
  var h='<div class="card"><div class="body"><div class="row" style="margin:0">';
  if(can('runCalc')) h+='<button class="btn primary" id="snapNow">Take a snapshot now</button>';
  h+='<span class="small muted" style="align-self:center">A snapshot is taken automatically '+
     'each Monday, but only stored when the forecast has actually moved.</span>';
  h+='</div></div></div>';

  h+='<div class="card"><h2>Snapshots</h2><div class="body" style="padding:0">';
  if(!S.snapshots.length){
    h+='<div class="empty">None yet.<br><br><span class="small">Take one above to start the '+
       'record, and ask whoever set the portal up to run <code>installWeeklySnapshot</code> '+
       'once so it happens on its own.</span></div>';
  } else {
    h+='<table><thead><tr><th class="right" style="width:50px">ID</th><th>Taken</th>'+
       '<th>By</th><th>How</th><th>Label</th><th class="right">Rows changed</th>'+
       '<th></th></tr></thead><tbody>';
    S.snapshots.forEach(function(s,i){
      h+='<tr><td class="right num">'+s.id+'</td><td class="num small">'+esc(s.ts)+'</td>'+
         '<td class="small muted">'+esc(s.by)+'</td>'+
         '<td class="small">'+(s.trigger==='WEEKLY'?'<span class="pill">weekly</span>':'manual')+'</td>'+
         '<td class="small">'+esc(s.label)+'</td>'+
         '<td class="right num">'+(s.changed||'—')+'</td>'+
         '<td class="right"><button class="btn sm" data-snap="'+s.id+'">'+
         (i===0?'Compare with now':'Compare with next')+'</button></td></tr>';
    });
    h+='</tbody></table>';
    h+='<div class="small muted" style="padding:8px 12px">Gaps in the dates are the point: a '+
       'week with no entry is a week the forecast did not move. "Rows changed" counts how many '+
       'of the 612 segment-months differed from the snapshot before it.</div>';
  }
  h+='</div></div>';
  h+='<div id="snapHost"></div>';
  return h;
}

function wireSnapshots(){
  var b=document.getElementById('snapNow');
  if(b) b.onclick=function(){
    openForm({
      title:'Take a snapshot',
      intro:'Records what the forecast says right now, so a later change can be traced back. '+
            'Nothing is stored if the numbers have not moved since the last one.',
      saveLabel:'Take snapshot',
      fields:[
        {key:'label', label:'Label', type:'text', placeholder:'before RM April uplift',
         hint:'Optional, but it is how you will find this one again.'}
      ],
      onSave:function(v, done, fail){
        call('takeForecastSnapshot',[v.label],function(r){
          done();
          if(r.stored) showOk('Snapshot '+r.snapshotId+' stored — '+r.changedRows+' rows changed.');
          else showOk(r.reason||'Nothing stored — the forecast has not moved.');
          reloadData();
        }, fail);
      }
    });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-snap]'),function(btn){
    btn.onclick=function(){
      var id=Number(btn.getAttribute('data-snap'));
      var idx=S.snapshots.map(function(s){return s.id;}).indexOf(id);
      var toId = idx===0 ? 0 : S.snapshots[idx-1].id;   // list is newest first
      var host=document.getElementById('snapHost');
      host.innerHTML='<div class="card"><div class="body">'+loading()+'</div></div>';
      call('compareSnapshots',[id,toId],function(r){ snapDiff=r; renderSnapDiff(); },
        function(m){ host.innerHTML='<div class="card"><div class="empty">'+esc(m)+'</div></div>'; },true);
    };
  });
}

function renderSnapDiff(){
  var host=document.getElementById('snapHost'); if(!host||!snapDiff) return;
  var d=snapDiff;
  var toLabel = d.toId ? ('snapshot '+d.toId) : 'the forecast as it stands now';
  var h='<div class="card"><h2>Snapshot '+d.fromId+' compared with '+toLabel+'</h2>';
  h+='<div class="body">';
  h+='<div style="display:flex;gap:26px;flex-wrap:wrap">';
  h+='<div><div class="small muted">Segment-months changed</div>'+
     '<div style="font-size:22px" class="num">'+d.changed+'</div></div>';
  h+='<div><div class="small muted">Unchanged</div>'+
     '<div style="font-size:22px" class="num muted">'+d.unchanged+'</div></div>';
  h+='</div>';
  if(!d.changed) h+='<div class="small muted" style="margin-top:10px">Identical. '+
     'Nothing about the rates or mixes moved the forecast between these two points.</div>';
  h+='</div>';

  if(d.segments.length){
    h+='<div class="body" style="padding:0;border-top:1px solid var(--line)">';
    h+='<table><thead><tr><th>Brand</th><th>Location</th><th>Treatment</th>'+
       '<th class="right">Months affected</th><th class="right">Mean change</th>'+
       '</tr></thead><tbody>';
    d.segments.forEach(function(s){
      var hl=S.hlIds.filter(function(x){return x.id===s.hlId;})[0]||{};
      h+='<tr><td class="small">'+esc(hl.brand||'')+'</td>'+
         '<td class="small">'+esc(hl.geo||'')+'</td>'+
         '<td class="small">'+esc(treatmentLabel(hl))+'</td>'+
         '<td class="right num">'+s.months+'</td>'+
         '<td class="right num '+(s.meanDiff>0?'up':'down')+'">'+
         (s.meanDiff>0?'+':'')+money(s.meanDiff)+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  if(d.diffs.length){
    h+='<div class="body" style="padding:0;border-top:1px solid var(--line)">';
    h+='<table><thead><tr><th>Brand</th><th>Treatment</th><th>Month</th>'+
       '<th class="right">Before</th><th class="right">After</th>'+
       '<th class="right">Change</th></tr></thead><tbody>';
    d.diffs.slice(0,60).forEach(function(r){
      var hl=S.hlIds.filter(function(x){return x.id===r.hlId;})[0]||{};
      h+='<tr><td class="small">'+esc(hl.brand||'')+'</td>'+
         '<td class="small">'+esc(treatmentLabel(hl))+'</td>'+
         '<td class="num">'+esc(r.month)+'</td>'+
         '<td class="right num">'+(r.before===null?'—':money(r.before))+'</td>'+
         '<td class="right num">'+(r.after===null?'—':money(r.after))+'</td>'+
         '<td class="right num '+(r.diff===null?'muted':(r.diff>0?'up':'down'))+'">'+
         (r.diff===null?'new/removed':((r.diff>0?'+':'')+money(r.diff)+
         (r.pct===null?'':' ('+(r.pct>0?'+':'')+r.pct.toFixed(1)+'%)')))+'</td></tr>';
    });
    h+='</tbody></table>';
    if(d.diffs.length>60) h+='<div class="small muted" style="padding:8px 12px">'+
       'Showing the 60 largest of '+d.diffs.length+' changes.</div>';
    h+='</div>';
  }
  h+='</div>';
  host.innerHTML=h;
}

/* ---- the change log ---- */
function viewAuditLog(){
  var h='<div class="card"><h2>Recent changes</h2><div class="body" style="padding:0">';
  if(!S.recentAudit.length) h+='<div class="empty">Nothing recorded yet.</div>';
  else{
    h+='<table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>What</th>'+
       '<th>Field</th><th>From</th><th>To</th><th>Batch</th></tr></thead><tbody>';
    S.recentAudit.forEach(function(a){
      /* Rows written by one bulk action all carry its reference in Detail, so a
         change made to fifty routes at once reads as one thing somebody did. */
      var batch=/^BULK-/.test(a.detail||'')?String(a.detail).split(' ')[0]:'';
      h+='<tr'+(a.success?'':' style="opacity:.6"')+'><td class="small num">'+esc(a.ts)+'</td>'+
         '<td class="small">'+esc(a.email)+'</td>'+
         '<td class="small">'+esc(a.action)+'</td>'+
         '<td class="small">'+esc(a.entity)+' '+esc(a.entityId)+'</td>'+
         '<td class="small muted">'+esc(a.field)+'</td>'+
         '<td class="small num">'+esc(a.oldValue)+'</td>'+
         '<td class="small num">'+esc(a.newValue||(batch?'':a.detail))+'</td>'+
         '<td class="small muted num">'+(batch?'<span class="pill">'+esc(batch)+'</span>':'')+'</td></tr>';
    });
    h+='</tbody></table>';
    h+='<div class="small muted" style="padding:8px 12px">Faded rows are attempts that were '+
       'refused. Rows sharing a batch reference were one bulk update, not separate edits. '+
       'Snapshots say what the forecast did; this says what somebody changed.</div>';
  }
  h+='</div></div>';
  return h;
}

boot();
</script>
</body>
</html>
