<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --brand:#0000FF; --brand-lo:#0000C2; --brand-tint:#F0F0FF;
  --ink:#0B0B0F; --ink-2:#3F4451; --ink-3:#6B7280;
  --line:#E4E6EC; --line-2:#C8CBD4;
  --bg:#F7F8FA; --surface:#FFFFFF;
  --ok:#0F8A5F; --warn:#B8730A; --err:#C6273E;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
a{color:var(--brand)}

/* ---- header ---- */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:20px;padding:10px 20px;max-width:1400px;margin:0 auto}
.logo{height:22px;width:auto;display:block}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav button{padding:7px 11px;font-size:13px;color:var(--ink-3);border-radius:6px 6px 0 0;white-space:nowrap}
nav button:hover{color:var(--ink);background:var(--bg)}
nav button.on{color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--brand)}
.hright{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:6px}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--warn);animation:pulse 1s infinite}
.dot.err{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.badge{background:var(--brand-tint);color:var(--brand-lo);border-radius:10px;padding:1px 8px;font-size:11px}
.badge.amber{background:#FFF4E0;color:var(--warn)}

/* ---- layout ---- */
main{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
.screen{display:none} .screen.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.card>h2{font-size:14px;font-weight:500;margin:0;padding:13px 16px;border-bottom:1px solid var(--line)}
.card>.body{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--ink-3)} .small{font-size:12px}
.right{text-align:right} .mono{font-variant-numeric:tabular-nums}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--ink-3);
   padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr.sel{background:var(--brand-tint)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg)}

/* ---- controls ---- */
.btn{padding:7px 13px;border-radius:var(--radius);border:1px solid var(--line-2);
     background:var(--surface);font-size:13px;color:var(--ink-2)}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-lo)}
.btn.danger{color:var(--err);border-color:#F0C9CF}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
input[type=text],input[type=date],input[type=number],select{
  padding:6px 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);width:100%}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
input.bad{border-color:var(--err);background:#FFF6F7}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.pill{display:inline-block;background:var(--brand-tint);color:var(--brand-lo);
      border-radius:4px;padding:1px 7px;font-size:11px}
.sev{border-radius:4px;padding:1px 7px;font-size:11px;font-weight:500}
.sev.ERROR{background:#FDEBED;color:var(--err)}
.sev.WARN{background:#FFF4E0;color:var(--warn)}
.sev.INFO{background:#EEF1F5;color:var(--ink-3)}
.total{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:2px solid var(--line);
       font-size:13px;font-weight:500}
.total.bad{color:var(--err)} .total.good{color:var(--ok)}
.empty{padding:32px;text-align:center;color:var(--ink-3);font-size:13px}
.err-box{background:#FDEBED;border:1px solid #F0C9CF;color:var(--err);
         padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px}
.ok-box{background:#EAF7F1;border:1px solid #BFE5D5;color:var(--ok);
        padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--line-2);
         border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;
         vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.load{padding:60px;text-align:center;color:var(--ink-3)}
.up{color:var(--err)} .down{color:var(--ok)}

/* ---- modal form ---- */
.back{position:absolute;inset:0;background:rgba(11,11,15,.42);display:flex;
      align-items:flex-start;justify-content:center;padding:60px 20px 40px;z-index:100}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:480px;
       box-shadow:0 18px 48px rgba(11,11,15,.22);overflow:hidden}
.modal h3{margin:0;padding:16px 20px 14px;font-size:16px;font-weight:500;
          border-bottom:1px solid var(--line)}
.modal .intro{margin:0;padding:12px 20px 0;font-size:13px;color:var(--ink-3)}
.modal .tiles{padding:14px 20px 4px;display:flex;flex-direction:column;gap:8px;
       max-height:56vh;overflow:auto}
.modal .tiles button{display:block;width:100%;text-align:left;cursor:pointer;
       padding:10px 12px;border:1px solid var(--line);border-radius:10px;
       background:var(--surface);font:inherit;color:inherit}
.modal .tiles button:hover,.modal .tiles button:focus{border-color:var(--brand);
       background:var(--brand-tint);outline:none}
.modal .tiles button .t{display:block;font-size:14px}
.modal .tiles button .s{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.modal .tiles button.all{border-style:dashed}
.modal .fbody{padding:12px 20px 0;font-size:13px;max-height:46vh;overflow:auto}
.modal .fbody table{width:100%;border-collapse:collapse;margin:8px 0 2px}
.modal .fbody th,.modal .fbody td{padding:4px 6px;border-bottom:1px solid var(--line);
       font-size:12px;text-align:left}
.modal .fbody th{color:var(--ink-3);font-weight:500}
.modal .fbody td.right,.modal .fbody th.right{text-align:right}
.modal .fbody .warn{margin-top:8px;padding:8px 10px;border-radius:8px;
       background:#FFF6E5;border:1px solid #F2DDB0;color:#7A5A12;font-size:12px}
.modal .fields{padding:16px 20px 4px;display:flex;flex-direction:column;gap:14px}
.modal .fields .field label{font-size:12px;color:var(--ink-2)}
.modal .hint{font-size:11px;color:var(--ink-3);margin-top:2px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;
             border-top:1px solid var(--line);background:var(--bg)}
.modal .merr{margin:0 20px;padding:9px 11px;background:#FDEBED;border:1px solid #F0C9CF;
             color:var(--err);border-radius:8px;font-size:13px}
.inline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.inline input[type=checkbox]{width:auto}
.suffixed{display:flex;align-items:center;gap:6px}
.suffixed span{font-size:12px;color:var(--ink-3);white-space:nowrap}
</style>
</head>

<script>
/* ===================================================================
   State
   =================================================================== */
var S = {
  user:null, ref:{}, carriers:[], methods:[], surchargeTypes:[],
  calendar:[], hlIds:[], mdIds:[], scenarios:[], config:{}, status:{},
  rateBase:[], rateSurcharge:[], mixMethod:[], mixLP:[], mixCC:[],
  output:[], validation:[], recentAudit:[], actuals:[], snapshots:[],
  screen:'dashboard', loaded:false,
  sel:{ hlId:null, modellingId:null, regime:'CC', lp:'PARCEL', asAt:null,
        dashYear:null, mixSection:'method', adminSection:'carriers',
        histSection:'snapshots',
        chartHl:null,
        chartSeries:{f1:true,f2:true,f3:true,f4:true,a1:true,a2:true,a3:true,a4:true} }
};
var TABS = [
  ['dashboard','Dashboard',null],
  ['rates','Rates','editRates'],
  ['mixes','Mixes','editMixes'],
  ['output','Output',null],
  ['actuals','Actuals',null],
  ['admin','Admin','editStructure'],
  ['validation','Checks',null],
  ['history','History','viewAudit']
];

/* ===================================================================
   Server calls, with the save indicator wired in automatically
   =================================================================== */
var inflight = 0;
function setSave(state, msg){
  var el = document.getElementById('saveState');
  if(state==='busy') el.innerHTML = '<span class="dot busy"></span>Saving…';
  else if(state==='err') el.innerHTML = '<span class="dot err"></span>'+(msg||'Not saved');
  else el.innerHTML = '<span class="dot ok"></span>Saved';
}
function call(fn, args, onOk, onErr, quiet){
  if(!quiet){ inflight++; setSave('busy'); }
  google.script.run
    .withSuccessHandler(function(r){
      if(!quiet){ inflight--; if(inflight<=0){ inflight=0; setSave('ok'); } }
      if(onOk) onOk(r);
    })
    .withFailureHandler(function(e){
      if(!quiet){ inflight--; if(inflight<=0){ inflight=0; setSave('err'); } }
      var m = (e && e.message) ? e.message : String(e);
      if(onErr) onErr(m); else showError(m);
    })
    [fn].apply(null, args||[]);
}
window.addEventListener('beforeunload', function(e){
  if(inflight>0){ e.preventDefault(); e.returnValue=''; }
});

/* ===================================================================
   Helpers
   =================================================================== */
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function money(n,dp){ return (Number(n)||0).toFixed(dp===undefined?4:dp); }
function pct(n,dp){ return ((Number(n)||0)*100).toFixed(dp===undefined?2:dp)+'%'; }
function hlName(id){
  var h=S.hlIds.filter(function(x){return x.id===id;})[0];
  return h ? (h.brand+' '+h.geo+' '+h.treatmentType+(h.wlSplit&&h.wlSplit!=='*'?' '+h.wlSplit:'')) : ('High Level ID '+id);
}
function mdName(id){
  var m=S.mdIds.filter(function(x){return x.id===id;})[0];
  return m ? (m.carrier+' / '+m.method+' / '+m.letterParcel) : ('Modelling ID '+id);
}
function can(cap){ return S.user && (S.user.allAccess || S.user.capabilities[cap]); }
function showError(msg){
  var b=document.createElement('div'); b.className='err-box'; b.textContent=msg;
  var host=document.querySelector('.screen.on'); if(!host) return alert(msg);
  host.insertBefore(b, host.firstChild);
  setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 8000);
}
function showOk(msg){
  var b=document.createElement('div'); b.className='ok-box'; b.textContent=msg;
  var host=document.querySelector('.screen.on'); if(!host) return;
  host.insertBefore(b, host.firstChild);
  setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 5000);
}

/* ===================================================================
   Modal form
   -------------------------------------------------------------------
   Replaces window.prompt. A browser prompt cannot label its fields, so
   everything had to be crammed into one comma-separated string — which meant
   users had to remember the field order, and a raw date serial leaking into the
   prefill was invisible until someone looked closely at it.
   =================================================================== */
var openModal=null;

function closeForm(){
  if(openModal && openModal.parentNode) openModal.parentNode.removeChild(openModal);
  openModal=null;
  document.onkeydown=null;
}

/**
 * cfg = { title, intro, body, saveLabel, fields:[...], onSave(values, done, fail) }
 * field = { key, label, type, value, options, hint, required, min, max, step,
 *           suffix, placeholder, openEnded }
 *   type: text | number | date | select | month
 *
 * cfg.body is a block of markup shown above the fields, for a step that has
 * something to show rather than something to fill in — a table of what a bulk
 * change would do, or a set of choices to click. Like cfg.intro and field.hint it
 * is injected as raw HTML, so every value interpolated into it must go through
 * esc().
 *
 * cfg.afterRender(root, close) runs once the modal is in the document, so a
 * caller can wire up whatever it put in cfg.body. cfg.saveLabel:null leaves out
 * the primary button entirely, for a step where the choice IS the action and
 * there is nothing to confirm — the only way past it is to make a choice or
 * cancel.
 */
function openForm(cfg){
  closeForm();
  var back=document.createElement('div');
  back.className='back';

  var h='<div class="modal" role="dialog" aria-modal="true">';
  h+='<h3>'+esc(cfg.title)+'</h3>';
  if(cfg.intro) h+='<p class="intro">'+cfg.intro+'</p>';
  if(cfg.body) h+='<div class="fbody">'+cfg.body+'</div>';
  h+='<div class="merr" id="mErr" style="display:none"></div>';
  h+='<div class="fields">';

  cfg.fields.forEach(function(f){
    h+='<div class="field"><label for="mf_'+f.key+'">'+esc(f.label)+
       (f.required?' <span style="color:var(--err)">*</span>':'')+'</label>';
    if(f.type==='select'){
      h+='<select id="mf_'+f.key+'">';
      if(!f.required) h+='<option value=""></option>';
      (f.options||[]).forEach(function(o){
        var v=(o.value!==undefined?o.value:o), l=(o.label!==undefined?o.label:o);
        h+='<option value="'+esc(v)+'"'+(String(v)===String(f.value)?' selected':'')+'>'+
           esc(l)+'</option>';
      });
      h+='</select>';
    } else if(f.suffix){
      h+='<div class="suffixed"><input id="mf_'+f.key+'" type="'+(f.type||'text')+'"'+
         (f.step?' step="'+f.step+'"':'')+(f.min!==undefined?' min="'+f.min+'"':'')+
         (f.max!==undefined?' max="'+f.max+'"':'')+
         ' value="'+esc(f.value===null||f.value===undefined?'':f.value)+'"'+
         (f.placeholder?' placeholder="'+esc(f.placeholder)+'"':'')+'>'+
         '<span>'+esc(f.suffix)+'</span></div>';
    } else {
      h+='<input id="mf_'+f.key+'" type="'+(f.type==='month'?'date':(f.type||'text'))+'"'+
         (f.step?' step="'+f.step+'"':'')+(f.min!==undefined?' min="'+f.min+'"':'')+
         (f.max!==undefined?' max="'+f.max+'"':'')+
         (f.readonly?' readonly style="background:var(--bg);color:var(--ink-3)"':'')+
         ' value="'+esc(f.value===null||f.value===undefined?'':f.value)+'"'+
         (f.placeholder?' placeholder="'+esc(f.placeholder)+'"':'')+'>';
    }
    if(f.openEnded){
      h+='<label class="inline" style="margin-top:6px"><input type="checkbox" id="mo_'+f.key+'"'+
         (String(f.value).indexOf('9999')===0?' checked':'')+'> No end date</label>';
    }
    if(f.hint) h+='<div class="hint">'+f.hint+'</div>';
    h+='</div>';
  });

  h+='</div><div class="acts">'+
     '<button class="btn" id="mCancel">Cancel</button>'+
     (cfg.saveLabel===null?'':
       '<button class="btn primary" id="mSaveBtn">'+esc(cfg.saveLabel||'Save')+'</button>')+
     '</div></div>';
  back.innerHTML=h;
  document.body.appendChild(back);
  openModal=back;

  function fail(msg){
    var e=back.querySelector('#mErr');
    e.style.display='block'; e.textContent=msg;
    var b=back.querySelector('#mSaveBtn'); b.disabled=false; b.textContent=cfg.saveLabel||'Save';
  }

  cfg.fields.forEach(function(f){
    if(!f.openEnded) return;
    var cb=back.querySelector('#mo_'+f.key), inp=back.querySelector('#mf_'+f.key);
    if(!cb || !inp) return;      // one missing element should not kill the form
    function sync(){
      if(cb.checked){ inp.value='9999-12-31'; inp.disabled=true; }
      else { if(inp.value==='9999-12-31') inp.value=''; inp.disabled=false; }
    }
    cb.onchange=sync; sync();
  });

  back.querySelector('#mCancel').onclick=closeForm;
  back.onclick=function(e){ if(e.target===back) closeForm(); };
  document.onkeydown=function(e){ if(e.key==='Escape') closeForm(); };

  if(cfg.afterRender) cfg.afterRender(back, closeForm);

  var saveBtn=back.querySelector('#mSaveBtn');
  if(saveBtn) saveBtn.onclick=function(){
    var vals={}, missing=[];
    cfg.fields.forEach(function(f){
      var el=back.querySelector('#mf_'+f.key);
      var v=el?el.value:(f.value===undefined?'':f.value);
      if(f.required && String(v).trim()==='') missing.push(f.label);
      vals[f.key]=v;
    });
    if(missing.length) return fail('Please fill in: '+missing.join(', '));
    var b=back.querySelector('#mSaveBtn');
    b.disabled=true; b.textContent='Saving…';
    cfg.onSave(vals, closeForm, fail);
  };

  var first=back.querySelector('.fields input:not([disabled]), .fields select, .tiles button');
  if(first) first.focus();
}

/** Options helpers for the selects. */
function optsRef(list){
  return (S.ref[list]||[]).map(function(v){
    return { value:v.code, label:v.label+' ('+v.code+')' }; });
}
function optsHl(){
  return S.hlIds.map(function(h){
    return { value:h.id, label:h.id+' — '+hlName(h.id) }; });
}
function todayOrHorizon(){
  return S.config.horizonStart || '';
}

/* ===================================================================
   Boot
   =================================================================== */
function boot(){
  call('initApp', [], function(init){
    S.user=init.user; S.ref=init.reference; S.carriers=init.carriers;
    S.methods=init.methods; S.surchargeTypes=init.surchargeTypes;
    S.calendar=init.calendar; S.hlIds=init.highLevelIds; S.mdIds=init.modellingIds;
    S.scenarios=init.scenarios; S.config=init.config; S.status=init.status;
    S.sel.hlId = S.hlIds.length ? S.hlIds[0].id : null;
    S.sel.asAt = S.config.horizonStart;

    document.getElementById('who').textContent = S.user.name+' · '+S.user.role;
    document.getElementById('boot').style.display='none';
    document.getElementById('app').style.display='block';
    renderNav(); renderStatus(); renderAll();

    call('loadAllAppData', [], function(d){
      S.rateBase=d.rateBase; S.rateSurcharge=d.rateSurcharge;
      S.mixMethod=d.mixMethod; S.mixLP=d.mixLetterParcel; S.mixCC=d.mixColdChain;
      S.output=d.output; S.validation=d.validation; S.recentAudit=d.recentAudit;
      S.actuals=d.actuals||[]; S.snapshots=d.snapshots||[];
      S.status=d.status; S.loaded=true;
      renderStatus(); renderAll();
    }, function(m){ showError('Could not load data: '+m); }, true);
  }, function(m){
    document.getElementById('boot').innerHTML =
      '<div class="err-box" style="max-width:520px;margin:0 auto;text-align:left">'+esc(m)+'</div>';
  }, true);
}

function renderNav(){

function renderStatus(){
  var p=document.getElementById('pending');

function renderAll(){

  h+='<div class="field" style="min-width:280px"><label>High Level ID</label>'+
     '<select id="rHl">'+S.hlIds.map(function(x){

     '</select></div>';

     '<button class="btn primary" id="bulkRates">Bulk update…</button></div>';
  h+='</div></div></div>';

  if(!S.sel.modellingId) return h+'<div class="card"><div class="empty">This High Level ID has no routes.</div></div>';
  var mid=S.sel.modellingId;

    (S.mdIds.filter(function(m){return m.id===mid;})[0]||{}).canEdit !== false;

  /* base rates */
  var base=S.rateBase.filter(function(r){return r.modellingId===mid;})
           .sort(function(a,b){return a.validFrom<b.validFrom?-1:1;});
  h+='<div class="card"><h2>Base rate'+
     (canEdit?'<button class="btn sm primary" id="addBase" style="float:right;margin-top:-3px">Add rate change</button>':'')+
     '</h2><div class="body" style="padding:0">';
  h+='<table><thead><tr><th>From</th><th>To</th><th class="right">Rate</th><th>Source</th><th></th></tr></thead><tbody>';
  if(!base.length) h+='<tr><td colspan="5" class="empty">No base rate. This route prices at zero.</td></tr>';
  base.forEach(function(r){
    h+='<tr><td class="num">'+esc(r.validFrom)+'</td><td class="num">'+
       (r.validTo>='9999-01-01'?'<span class="pill">open-ended</span>':esc(r.validTo))+'</td>'+
       '<td class="right num">'+money(r.value)+'</td><td class="muted small">'+esc(r.sourceRef)+'</td>'+
       '<td class="right">'+(canEdit?'<button class="btn sm" data-eb="'+r.id+'">Edit</button> '+
       '<button class="btn sm danger" data-db="'+r.id+'">Delete</button>':'')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  /* surcharges */
  var sur=S.rateSurcharge.filter(function(r){return r.modellingId===mid;})
          .sort(function(a,b){return (a.code+a.validFrom)<(b.code+b.validFrom)?-1:1;});
  h+='<div class="card"><h2>Surcharges'+
     (canEdit?'<button class="btn sm primary" id="addSur" style="float:right;margin-top:-3px">Add surcharge</button>':'')+
     '</h2><div class="body" style="padding:0">';
  h+='<table><thead><tr><th>Type</th><th>From</th><th>To</th><th class="right">Value</th><th></th></tr></thead><tbody>';
  if(!sur.length) h+='<tr><td colspan="5" class="empty">No surcharges on this route.</td></tr>';
  sur.forEach(function(r){
    var def=S.surchargeTypes.filter(function(s){return s.code===r.code;})[0]||{valueType:'AMT'};
    h+='<tr><td>'+esc(r.code)+'</td><td class="num">'+esc(r.validFrom)+'</td><td class="num">'+
       (r.validTo>='9999-01-01'?'<span class="pill">open-ended</span>':esc(r.validTo))+'</td>'+
       '<td class="right num">'+(def.valueType==='PCT'?pct(r.value,4):money(r.value))+'</td>'+
       '<td class="right">'+(canEdit?'<button class="btn sm" data-es="'+r.id+'">Edit</button> '+
       '<button class="btn sm danger" data-ds="'+r.id+'">Delete</button>':'')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  h+='<div class="card"><h2>Resolved by month <span class="small muted">— what the engine uses</span></h2>'+
     '<div class="body" style="padding:0"><div id="resolved">'+loading()+'</div></div></div>';
  return h;
}

function wireRates(){
  var hl=document.getElementById('rHl'), md=document.getElementById('rMd');
  if(hl) hl.onchange=function(){ S.sel.hlId=Number(hl.value); S.sel.modellingId=null; renderAll(); };
  if(md) md.onchange=function(){ S.sel.modellingId=Number(md.value); renderAll(); };

  /* Wired before the early return below: a bulk update is scoped by its own
     dimension selection, not by whichever route happens to be showing, so it works
     even on a segment with no routes. */

  if(!S.sel.modellingId) return;

  var add=document.getElementById('addBase');
  if(add) add.onclick=function(){ editBase(null); };
  var addS=document.getElementById('addSur');
  if(addS) addS.onclick=function(){ editSurcharge(null); };

    b.onclick=function(){ editBase(Number(b.getAttribute('data-eb'))); };});
  Array.prototype.forEach.call(document.querySelectorAll('[data-db]'),function(b){
    b.onclick=function(){ delBase(Number(b.getAttribute('data-db'))); };});
  Array.prototype.forEach.call(document.querySelectorAll('[data-es]'),function(b){
    b.onclick=function(){ editSurcharge(Number(b.getAttribute('data-es'))); };});
  Array.prototype.forEach.call(document.querySelectorAll('[data-ds]'),function(b){
    b.onclick=function(){ delSurcharge(Number(b.getAttribute('data-ds'))); };});

  call('getResolvedByMonth',[S.sel.modellingId,1],function(rows){
    var el=document.getElementById('resolved'); if(!el) return;
    if(!rows.length){ el.innerHTML='<div class="empty">Nothing to show.</div>'; return; }
    var h='<table><thead><tr><th>Month</th><th class="right">Base</th><th class="right">Surcharge %</th>'+
          '<th class="right">Surcharge amt</th><th class="right">Rate/parcel</th>'+
          '<th class="right">Mix</th><th class="right">Contribution</th></tr></thead><tbody>';
    var prev=null;
    rows.forEach(function(r){
      var moved = prev!==null && Math.abs(r.ratePerParcel-prev)>0.000001;
      h+='<tr'+(moved?' style="background:var(--brand-tint)"':'')+'>'+
         '<td>'+esc(r.month)+'</td>'+
         '<td class="right num">'+money(r.baseRate)+'</td>'+
         '<td class="right num">'+pct(r.surchargePct,4)+'</td>'+
         '<td class="right num">'+money(r.surchargeAmt)+'</td>'+
         '<td class="right num"><strong>'+money(r.ratePerParcel)+'</strong></td>'+
         '<td class="right num muted">'+pct(r.methodMix)+'</td>'+
         '<td class="right num">'+money(r.contribution)+'</td></tr>';
      prev=r.ratePerParcel;
    });
    h+='</tbody></table>';
    h+='<div class="small muted" style="padding:8px 12px">Highlighted rows are months where the '+
       'rate per parcel changes. A mid-month surcharge change shows here as a blended figure.</div>';
    el.innerHTML=h;
  }, function(m){
    var el=document.getElementById('resolved');
    if(el) el.innerHTML='<div class="empty">'+esc(m)+'</div>';
  }, true);
}

/* ---- bulk update ----
   The two selects at the top of this screen pick one route. This picks a set of
   them, and does it in two questions.

   First WHICH CHARGE: the base rate, one named surcharge, or all of them. That is
   a popup with no default and no way past it but to choose, because it decides
   what the value on the next page even means — a base rate is currency per
   parcel, fuel is a fraction, the rest are amounts.

   Then WHICH ROUTES: name a value for any dimension, or leave it as All. The
   change lands on every existing rate that matches, as a new period, exactly as
   "Add rate change" does for one route.

   Courier group is deliberately absent from the dimensions: a bulk change always
   spans every courier. Carrier_Code is a real, separate column on Modelling_IDs —
   it can disagree with the carrier Dim_Method files a method under, and validation
   only warns — but it was taken out of the selector by request, and the server
   ignores it rather than defaulting it.

   Nothing is written until the preview is confirmed, and confirming sends back the
   planKey the preview issued, so it can only ever apply the set that was shown. */

var BULK_DIMENSIONS = [
  { key:'brand',         label:'Brand',          ref:'BRAND' },
  { key:'geo',           label:'Country',        ref:'GEO' },
  { key:'treatmentType', label:'Treatment type', ref:'TREATMENT_TYPE' },
  { key:'wlSplit',       label:'WL split',       ref:'WL_SPLIT' },
  { key:'method',        label:'Method',         src:'methods' },
  { key:'letterParcel',  label:'Class',          ref:'LETTER_PARCEL' }
];

/* All is the empty value, never a magic string — a brand or method code called ALL
   is one data operation away, and a wildcard a data entry can impersonate is a
   wildcard waiting to widen somebody's rate change. */
function bulkDimOptions(d){
  var opts=[{ value:'', label:'All' }];
  if(d.src==='methods') S.methods.forEach(function(m){
    opts.push({ value:m.code, label:m.name+' ('+m.code+')' }); });
  else optsRef(d.ref).forEach(function(o){ opts.push(o); });
  return opts;
}

/* Step 1 — which charge. Base rate plus every active surcharge type, read from
   Dim_Surcharge on the server so a type added later needs no change here, plus
   All. No primary button: the choice is the action, so the only ways out are to
   pick one or to cancel. */
function bulkChargeTypePicker(){
  call('listChargeTypes',[],function(types){
    var b='<div class="tiles">';
    types.forEach(function(t){
      b+='<button data-ct="'+esc(t.chargeType)+'">'+
         '<span class="t">'+esc(t.name)+'</span>'+
         '<span class="s">'+esc(t.expressed)+'</span></button>';
    });
    b+='<button class="all" data-ct="ALL">'+
       '<span class="t">All charge types</span>'+
       '<span class="s">base rate and every surcharge — as a percentage uplift</span>'+
       '</button></div>';

    openForm({
      title:'Which charge are you changing?',
      intro:'A bulk change starts here, because what you type on the next page means '+
            'different things to different charges.',
      body:b,
      saveLabel:null,
      fields:[],
      afterRender:function(root, close){
        Array.prototype.forEach.call(root.querySelectorAll('[data-ct]'),function(btn){
          btn.onclick=function(){
            var ct=btn.getAttribute('data-ct');
            close();
            bulkRateForm(ct, types);
          };
        });
      }
    });
  });
}

/* Step 2 — which routes, and the new value. */
function bulkRateForm(chargeType, types, keep){
  var isAll = chargeType==='ALL';
  var def = (types||[]).filter(function(t){ return t.chargeType===chargeType; })[0] ||
            { name:chargeType, valueType:'RATE', expressed:'' };
  var prior = keep||{};
  var fields=[];

  BULK_DIMENSIONS.forEach(function(d,i){
    fields.push({ key:d.key, label:d.label, type:'select', value:prior[d.key]||'',
      options:bulkDimOptions(d),
      hint:i===0?'Leave a dimension as All to change every value of it. '+
                 'Every courier group is always included.':'' });
  });

  fields.push({ key:'validFrom', label:'Effective from', type:'date', required:true,
    value:prior.validFrom||todayOrHorizon(),
    hint:'Whatever period is running on each matching route is shortened to the day before.' });
  fields.push({ key:'validTo', label:'Until', type:'date', required:true, openEnded:true,
    value:prior.validTo||'9999-12-31' });

  if(isAll){
    fields.push({ key:'value', label:'Change every charge by', type:'number', step:'0.01',
      required:true, value:prior.value===undefined?'':prior.value, suffix:'%',
      placeholder:'6',
      hint:'A percentage, because one figure cannot be a base rate and a fuel '+
           'percentage at once. Negative to reduce.' });
  } else {
    fields.push({ key:'value', label:'New '+(def.valueType==='RATE'?'rate per parcel':'value'),
      type:'number', step:'0.0001', required:true,
      value:prior.value===undefined?'':prior.value,
      placeholder:def.valueType==='PCT'?'0.1650':(def.valueType==='RATE'?'3.7800':'0.0550'),
      hint:def.valueType==='PCT'?'A fraction: 0.14 for 14%.':'' });
  }

  fields.push({ key:'sourceRef', label:'Where it came from', type:'text',
    value:prior.sourceRef||'', placeholder:'RM 2026 tariff, p.4',
    hint:'Written to every row this changes, alongside the batch reference.' });

  openForm({
    title:'Bulk update — '+(isAll?'all charge types':def.name),
    intro:isAll
      ? 'Every existing charge matching the dimensions below moves by the percentage '+
        'you give. Nothing is written until you confirm the preview.'
      : 'Every existing '+esc(def.name).toLowerCase()+' matching the dimensions below '+
        'is superseded by a new period. Nothing is written until you confirm the preview.',
    saveLabel:'Preview',
    fields:fields,
    onSave:function(v, done, fail){
      var dims={};
      BULK_DIMENSIONS.forEach(function(d){ dims[d.key]=v[d.key]||''; });
      var req={ chargeType:chargeType, dimensions:dims,
                validFrom:v.validFrom, validTo:v.validTo, value:Number(v.value),
                sourceRef:v.sourceRef, scenarioId:1, preview:true };
      call('bulkUpdateRates',[req],function(pv){
        done();
        bulkRateConfirm(chargeType, types, req, pv, v);
      }, fail);
    }
  });
}

/* Step 3 — the preview, and the only place a write can be authorised. */
function bulkRateConfirm(chargeType, types, req, pv, raw){
  var isAll = pv.mode==='PCT';
  var name = function(ct){
    var t=(types||[]).filter(function(x){ return x.chargeType===ct; })[0];
    return t?t.name:ct;
  };
  var show = function(n){ return money(n); };

  if(!pv.count){
    openForm({
      title:'Nothing matches',
      intro:'That selection matches no existing charge to supersede.',
      body:'<table><tbody>'+
           '<tr><td>Routes matching the dimensions</td><td class="right num">'+pv.routesMatched+'</td></tr>'+
           '<tr><td>…with no rate to supersede</td><td class="right num">'+pv.skippedNoRate+'</td></tr>'+
           '<tr><td>…outside what you can edit</td><td class="right num">'+pv.skippedNoScope+'</td></tr>'+
           '</tbody></table>'+
           '<div class="warn">A bulk update only ever changes charges that already '+
           'exist. It will not create one for a route that has none — that gap is '+
           'worth seeing on this screen rather than filling in silently.</div>',
      saveLabel:'Change the selection',
      fields:[],
      onSave:function(v, done){ done(); bulkRateForm(chargeType, types, raw); }
    });
    return;
  }

  var rowsWord = pv.count===1 ? '1 charge' : pv.count+' charges';

/* Which years does the horizon cover, and which one are we in? */
function horizonYears(){
  var y={};
  S.calendar.filter(function(c){return c.inHorizon;}).forEach(function(c){
    y[Number(String(c.monthStart).slice(0,4))]=true; });
  return Object.keys(y).map(Number).sort(function(a,b){return a-b;});
}
function defaultDashYear(){
  var ys=horizonYears(), now=new Date().getFullYear();
  return ys.indexOf(now)>=0 ? now : (ys[0]||now);
}

/* ===================================================================
   Forecast vs actual by quarter — GB weight loss
   =================================================================== */

/* Segments that differ only by split — five of your pairs do. Worth surfacing,
   because they are usually identical and it matters when they stop being. */
function siblingSegments(hlId){
  var me=S.hlIds.filter(function(h){return h.id===hlId;})[0];
  if(!me) return [];
  return S.hlIds.filter(function(h){
    return h.id!==hlId && h.brand===me.brand && h.geo===me.geo &&
           h.treatmentType===me.treatmentType;
  }).sort(function(a,b){ return a.id-b.id; });
}

/* Opens on GB weight loss where it exists, since that is the one usually wanted. */
function defaultChartHl(){
  var gb=S.hlIds.filter(function(h){ return h.geo==='GB' && h.treatmentType==='WL'; })
                .sort(function(a,b){ return a.id-b.id; });
  if(gb.length) return gb[0].id;
  return S.hlIds.length ? S.hlIds[0].id : null;
}

/* Per-quarter mean forecast and mean actual for one segment and year. */
function quarterSeries(year, hlId){
  var months=S.calendar.filter(function(c){return c.inHorizon;});
  var q={1:[],2:[],3:[],4:[]};
  months.forEach(function(m){
    if(Number(String(m.monthStart).slice(0,4))!==year) return;
    var mm=Number(String(m.monthStart).slice(5,7));
    q[Math.ceil(mm/3)].push(m);
  });
  var fByDate={};
  S.output.forEach(function(r){ if(r.hlId===hlId) fByDate[r.dateId]=r.rate; });
  var aByMonth={};
  (S.actuals||[]).forEach(function(a){ if(a.hlId===hlId) aByMonth[a.monthStart]=a.blendedRate; });
  function mean(v){ return v.length ? v.reduce(function(x,y){return x+y;},0)/v.length : null; }
  return [1,2,3,4].map(function(n){
    var ms=q[n];
    return { q:n, label:'Q'+n+' '+String(year).slice(2), exists:ms.length>0,
      forecast: mean(ms.map(function(m){return fByDate[m.dateId];})
                       .filter(function(v){return v!==undefined;})),
      actual:   mean(ms.map(function(m){return aByMonth[m.monthStart];})
                       .filter(function(v){return v!==undefined;})) };
  });
}

/* Grouped bars as inline SVG. No chart library — one less dependency, and it
   keeps the whole interface in a single file. */
function groupedBars(data, show){
  var W=760, H=300, padL=58, padR=16, padT=16, padB=46;
  var plotW=W-padL-padR, plotH=H-padT-padB;

  var vals=[];
  data.forEach(function(d){
    if(show['f'+d.q] && d.forecast!==null) vals.push(d.forecast);
    if(show['a'+d.q] && d.actual!==null)   vals.push(d.actual);
  });
  if(!vals.length) return '<div class="empty">Nothing selected, or no data for those quarters.</div>';

  var max=Math.max.apply(null,vals);
  var step=Math.pow(10,Math.floor(Math.log(max)/Math.LN10))/2;
  var top=Math.ceil(max/step)*step;
  if(!(top>0)) top=1;

  var groupW=plotW/data.length;
  var y=function(v){ return padT+plotH-(v/top)*plotH; };

  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+
        '" style="display:block;max-width:'+W+'px" role="img" '+
        'aria-label="Forecast against actual blended rate per order, by quarter">';

  for(var g=0; g<=4; g++){
    var v=top*g/4, yy=y(v);
    s+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(padL+plotW)+'" y2="'+yy.toFixed(1)+
       '" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(padL-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" '+
       'font-size="11" fill="var(--ink-3)">'+v.toFixed(2)+'</text>';
  }

  data.forEach(function(d,i){
    var gx=padL+i*groupW;
    var bars=[];
    if(show['f'+d.q]) bars.push({v:d.forecast, c:'#0000FF', n:'Forecast'});
    if(show['a'+d.q]) bars.push({v:d.actual,   c:'#0B0B0F', n:'Actual'});
    var gap=(bars.length>1?6:0);
    var bw=Math.min(46,(groupW*0.62-gap)/Math.max(bars.length,1));
    var totalW=bw*bars.length+gap*(bars.length-1);
    var startX=gx+(groupW-totalW)/2;

    bars.forEach(function(b,j){
      var bx=startX+j*(bw+gap);
      if(b.v===null){
        // an absent actual is drawn as an outline, not omitted, so the gap is visible
        s+='<rect x="'+bx.toFixed(1)+'" y="'+(y(0)-14).toFixed(1)+'" width="'+bw.toFixed(1)+
           '" height="14" fill="none" stroke="'+b.c+'" stroke-width="1" '+
           'stroke-dasharray="3 2" opacity="0.4" rx="2"/>';
        s+='<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(y(0)-20).toFixed(1)+
           '" text-anchor="middle" font-size="10" fill="var(--ink-3)">none</text>';
        return;
      }
      var bh=Math.max(plotH-(y(b.v)-padT),1);
      s+='<rect x="'+bx.toFixed(1)+'" y="'+y(b.v).toFixed(1)+'" width="'+bw.toFixed(1)+
         '" height="'+bh.toFixed(1)+'" fill="'+b.c+'" rx="2"><title>'+
         d.label+' '+b.n+': '+b.v.toFixed(4)+'</title></rect>';
      s+='<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(y(b.v)-5).toFixed(1)+
         '" text-anchor="middle" font-size="10" fill="var(--ink-2)" '+
         'font-variant-numeric="tabular-nums">'+b.v.toFixed(2)+'</text>';
    });

    s+='<text x="'+(gx+groupW/2).toFixed(1)+'" y="'+(padT+plotH+20)+
       '" text-anchor="middle" font-size="12" fill="var(--ink-2)">'+d.label+'</text>';
  });

  s+='<line x1="'+padL+'" y1="'+y(0).toFixed(1)+'" x2="'+(padL+plotW)+'" y2="'+y(0).toFixed(1)+
     '" stroke="var(--line-2)" stroke-width="1"/></svg>';
  return s;
}

function viewRateChart(){
  if(!S.hlIds.length) return '<div class="card"><h2>Forecast against actual</h2>'+
         '<div class="empty">No segments defined.</div></div>';

  if(!S.sel.chartHl || !S.hlIds.some(function(h){return h.id===S.sel.chartHl;})){
    S.sel.chartHl=defaultChartHl();
  }
  var hlId=S.sel.chartHl;
  var seg=S.hlIds.filter(function(h){return h.id===hlId;})[0];
  var year=S.sel.dashYear||defaultDashYear();
  var data=quarterSeries(year, hlId);
  var show=S.sel.chartSeries||{};

  // does the segment that differs only by split still agree?
  var sibs=siblingSegments(hlId), divergence=null, sibName='';
  if(sibs.length){
    sibName=sibs[0].wlSplit;
    var other=quarterSeries(year, sibs[0].id), worst=0;
    data.forEach(function(d,i){
      if(d.forecast!==null && other[i].forecast!==null)
        worst=Math.max(worst, Math.abs(d.forecast-other[i].forecast));
    });
    if(worst>0.0001) divergence=worst;
  }

  var h='<div class="card"><h2>Forecast against actual'+
        '<span class="small muted" style="font-weight:400"> · blended rate per order</span></h2>';

  h+='<div class="body" style="padding:12px 16px;border-bottom:1px solid var(--line)">';
  h+='<div class="row" style="margin:0 0 12px 0">';
  h+='<div class="field" style="min-width:330px"><label>Segment</label>'+
     '<select id="chHl">'+S.hlIds.map(function(x){
        return '<option value="'+x.id+'"'+(x.id===hlId?' selected':'')+'>'+
               esc(x.brand+' · '+x.geo+' · '+treatmentLabel(x))+'</option>';}).join('')+
     '</select></div>';
  h+='<div class="field"><label>Year</label>'+
     '<select id="chYear">'+horizonYears().map(function(y){
        return '<option value="'+y+'"'+(y===year?' selected':'')+'>'+y+'</option>';}).join('')+
     '</select></div>';
  h+='</div>';

  h+='<div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start">';
  [['f','Forecast','#0000FF'],['a','Actual','#0B0B0F']].forEach(function(g){
    h+='<div><div class="small muted" style="margin-bottom:6px">'+
       '<span style="display:inline-block;width:10px;height:10px;background:'+g[2]+';'+
       'border-radius:2px;margin-right:6px"></span>'+g[1]+'</div>';
    h+='<div style="display:flex;gap:12px">'+[1,2,3,4].map(function(n){
       return '<label class="small" style="cursor:pointer;white-space:nowrap">'+
              '<input type="checkbox" data-cs="'+g[0]+n+'"'+
              (show[g[0]+n]?' checked':'')+'> Q'+n+'</label>'; }).join('')+'</div></div>';
  });
  h+='<div style="margin-left:auto;display:flex;gap:6px;align-self:flex-end">'+
     '<button class="btn sm" id="csAll">All</button>'+
     '<button class="btn sm" id="csF">Forecast only</button>'+
     '<button class="btn sm" id="csA">Actual only</button></div>';
  h+='</div></div>';

  h+='<div class="body">'+groupedBars(data, show)+'</div>';

  var anyActual=data.some(function(d){ return d.actual!==null; });
  h+='<div class="body small muted" style="border-top:1px solid var(--line)">';
  h+= anyActual
    ? 'Quarterly means of the monthly blended rate. Dashed outlines are quarters with no actuals recorded yet.'
    : ('No actuals recorded for '+esc(hlName(hlId))+' in '+year+' yet, so the dashed outlines '+
       'are placeholders. Add months on the Actuals tab and the black bars fill in.');
  if(divergence!==null){
    h+='<div style="margin-top:8px;color:var(--warn)"><strong>Note:</strong> '+
       esc(seg.wlSplit)+' and '+esc(sibName)+' no longer match — up to '+
       money(divergence)+' apart in '+year+'. They usually move together, so it is worth '+
       'checking whether that is intended.</div>';
  } else if(sibs.length){
    h+=' '+esc(seg.wlSplit)+' and '+esc(sibName)+' are identical here, so these bars cover both.';
  }
  h+='</div></div>';
  return h;
}

function wireRateChart(){
  var sel=document.getElementById('chHl');
  if(sel) sel.onchange=function(){ S.sel.chartHl=Number(sel.value); renderAll(); };
  var yr=document.getElementById('chYear');
  if(yr) yr.onchange=function(){ S.sel.dashYear=Number(yr.value); renderAll(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-cs]'),function(cb){
    cb.onchange=function(){
      S.sel.chartSeries[cb.getAttribute('data-cs')]=cb.checked;
      renderAll();
    };
  });
  function setAll(f,a){
    [1,2,3,4].forEach(function(n){
      S.sel.chartSeries['f'+n]=f; S.sel.chartSeries['a'+n]=a; });
    renderAll();
  }
  var b;
  if((b=document.getElementById('csAll'))) b.onclick=function(){ setAll(true,true); };
  if((b=document.getElementById('csF')))   b.onclick=function(){ setAll(true,false); };
  if((b=document.getElementById('csA')))   b.onclick=function(){ setAll(false,true); };
}

/* Treatment plus split in one column, so three columns still identify a segment.
   Brand + location + treatment alone is ambiguous for 10 of the 17 — MedExpress
   GB WL appears twice, differing only by Mounjaro vs WeGovy. */
function treatmentLabel(h){
  if(!h) return '';
  var t=h.treatmentType==='CORE_RX'?'Core Rx':h.treatmentType;
  if(!h.wlSplit || h.wlSplit==='*') return t;
  var s=h.wlSplit.charAt(0)+h.wlSplit.slice(1).toLowerCase();
  if(h.wlSplit==='WEGOVY') s='WeGovy';
  return t+' · '+s;
}

/* Dashboard: quarters of the chosen year. */
function outputSummary(){
  if(!S.output.length) return '<div class="empty">Nothing published yet.</div>';
  var ys=horizonYears();
  var year=S.sel.dashYear||defaultDashYear();
  var months=S.calendar.filter(function(c){return c.inHorizon;})
             .sort(function(a,b){return a.dateId-b.dateId;});
  var byHl={};
  S.output.forEach(function(r){ (byHl[r.hlId]=byHl[r.hlId]||{})[r.dateId]=r.rate; });

  var q={1:[],2:[],3:[],4:[]};
  months.forEach(function(m){
    if(Number(String(m.monthStart).slice(0,4))!==year) return;
    var mm=Number(String(m.monthStart).slice(5,7));
    q[Math.ceil(mm/3)].push(m.dateId);
  });

  var h='<div class="body" style="padding:12px 16px;border-bottom:1px solid var(--line)">';
  h+='<div class="row" style="margin:0"><div class="field"><label>Year</label>'+
     '<select id="dYear">'+ys.map(function(y){
        return '<option value="'+y+'"'+(y===year?' selected':'')+'>'+y+'</option>';}).join('')+
     '</select></div>';
  h+='<div class="small muted" style="align-self:flex-end;padding-bottom:6px">'+
     'Quarterly averages of the forecast rate per order.</div></div></div>';

  h+='<table><thead><tr><th>Brand</th><th>Location</th><th>Treatment</th>';
  [1,2,3,4].forEach(function(n){
    h+='<th class="right">Q'+n+' '+String(year).slice(2)+'</th>';
  });
  h+='<th class="right">Year avg</th><th class="right">Change</th></tr></thead><tbody>';

  function avg(ids,map){
    var v=ids.map(function(i){return map[i];}).filter(function(x){return x!==undefined;});
    if(!v.length) return null;
    return v.reduce(function(a,b){return a+b;},0)/v.length;
  }

  Object.keys(byHl).sort(function(a,b){return a-b;}).forEach(function(id){
    var map=byHl[id];
    var hl=S.hlIds.filter(function(x){return x.id===Number(id);})[0]||{};
    var any=months.some(function(m){return map[m.dateId]!==undefined;});
    if(!any) return;
    var qv=[1,2,3,4].map(function(n){ return avg(q[n],map); });
    var ya=avg([].concat(q[1],q[2],q[3],q[4]),map);
    var q1=qv[0], q4=qv[3];
    var ch=(q1&&q4)?((q4-q1)/q1*100):null;

    h+='<tr class="click" data-hl="'+id+'">'+
       '<td>'+esc(hl.brand||'')+'</td>'+
       '<td>'+esc(hl.geo||'')+'</td>'+
       '<td>'+esc(treatmentLabel(hl))+'</td>';
    qv.forEach(function(v){
      h+='<td class="right num">'+(v===null?'<span class="muted">—</span>':money(v))+'</td>';
    });
    h+='<td class="right num"><strong>'+(ya===null?'—':money(ya))+'</strong></td>';
    h+='<td class="right num '+(ch===null?'muted':(ch>0.005?'up':(ch<-0.005?'down':'muted')))+'">'+
       (ch===null?'—':((ch>0?'+':'')+ch.toFixed(1)+'%'))+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="small muted" style="padding:8px 12px">Change is Q4 against Q1 of '+year+
     '. Click a row to open that segment on the Rates tab.</div>';
  return h;
}

/* Full table: every month, nothing hidden. */
function outputTable(){
  if(!S.output.length) return '<div class="empty">Nothing published yet.</div>';
  var months=S.calendar.filter(function(c){return c.inHorizon;})
             .sort(function(a,b){return a.dateId-b.dateId;});
  var byHl={};
  S.output.forEach(function(r){ (byHl[r.hlId]=byHl[r.hlId]||{})[r.dateId]=r.rate; });

  var h='<div class="body" style="padding:10px 16px;border-bottom:1px solid var(--line)">'+
        '<div class="small muted" style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">'+
        '<span><span style="color:var(--brand-lo);font-weight:500">Blue heading</span>'+
        ' = peak-surcharge month (Nov to Jan)</span>'+
        '<span><span style="background:var(--brand-tint);padding:1px 8px;border-radius:3px">'+
        'Shaded cell</span> = rate changed from the month before</span>'+
        '</div></div>';
  h+='<div style="overflow-x:auto"><table><thead><tr>'+
        '<th style="position:sticky;left:0;background:var(--surface);z-index:1">High Level ID</th>';
  months.forEach(function(m){
    var peak = (m.label.indexOf('Dec-')===0 || m.label.indexOf('Jan-')===0 ||
                m.label.indexOf('Nov-')===0);
    h+='<th class="right"'+(peak?' style="color:var(--brand-lo)"':'')+'>'+esc(m.label)+'</th>';
  });
  h+='</tr></thead><tbody>';
  Object.keys(byHl).sort(function(a,b){return a-b;}).forEach(function(id){
    h+='<tr><td class="small" style="position:sticky;left:0;background:var(--surface)">'+
       id+' — '+esc(hlName(Number(id)))+'</td>';
    var prev=null;
    months.forEach(function(m){
      var v=byHl[id][m.dateId];
      var moved = prev!==null && v!==undefined && Math.abs(v-prev)>0.000001;
      h+='<td class="right num"'+(moved?' style="background:var(--brand-tint)"':'')+'>'+
         (v===undefined?'—':money(v,4))+'</td>';
      if(v!==undefined) prev=v;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function viewOutput(){
  if(!S.loaded) return '<div class="card"><div class="body">'+loading()+'</div></div>';
  var h='<div class="card"><div class="body"><div class="row" style="margin:0">';
  if(can('runCalc')) h+='<button class="btn" id="oPrev">Preview changes</button>';
  if(can('publishOutput')) h+='<button class="btn primary" id="oPub">Publish</button>';
  h+='<span class="small muted" style="margin-left:8px">Preview writes nothing.</span>';
  h+='</div></div></div>';
  h+='<div id="oResult"></div>';

     outputTable()+'</div></div>';

function wireOutput(){
  var p=document.getElementById('oPrev');
  if(p) p.onclick=function(){
    document.getElementById('oResult').innerHTML='<div class="card"><div class="body">'+loading()+'</div></div>';
    call('previewOutput',[1],function(r){
      var h='<div class="card"><h2>Preview — nothing written</h2><div class="body">';
      if(!r.changes.length && !r.added){ h+='<div class="muted">Nothing would change.</div>'; }
      else{
        h+='<div class="small muted" style="margin-bottom:10px">'+r.changes.length+
           ' row(s) would change, '+r.added+' new, '+r.unchanged+' unchanged.</div>';
        h+='<table><thead><tr><th>High Level ID</th><th>Month</th><th class="right">Before</th>'+
           '<th class="right">After</th><th class="right">Change</th></tr></thead><tbody>';
        r.changes.slice(0,40).forEach(function(c){
          h+='<tr><td class="small">'+c.hlId+'</td><td>'+esc(c.label)+'</td>'+
             '<td class="right num">'+money(c.before)+'</td><td class="right num">'+money(c.after)+'</td>'+
             '<td class="right num '+(c.diff>0?'up':'down')+'">'+(c.diff>0?'+':'')+money(c.diff)+
             ' ('+c.pct.toFixed(2)+'%)</td></tr>';
        });
        h+='</tbody></table>';
      }
      h+='</div></div>';
      document.getElementById('oResult').innerHTML=h;
    });
  };
  var pb=document.getElementById('oPub');
  if(pb) pb.onclick=function(){
    if(!confirm('Publish the forecast? This overwrites OUTPUT and OUTPUT_Detail.')) return;
    document.getElementById('oResult').innerHTML='<div class="card"><div class="body">'+loading()+'</div></div>';
    call('publishOutput',[1],function(r){
      if(r.blocked){
        document.getElementById('oResult').innerHTML=
          '<div class="card"><div class="body"><div class="err-box">Publish blocked — '+
          r.validation.counts.ERROR+' validation error(s). Nothing was written.</div></div></div>';
        return;
      }
      document.getElementById('oResult').innerHTML=
        '<div class="card"><div class="body"><div class="ok-box">Published run '+r.calcRunId+
        ' — '+r.rows+' rows.</div></div></div>';
      reloadData();
    });
  };
}

/* ---- reference lists: brand, geo, treatment type, WL split, currency ---- */
var LIST_LABELS = {
  BRAND:'Brand', GEO:'Geography', TREATMENT_TYPE:'Treatment type',
  WL_SPLIT:'Weight-loss split', CURRENCY:'Currency',
  LETTER_PARCEL:'Letter / parcel', TEMP_REGIME:'Temperature regime'
};
var LIST_LOCKED = { LETTER_PARCEL:1, TEMP_REGIME:1 };

var refUsage=null;

function viewAdminLists(){
  var h='';
  Object.keys(LIST_LABELS).forEach(function(name){
    var vals=(S.ref[name]||[]);
    var locked=LIST_LOCKED[name];
    h+='<div class="card"><h2>'+esc(LIST_LABELS[name])+
       '<span class="small muted" style="font-weight:400"> — '+name+'</span>'+
       (locked?'<span class="pill" style="float:right">fixed</span>'
              :'<button class="btn sm primary" data-addref="'+name+'" style="float:right;margin-top:-3px">Add</button>')+
       '</h2><div class="body" style="padding:0">';
    h+='<table><thead><tr><th style="width:200px">Code</th><th>Label</th>'+
       '<th class="right" style="width:110px">Used by</th>'+
       '<th style="width:150px"></th></tr></thead><tbody>';
    if(!vals.length) h+='<tr><td colspan="4" class="empty">Nothing yet.</td></tr>';
    vals.forEach(function(v){
      var u = refUsage ? refUsage[name+'|'+v.code] : null;
      var n = u ? u.total : null;
      h+='<tr><td class="num">'+esc(v.code)+'</td><td>'+esc(v.label)+'</td>'+
         '<td class="right num '+(n===0?'muted':'')+'">'+
           (n===null?'<span class="muted">…</span>':(n||'—'))+'</td>'+
         '<td class="right">';
      if(!locked && u){
        h+='<button class="btn sm" data-editref="'+u.id+'" data-l="'+name+'">Edit</button> ';
        h+='<button class="btn sm danger" data-delref="'+u.id+'" '+
           (n>0?'disabled title="In use — cannot be removed"':'')+'>Remove</button>';
      }
      h+='</td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  h+='<div class="card"><div class="body small muted">'+
     '<strong style="color:var(--ink)">Labels can always be changed.</strong> A code can only '+
     'be changed while nothing refers to it — once it is in use, renaming it would orphan every '+
     'row pointing at it, so add a new one and move the rows across instead. Letter/parcel and '+
     'temperature regime are fixed entirely, because the calculation branches on those names.'+
     '</div></div>';
  return h;
}

function wireAdminLists(){
  if(!refUsage){
    call('getReferenceUsage',[],function(u){ refUsage=u; renderAll(); },null,true);
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-addref]'),function(b){
    b.onclick=function(){ editRef(null, b.getAttribute('data-addref')); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-editref]'),function(b){
    b.onclick=function(){ editRef(Number(b.getAttribute('data-editref')), b.getAttribute('data-l')); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-delref]'),function(b){
    if(b.disabled) return;
    b.onclick=function(){
      if(!confirm('Remove this value? It disappears from the dropdowns but stays in the '+
                  'change log.')) return;
      call('deleteReferenceValue',[Number(b.getAttribute('data-delref'))],function(res){
        showOk('Removed '+res.code+'.'); refUsage=null; reloadInit();
      });
    };
  });
}

function editRef(id, list){
  var existing=null, usage=null;
  if(id){
    Object.keys(refUsage||{}).forEach(function(k){
      if(refUsage[k].id===id){
        usage=refUsage[k];
        var parts=k.split('|');
        list=parts[0];
        existing=(S.ref[list]||[]).filter(function(v){return v.code===parts[1];})[0];
      }
    });
  }
  var inUse = usage && usage.total>0;
  openForm({
    title:(id?'Edit '+LIST_LABELS[list]:'Add to '+LIST_LABELS[list]),
    intro: inUse
      ? 'This code is used by '+usage.where.map(function(w){return w.count+' '+w.label;}).join(', ')+
        ', so it cannot be renamed — every one of those rows points at it. The label is free to change.'
      : 'The code becomes permanent once something refers to it. Nothing does yet, so it can '+
        'still be corrected.',
    saveLabel:(id?'Save':'Add'),
    fields:[
      {key:'code', label:'Code'+(inUse?' (locked — in use)':''), type:'text', required:true,
       value: existing?existing.code:'', placeholder:'NL',
       readonly: inUse,
       hint: inUse ? 'Add a new code and move the rows across if this really needs to change.'
                   : 'Letters, digits and underscores. Uppercase.'},
      {key:'label', label:'Label', type:'text', required:true,
       value: existing?existing.label:'', placeholder:'Netherlands',
       hint:'What people see in the dropdowns.'},
      {key:'sortOrder', label:'Position in the list', type:'number', step:'10', min:0,
       value: existing?existing.sort:'',
       hint:'Lower appears first. Leave blank to add at the end.'}
    ],
    onSave:function(v, done, fail){
      call('saveReferenceValue',[{ id:id||0, listName:list,
        code: inUse ? existing.code : v.code,
        label:v.label, sortOrder:Number(v.sortOrder||0) }],
        function(res){ done();
          showOk((res.isNew?'Added ':'Updated ')+res.code+'.');
          refUsage=null; reloadInit(); }, fail);
    }
  });
}

function showCopyPreview(r, opts){
  var rows=[['Base rates', r.counts.rateBase, r.skipped.rateBase],
            ['Surcharges', r.counts.rateSurcharge, r.skipped.rateSurcharge],
            ['Method mixes', r.counts.mixMethod, r.skipped.mixMethod],
            ['Letter/parcel split', r.counts.mixLetterParcel, r.skipped.mixLP]];
  var intro='<strong>'+r.matchedRoutes+' route(s) paired up.</strong><br>';
  var tbl='<table style="margin-top:10px;font-size:13px"><tr>'+
          '<th style="text-align:left">What</th><th class="right">To copy</th>'+
          '<th class="right">Skipped</th></tr>';
  rows.forEach(function(x){
    tbl+='<tr><td>'+x[0]+'</td><td class="right num">'+x[1]+'</td>'+
         '<td class="right num muted">'+(x[2]||'—')+'</td></tr>';
  });
  tbl+='</table>';

  var warn='';
  if(r.missingInTarget.length){
    warn+='<div style="margin-top:10px;color:var(--warn)"><strong>'+r.missingInTarget.length+
          ' route(s) have no partner here:</strong><br>'+
          esc(r.missingInTarget.slice(0,6).join(', '))+
          (r.missingInTarget.length>6?' and '+(r.missingInTarget.length-6)+' more':'')+'</div>';
  }
  if(r.extraInTarget.length){
    warn+='<div style="margin-top:8px;color:var(--ink-3)">'+r.extraInTarget.length+
          ' route(s) here have no equivalent in the source, so they get nothing: '+
          esc(r.extraInTarget.slice(0,4).join(', '))+'</div>';
  }
  if(r.mixWarning){
    warn+='<div style="margin-top:10px;color:var(--err)"><strong>'+esc(r.mixWarning)+'</strong></div>';
  }
  if(!r.total){
    warn+='<div style="margin-top:10px">Nothing would be copied. Everything is either already '+
          'there, or no routes pair up.</div>';
  }

  openForm({
    title:'Copy '+r.total+' row(s)?',
    intro: intro+tbl+warn+
      '<div style="margin-top:10px;color:var(--ink-3)">Every row created is marked '+
      '"Copied from High Level ID '+opts.fromHlId+'" in its notes, so a rate that was never '+
      'actually negotiated can be found later.</div>',
    saveLabel: r.total ? ('Copy '+r.total+' rows') : 'Nothing to copy',
    fields:[],
    onSave:function(v, done, fail){
      if(!r.total){ done(); return; }
      opts.preview=false;
      call('copySegmentData',[opts],function(res){
        done();
        showOk('Copied '+res.written+' row(s). Check the mix totals 100%, then publish.');
        reloadData();
      }, fail);
    }
  });
}

/* Reload the structural payload as well as the data — new dimensions and IDs
   arrive through initApp, not loadAllAppData. */
function reloadInit(){
  call('initApp',[],function(init){
    S.ref=init.reference; S.carriers=init.carriers; S.methods=init.methods;
    S.surchargeTypes=init.surchargeTypes; S.hlIds=init.highLevelIds;
    S.mdIds=init.modellingIds; S.scenarios=init.scenarios; S.status=init.status;
    reloadData();
  },null,true);
}

function wireActuals(){
  var a=document.getElementById('aAdd');
  if(a) a.onclick=function(){ editActual(null); };
  loadComparison();
}

function loadComparison(){
  var host=document.getElementById('aHost'); if(!host) return;
  call('getActualsComparison',[1],function(r){ cmp=r; renderComparison(); },
    function(m){ host.innerHTML='<div class="card"><div class="empty">'+esc(m)+'</div></div>'; },true);
}

function renderComparison(){
  var host=document.getElementById('aHost'); if(!host||!cmp) return;
  var s=cmp.summary, h='';

  if(!cmp.rows.length){
    h+='<div class="card"><div class="empty">No actuals recorded yet.<br><br>'+
       '<span class="small">Add a month above, or import from Metabase once the '+
       'connection is proven — see the note at the bottom of this screen.</span></div></div>';
  } else {
    h+='<div class="grid2">';
    h+='<div class="card"><h2>Against forecast</h2><div class="body">';
    h+='<div style="display:flex;gap:26px;flex-wrap:wrap">';
    h+='<div><div class="small muted">Months compared</div>'+
       '<div style="font-size:22px" class="num">'+s.matched+'</div></div>';
    h+='<div><div class="small muted">Mean forecast</div>'+
       '<div style="font-size:22px" class="num">'+(s.meanForecast===null?'—':money(s.meanForecast))+'</div></div>';
    h+='<div><div class="small muted">Mean actual</div>'+
       '<div style="font-size:22px" class="num">'+(s.meanActual===null?'—':money(s.meanActual))+'</div></div>';
    h+='<div><div class="small muted">Variance</div>'+
       '<div style="font-size:22px" class="num '+
       (s.meanVariancePct===null?'muted':(s.meanVariancePct>0?'up':'down'))+'">'+
       (s.meanVariancePct===null?'—':((s.meanVariancePct>0?'+':'')+(s.meanVariancePct*100).toFixed(1)+'%'))+
       '</div></div>';
    h+='</div>';
    h+='<div class="small muted" style="margin-top:12px">A positive variance means postage '+
       'cost more than the model predicted. '+s.withinTolerance+' of '+s.matched+
       ' months are within the '+(s.tolerancePct*100).toFixed(0)+'% tolerance set in Config.</div>';
    h+='</div></div>';

    h+='<div class="card"><h2>Volume-weighted</h2><div class="body">';
    if(s.weightedActual===null){
      h+='<div class="muted small">No order counts recorded, so only the simple mean is '+
         'available. Enter orders and total spend rather than a rate and the weighted '+
         'figure becomes possible — which is the one that matters for a budget, since a '+
         'heavy month should count for more than a light one.</div>';
    } else {
      h+='<div style="display:flex;gap:26px;flex-wrap:wrap">';
      h+='<div><div class="small muted">Weighted actual rate</div>'+
         '<div style="font-size:22px" class="num">'+money(s.weightedActual)+'</div></div>';
      h+='<div><div class="small muted">Orders</div>'+
         '<div style="font-size:22px" class="num">'+Math.round(s.totalOrders).toLocaleString()+'</div></div>';
      h+='</div>';
      h+='<div class="small muted" style="margin-top:12px">Total spend divided by total '+
         'orders across every month recorded.</div>';
    }
    h+='</div></div></div>';

    h+='<div class="card"><h2>Month by month</h2><div class="body" style="padding:0">';
    h+='<table><thead><tr><th>Brand</th><th>Location</th><th>Treatment</th><th>Month</th>'+
       '<th class="right">Forecast</th><th class="right">Actual</th>'+
       '<th class="right">Variance</th><th class="right">Orders</th>'+
       '<th>Source</th><th></th></tr></thead><tbody>';
    cmp.rows.forEach(function(r){
      var hl=S.hlIds.filter(function(x){return x.id===r.hlId;})[0]||{};
      var over=r.flag==='OVER_TOLERANCE', none=r.flag==='NO_FORECAST';
      h+='<tr'+(over?' style="background:#FFF9EC"':'')+'>'+
         '<td class="small">'+esc(hl.brand||'')+'</td>'+
         '<td class="small">'+esc(hl.geo||'')+'</td>'+
         '<td class="small">'+esc(treatmentLabel(hl))+'</td>'+
         '<td class="num">'+esc(r.month)+'</td>'+
         '<td class="right num">'+(r.forecast===null?
            '<span class="sev WARN">no forecast</span>':money(r.forecast))+'</td>'+
         '<td class="right num"><strong>'+money(r.actual)+'</strong></td>'+
         '<td class="right num '+(r.variance===null?'muted':(r.variance>0?'up':'down'))+'">'+
            (r.variance===null?'—':((r.variance>0?'+':'')+money(r.variance)+
            ' ('+(r.variancePct>0?'+':'')+(r.variancePct*100).toFixed(1)+'%)'))+'</td>'+
         '<td class="right num muted">'+(r.orders?Math.round(r.orders).toLocaleString():'—')+'</td>'+
         '<td class="small muted">'+esc(r.source)+'</td>'+
         '<td class="right">'+(cmp.canEdit?
            '<button class="btn sm" data-ea="'+r.id+'">Edit</button> '+
            '<button class="btn sm danger" data-da="'+r.id+'">Delete</button>':'')+'</td></tr>';
    });
    h+='</tbody></table>';
    h+='<div class="small muted" style="padding:8px 12px">Shaded rows are outside the '+
       'tolerance. "No forecast" means an actual exists for a month the model has not '+
       'published — check the month is inside the horizon and the forecast has been run.</div>';
    h+='</div></div>';
  }

  h+='<div class="card"><h2>Automatic feed from Metabase</h2><div class="body small muted">'+
     '<p style="margin-top:0">Not connected yet, on purpose. Two things have to be true first, '+
     'and neither can be assumed:</p>'+
     '<p><strong style="color:var(--ink)">1. Google has to be able to reach Metabase.</strong> '+
     'Apps Script runs on Google servers, not inside your network. If Metabase is VPN-only or '+
     'IP-allowlisted it cannot be reached, and no code fixes that. Run '+
     '<code>testMetabaseConnection</code> from the editor to find out in about three seconds.</p>'+
     '<p><strong style="color:var(--ink)">2. The grain has to line up.</strong> The forecast is '+
     'a rate per order at brand, location, treatment and split. Metabase will return whatever '+
     'shape the warehouse uses. Run <code>previewMetabaseCard</code> to see the columns, send '+
     'them over, and the mapping can be written.</p>'+
     '<p style="margin-bottom:0">Until then, entering months by hand works and gives you the '+
     'same comparison.</p>'+
     '</div></div>';

  host.innerHTML=h;

  Array.prototype.forEach.call(document.querySelectorAll('[data-ea]'),function(b){
    b.onclick=function(){ editActual(Number(b.getAttribute('data-ea'))); };});
  Array.prototype.forEach.call(document.querySelectorAll('[data-da]'),function(b){
    b.onclick=function(){
      if(!confirm('Delete this actual?')) return;
      call('deleteActual',[Number(b.getAttribute('data-da'))],function(){
        showOk('Deleted.'); loadComparison(); reloadData(); });
    };});
}

function editActual(id){
  var r = id ? (cmp && cmp.rows.filter(function(x){return x.id===id;})[0]) : null;
  openForm({
    title:(id?'Edit actuals':'Add or update a month of actuals'),
    intro:'Enter orders and total spend and the blended rate is worked out as spend divided '+
          'by orders, so the three cannot drift apart. A rate on its own is accepted, but '+
          'then the volume-weighted comparison is not available.',
    fields:[
      {key:'hlId', label:'Segment', type:'select', required:true,
       value:r?r.hlId:(S.sel.hlId||''), options:optsHl()},
      {key:'monthStart', label:'Month', type:'date', required:true,
       value:r?r.monthStart:'', hint:'Use the 1st of the month.'},
      {key:'orders', label:'Orders', type:'number', min:0, step:'1',
       value:r&&r.orders?r.orders:'', placeholder:'12500'},
      {key:'totalSpend', label:'Total postage spend', type:'number', min:0, step:'0.01',
       value:r&&r.totalSpend?r.totalSpend:'', placeholder:'38500.00'},
      {key:'blendedRate', label:'Or the blended rate directly', type:'number', min:0, step:'0.0001',
       value:'', placeholder:'3.0800',
       hint:'Only needed if you do not have orders and spend.'}
    ],
    onSave:function(v, done, fail){
      if(!Number(v.orders) && !Number(v.blendedRate)){
        return fail('Enter either orders and total spend, or a blended rate.');
      }
      call('saveActual',[{ id:id||0, hlId:Number(v.hlId), monthStart:v.monthStart,
        orders:Number(v.orders||0), totalSpend:Number(v.totalSpend||0),
        blendedRate:Number(v.blendedRate||0) }],
        function(res){ done();
          showOk('Saved — blended rate '+money(res.blendedRate)+
                 (res.derived?' (spend divided by orders)':' (as entered)')+'.');
          loadComparison(); reloadData(); }, fail);
    }
  });
}

/* ===================================================================
   History — forecast snapshots, and the change log
   =================================================================== */
var snapDiff=null;

function viewHistory(){
  if(!S.loaded) return '<div class="card"><div class="body">'+loading()+'</div></div>';
  var sec=S.sel.histSection||'snapshots';
  var tabs=[['snapshots','Forecast over time'],['audit','Change log']];
  var h='<div class="card"><div class="body" style="padding:10px 12px">';
  h+='<div style="display:flex;gap:2px">'+tabs.map(function(t){
     return '<button class="btn sm'+(sec===t[0]?' primary':'')+'" data-hs="'+t[0]+'">'+
            t[1]+'</button>'; }).join('')+'</div></div></div>';
  if(sec==='snapshots') h+=viewSnapshots();
  if(sec==='audit')     h+=viewAuditLog();
  return h;
}
function wireHistory(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-hs]'),function(b){
    b.onclick=function(){ S.sel.histSection=b.getAttribute('data-hs'); renderAll(); };
  });
  if((S.sel.histSection||'snapshots')==='snapshots') wireSnapshots();
}

/* ---- forecast snapshots ---- */
function viewSnapshots(){
  var h='<div class="card"><div class="body"><div class="row" style="margin:0">';
  if(can('runCalc')) h+='<button class="btn primary" id="snapNow">Take a snapshot now</button>';
  h+='<span class="small muted" style="align-self:center">A snapshot is taken automatically '+
     'each Monday, but only stored when the forecast has actually moved.</span>';
  h+='</div></div></div>';

  h+='<div class="card"><h2>Snapshots</h2><div class="body" style="padding:0">';
  if(!S.snapshots.length){
    h+='<div class="empty">None yet.<br><br><span class="small">Take one above to start the '+
       'record, and ask whoever set the portal up to run <code>installWeeklySnapshot</code> '+
       'once so it happens on its own.</span></div>';
  } else {
    h+='<table><thead><tr><th class="right" style="width:50px">ID</th><th>Taken</th>'+
       '<th>By</th><th>How</th><th>Label</th><th class="right">Rows changed</th>'+
       '<th></th></tr></thead><tbody>';
    S.snapshots.forEach(function(s,i){
      h+='<tr><td class="right num">'+s.id+'</td><td class="num small">'+esc(s.ts)+'</td>'+
         '<td class="small muted">'+esc(s.by)+'</td>'+
         '<td class="small">'+(s.trigger==='WEEKLY'?'<span class="pill">weekly</span>':'manual')+'</td>'+
         '<td class="small">'+esc(s.label)+'</td>'+
         '<td class="right num">'+(s.changed||'—')+'</td>'+
         '<td class="right"><button class="btn sm" data-snap="'+s.id+'">'+
         (i===0?'Compare with now':'Compare with next')+'</button></td></tr>';
    });
    h+='</tbody></table>';
    h+='<div class="small muted" style="padding:8px 12px">Gaps in the dates are the point: a '+
       'week with no entry is a week the forecast did not move. "Rows changed" counts how many '+
       'of the 612 segment-months differed from the snapshot before it.</div>';
  }
  h+='</div></div>';
  h+='<div id="snapHost"></div>';
  return h;
}

function wireSnapshots(){
  var b=document.getElementById('snapNow');
  if(b) b.onclick=function(){
    openForm({
      title:'Take a snapshot',
      intro:'Records what the forecast says right now, so a later change can be traced back. '+
            'Nothing is stored if the numbers have not moved since the last one.',
      saveLabel:'Take snapshot',
      fields:[
        {key:'label', label:'Label', type:'text', placeholder:'before RM April uplift',
         hint:'Optional, but it is how you will find this one again.'}
      ],
      onSave:function(v, done, fail){
        call('takeForecastSnapshot',[v.label],function(r){
          done();
          if(r.stored) showOk('Snapshot '+r.snapshotId+' stored — '+r.changedRows+' rows changed.');
          else showOk(r.reason||'Nothing stored — the forecast has not moved.');
          reloadData();
        }, fail);
      }
    });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-snap]'),function(btn){
    btn.onclick=function(){
      var id=Number(btn.getAttribute('data-snap'));
      var idx=S.snapshots.map(function(s){return s.id;}).indexOf(id);
      var toId = idx===0 ? 0 : S.snapshots[idx-1].id;   // list is newest first
      var host=document.getElementById('snapHost');
      host.innerHTML='<div class="card"><div class="body">'+loading()+'</div></div>';
      call('compareSnapshots',[id,toId],function(r){ snapDiff=r; renderSnapDiff(); },
        function(m){ host.innerHTML='<div class="card"><div class="empty">'+esc(m)+'</div></div>'; },true);
    };
  });
}

function renderSnapDiff(){
  var host=document.getElementById('snapHost'); if(!host||!snapDiff) return;
  var d=snapDiff;
  var toLabel = d.toId ? ('snapshot '+d.toId) : 'the forecast as it stands now';
  var h='<div class="card"><h2>Snapshot '+d.fromId+' compared with '+toLabel+'</h2>';
  h+='<div class="body">';
  h+='<div style="display:flex;gap:26px;flex-wrap:wrap">';
  h+='<div><div class="small muted">Segment-months changed</div>'+
     '<div style="font-size:22px" class="num">'+d.changed+'</div></div>';
  h+='<div><div class="small muted">Unchanged</div>'+
     '<div style="font-size:22px" class="num muted">'+d.unchanged+'</div></div>';
  h+='</div>';
  if(!d.changed) h+='<div class="small muted" style="margin-top:10px">Identical. '+
     'Nothing about the rates or mixes moved the forecast between these two points.</div>';
  h+='</div>';

  if(d.segments.length){
    h+='<div class="body" style="padding:0;border-top:1px solid var(--line)">';
    h+='<table><thead><tr><th>Brand</th><th>Location</th><th>Treatment</th>'+
       '<th class="right">Months affected</th><th class="right">Mean change</th>'+
       '</tr></thead><tbody>';
    d.segments.forEach(function(s){
      var hl=S.hlIds.filter(function(x){return x.id===s.hlId;})[0]||{};
      h+='<tr><td class="small">'+esc(hl.brand||'')+'</td>'+
         '<td class="small">'+esc(hl.geo||'')+'</td>'+
         '<td class="small">'+esc(treatmentLabel(hl))+'</td>'+
         '<td class="right num">'+s.months+'</td>'+
         '<td class="right num '+(s.meanDiff>0?'up':'down')+'">'+
         (s.meanDiff>0?'+':'')+money(s.meanDiff)+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  if(d.diffs.length){
    h+='<div class="body" style="padding:0;border-top:1px solid var(--line)">';
    h+='<table><thead><tr><th>Brand</th><th>Treatment</th><th>Month</th>'+
       '<th class="right">Before</th><th class="right">After</th>'+
       '<th class="right">Change</th></tr></thead><tbody>';
    d.diffs.slice(0,60).forEach(function(r){
      var hl=S.hlIds.filter(function(x){return x.id===r.hlId;})[0]||{};
      h+='<tr><td class="small">'+esc(hl.brand||'')+'</td>'+
         '<td class="small">'+esc(treatmentLabel(hl))+'</td>'+
         '<td class="num">'+esc(r.month)+'</td>'+
         '<td class="right num">'+(r.before===null?'—':money(r.before))+'</td>'+
         '<td class="right num">'+(r.after===null?'—':money(r.after))+'</td>'+
         '<td class="right num '+(r.diff===null?'muted':(r.diff>0?'up':'down'))+'">'+
         (r.diff===null?'new/removed':((r.diff>0?'+':'')+money(r.diff)+
         (r.pct===null?'':' ('+(r.pct>0?'+':'')+r.pct.toFixed(1)+'%)')))+'</td></tr>';
    });
    h+='</tbody></table>';
    if(d.diffs.length>60) h+='<div class="small muted" style="padding:8px 12px">'+
       'Showing the 60 largest of '+d.diffs.length+' changes.</div>';
    h+='</div>';
  }
  h+='</div>';
  host.innerHTML=h;
}

/* ---- the change log ---- */
function viewAuditLog(){
  var h='<div class="card"><h2>Recent changes</h2><div class="body" style="padding:0">';
  if(!S.recentAudit.length) h+='<div class="empty">Nothing recorded yet.</div>';
  else{
    h+='<table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>What</th>'+
       '<th>Field</th><th>From</th><th>To</th><th>Batch</th></tr></thead><tbody>';
    S.recentAudit.forEach(function(a){
      /* Rows written by one bulk action all carry its reference in Detail, so a
         change made to fifty routes at once reads as one thing somebody did. */
      var batch=/^BULK-/.test(a.detail||'')?String(a.detail).split(' ')[0]:'';
      h+='<tr'+(a.success?'':' style="opacity:.6"')+'><td class="small num">'+esc(a.ts)+'</td>'+
         '<td class="small">'+esc(a.email)+'</td>'+
         '<td class="small">'+esc(a.action)+'</td>'+
         '<td class="small">'+esc(a.entity)+' '+esc(a.entityId)+'</td>'+
         '<td class="small muted">'+esc(a.field)+'</td>'+
         '<td class="small num">'+esc(a.oldValue)+'</td>'+
         '<td class="small num">'+esc(a.newValue||(batch?'':a.detail))+'</td>'+
         '<td class="small muted num">'+(batch?'<span class="pill">'+esc(batch)+'</span>':'')+'</td></tr>';
    });
    h+='</tbody></table>';
    h+='<div class="small muted" style="padding:8px 12px">Faded rows are attempts that were '+
       'refused. Rows sharing a batch reference were one bulk update, not separate edits. '+
       'Snapshots say what the forecast did; this says what somebody changed.</div>';
  }
  h+='</div></div>';
  return h;
}

boot();
</script>
</body>
</html>
